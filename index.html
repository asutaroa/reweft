<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reweft: Circular Textile Exchange (Prototype)</title>
<meta name="description" content="Prototype B2B exchange where textile companies list deadstock, state what they need, and join 2, 3 and 4-way circular exchanges. Fictional demo data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231f4d3a' stroke-width='4'/%3E%3Cpath d='M16 5a11 11 0 0 1 9.5 16.5' fill='none' stroke='%23b0603a' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f6f4ef; --panel: #fffefb; --panel-2: #f1eee7; --line: #e5e1d7; --line-2: #d6d1c4;
  --ink: #191a17; --ink-2: #55564f; --ink-3: #7c7c72;
  --brand: #1f4d3a; --brand-2: #2f6b52; --brand-soft: #e4ede7; --clay: #b0603a; --clay-soft: #f6e8df;
  --ok: #1f7a4d; --ok-soft: #e2f1e8; --warn: #9a6a0c; --warn-soft: #f8efd9; --bad: #a93a32; --bad-soft: #f8e5e2;
  --radius: 14px; --radius-s: 9px;
  --shadow: 0 1px 2px rgba(25,26,23,.05), 0 6px 22px rgba(25,26,23,.05);
  --shadow-l: 0 12px 44px rgba(25,26,23,.18);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font: 500 30px/1.15 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
h2 { font: 500 21px/1.2 var(--serif); letter-spacing: -.005em; }
h3 { font-size: 15px; font-weight: 620; line-height: 1.3; }
h4 { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 12.5px; } .num { font-variant-numeric: tabular-nums; }

/* Shell */
main { min-width: 0; padding: 28px 36px 80px; max-width: 1280px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 7px 36px; font-size: 12.5px; color: var(--ink-2); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { color: var(--ink-2); margin-top: 5px; max-width: 66ch; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-weight: 550; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn.danger { color: var(--bad); border-color: #e4c3bf; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); padding: 6px 8px; }
.btn.ghost:hover { background: var(--panel-2); color: var(--ink); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
input[type="text"], input[type="search"], input[type="number"], select, textarea { width: 100%; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; font-size: 13.5px; }
textarea { min-height: 62px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .lab { font-size: 12.5px; font-weight: 550; color: var(--ink-2); }
.field .hint { font-size: 11.5px; color: var(--ink-3); }
.field .err { font-size: 12px; color: var(--bad); font-weight: 550; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.form-grid .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line-2); background: var(--panel); border-radius: 99px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 13px; font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand); } .pill.clay { background: var(--clay-soft); color: var(--clay); }
.pill.sim { background: none; border: 1px dashed var(--line-2); color: var(--ink-2); }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card > h2, .card > h3 { margin-bottom: 4px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .lab { font-size: 12.5px; color: var(--ink-2); }
.stat .val { font: 500 27px/1.2 var(--serif); margin-top: 3px; }
.stat .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* Textile cards */
.lot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 16px; }
.lot { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; min-width: 0; }
.lot:hover { transform: translateY(-2px); box-shadow: var(--shadow-l); }
.swatch { position: relative; background-size: cover; background-position: center; }
.lot .swatch { height: 148px; }
.swatch .tagline { position: absolute; left: 8px; bottom: 8px; background: rgba(255,254,251,.9); color: var(--ink-2); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; }
.swatch .corner { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.lot-body { padding: 12px 14px 13px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.lot-title { font-weight: 620; font-size: 14.5px; line-height: 1.3; }
.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; font-size: 12.5px; color: var(--ink-2); }
.lot-foot { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); flex: none; }
.mono { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 650; flex: none; letter-spacing: .02em; }
.mono.sm { width: 22px; height: 22px; font-size: 9px; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }

/* Exchange cards */
.ex { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 16px; cursor: pointer; transition: border-color .15s; text-align: left; width: 100%; }
.ex:hover { border-color: var(--brand-2); }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.chain .hop { display: flex; align-items: center; gap: 7px; background: var(--bg); border-radius: 9px; padding: 5px 9px 5px 5px; min-width: 0; font-size: 12.5px; }
.chain .sw { width: 30px; height: 30px; border-radius: 6px; background-size: cover; flex: none; }
.chain .arrow { color: var(--ink-3); }
.ex-side { border-left: 1px solid var(--line); padding-left: 16px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.gain { font: 500 22px/1.2 var(--serif); }
.give-get { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.give-get > div { background: var(--bg); border-radius: 10px; padding: 8px; display: flex; gap: 9px; align-items: center; min-width: 0; }
.give-get .sw { width: 42px; height: 42px; border-radius: 7px; flex: none; background-size: cover; }

/* Graph */
.graph { width: 100%; min-height: 200px; }
.graph svg { display: block; width: 100%; height: auto; }
.flow-step { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.flow-step:first-child { border-top: 0; }
.flow-step .sw { width: 54px; height: 54px; border-radius: 9px; background-size: cover; }

/* Tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 8px 11px; background: var(--bg); vertical-align: bottom; }
td { padding: 8px 11px; border-top: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pos { color: var(--ok); font-weight: 600; } .neg { color: var(--bad); font-weight: 600; }

/* Notes */
.note { background: var(--bg); border-radius: 10px; padding: 10px 13px; font-size: 13px; color: var(--ink-2); }
.note b { color: var(--ink); }
.note.warn { background: var(--warn-soft); } .note.clay { background: var(--clay-soft); } .note.ok { background: var(--ok-soft); }
.check { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 7px; font-size: 13px; padding: 3px 0; }
.tick { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; color: #fff; margin-top: 2px; }
.tick.y { background: var(--ok); } .tick.n { background: var(--bad); } .tick.w { background: var(--line-2); color: var(--ink-2); }
.timeline { display: flex; gap: 0; flex-wrap: wrap; margin: 6px 0; }
.tl { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); padding-right: 12px; }
.tl i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); display: inline-block; }
.tl.done { color: var(--ink); } .tl.done i { background: var(--brand); }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 62px; align-items: center; gap: 10px; font-size: 13px; }
.bar-track { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--brand); border-radius: 5px; transition: width .35s; }

/* Empty */
.empty { text-align: center; padding: 34px 20px; border: 1px dashed var(--line-2); border-radius: var(--radius); color: var(--ink-2); }
.empty h3 { margin-bottom: 5px; color: var(--ink); }

/* Drawer, toast, tour */
.scrim { position: fixed; inset: 0; background: rgba(25,26,23,.32); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel); z-index: 41; box-shadow: var(--shadow-l); display: flex; flex-direction: column; }
.drawer header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.drawer .body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.drawer footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: var(--shadow-l); max-width: min(560px, 90vw); }
.tour { position: fixed; right: 22px; bottom: 22px; width: min(370px, calc(100vw - 32px)); background: var(--ink); color: #f6f4ef; border-radius: var(--radius); padding: 16px 18px; z-index: 50; box-shadow: var(--shadow-l); }
.tour h3 { font: 500 18px/1.25 var(--serif); margin: 4px 0 6px; }
.tour p { font-size: 13.5px; color: #d9d6cc; }
.tour .bar { height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
.tour .bar i { display: block; height: 100%; background: #9fd0b5; }
.tour .btn { background: #f6f4ef; color: var(--ink); border-color: #f6f4ef; }
.tour .btn.ghost { background: none; color: #d9d6cc; border-color: transparent; }
.tour-target { outline: 2px solid var(--clay); outline-offset: 4px; border-radius: 10px; }
.photo-row { display: flex; gap: 8px; flex-wrap: wrap; }
.photo { position: relative; width: 74px; height: 74px; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid var(--line); }
.photo button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 11px; cursor: pointer; line-height: 1; }
details summary { cursor: pointer; font-weight: 550; font-size: 13px; color: var(--ink-2); }
details[open] summary { margin-bottom: 8px; }
.hero { background: linear-gradient(135deg, #1f4d3a, #17392b); color: #f6f4ef; border-radius: var(--radius); padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: center; box-shadow: var(--shadow); }
.hero h2 { color: #fff; font-size: 24px; margin: 6px 0; }
.hero p { color: #d6e2da; font-size: 14px; }
.hero .btn { background: #f6f4ef; color: var(--brand); border-color: #f6f4ef; }
.hero .btn.outline { background: none; color: #f6f4ef; border-color: rgba(255,255,255,.4); }
.hero .pill { background: rgba(255,255,255,.14); color: #f6f4ef; }
.hero .graph text { fill: #f6f4ef; }

@media (max-width: 1040px) { .grid-main, .hero { grid-template-columns: minmax(0, 1fr); } .hero .graph { max-width: 340px; } }
@media (max-width: 820px) {
  main { padding: 18px 16px 90px; } .banner { padding: 6px 16px; }
  h1 { font-size: 25px; }
  .grid2, .form-grid { grid-template-columns: minmax(0, 1fr); }
  .ex { grid-template-columns: minmax(0, 1fr); } .ex-side { border-left: 0; border-top: 1px solid var(--line); padding: 10px 0 0; }
  .give-get { grid-template-columns: minmax(0, 1fr); }
  .tour { right: 16px; bottom: 16px; }
  .flow-step { grid-template-columns: 44px minmax(0, 1fr); } .flow-step .sw { width: 44px; height: 44px; } .flow-step .end { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* v2: solver status, network, onboarding */
.solver { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; font-size: 13px; }
.solver.optimal { border-color: #bcd9c6; background: var(--ok-soft); }
.solver.time_limited, .solver.truncated { border-color: #e6d3a4; background: var(--warn-soft); }
.tick.h { background: #b78716; }
.net-card { padding-bottom: 14px; }
.net-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.net-canvas { min-width: 0; }
.net-canvas svg { display: block; width: 100%; height: auto; }
.net-canvas [role="button"]:focus-visible { outline: none; }
.net-canvas [role="button"]:focus-visible circle:nth-of-type(2) { stroke: var(--clay); stroke-width: 4; }
.net-panel { min-width: 0; font-size: 13.5px; }
.net-steps { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.net-step { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--bg); border: 1px solid transparent; border-radius: 9px; padding: 6px 8px; cursor: pointer; font-size: 13px; line-height: 1.35; }
.net-step:hover { border-color: var(--line-2); }
.net-step.mine { background: var(--clay-soft); }
.net-step[aria-pressed="true"], .net-step.hop-on { border-color: var(--brand-2); box-shadow: 0 0 0 1px var(--brand-2); }
.net-step .sw { width: 38px; height: 38px; border-radius: 7px; background-size: cover; display: block; }
.net-step-text b { font-weight: 620; }
.net-opts { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; max-height: 190px; overflow-y: auto; }
.net-opt { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 5px 7px; border-radius: 7px; cursor: pointer; text-align: left; font-size: 12.5px; color: var(--ink-2); }
.net-opt:hover { background: var(--panel-2); }
.net-opt[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.net-opt i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.net-hop { transition: opacity .2s, stroke-width .2s; }
.net-hop.hop-off { opacity: .22; }
.net-hop.hop-on { stroke-width: 5; }
.net-chip { transition: opacity .2s; }
.net-chip.hop-off { opacity: .35; }
.welcome { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border-radius: 18px; padding: 28px 30px; z-index: 41; box-shadow: var(--shadow-l); }
.welcome-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.welcome-steps { margin: 14px 0 0; padding-left: 20px; font-size: 14px; }
.welcome-steps li { margin-bottom: 6px; }
@media (max-width: 1040px) { .net-layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) { .welcome-grid { grid-template-columns: minmax(0, 1fr); } .welcome { padding: 20px; } #welcome-graph { max-width: 300px; margin: 0 auto; } }
.net-opt-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.net-opt-text .faint { font-size: 11.5px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.net-opts { max-height: 240px; }

/* v3: horizontal header, company identity, calmer hierarchy */
:root { --shadow: 0 1px 2px rgba(25,26,23,.04); --shadow-l: 0 14px 44px rgba(25,26,23,.16); --content: 1160px; }
h1 { font-size: 34px; }
h2 { font-size: 22px; }
.banner { justify-content: center; padding: 6px 24px; font-size: 12px; background: var(--bg); border-bottom: 1px solid var(--line); text-align: center; }
.banner b { font-weight: 600; color: var(--ink); }
.top-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 20px 32px 12px; background: var(--bg); }
.top-left { justify-self: start; } .top-right { justify-self: end; display: flex; align-items: center; gap: 14px; }
.brand { display: inline-flex; align-items: center; gap: 11px; background: none; border: 0; padding: 2px 4px; cursor: pointer; color: var(--ink); }
.brand b { font: 500 31px/1 var(--serif); letter-spacing: -.015em; }
.brand-mark { width: 31px; height: 31px; flex: none; }
.link-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 5px 2px; font-size: 13px; color: var(--ink-2); cursor: pointer; border-radius: 4px; white-space: nowrap; }
.link-btn:hover, .link-btn.on { color: var(--ink); }
.link-btn .q { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-2); font-size: 10.5px; }
.chev { width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); display: inline-block; margin-left: 3px; flex: none; transition: transform .15s; }
[aria-expanded="true"] > .chev { transform: rotate(225deg) translate(-2px, 0); }
.menu-wrap { position: relative; }

<div class="banner"><span><b>Prototype.</b> Synthetic data: fictional companies, simulated exchanges and generated fabric textures. No real transactions, shipments, payments or company verification.</span></div>
<header id="top-row" class="top-row"></header>

<noscript><p style="padding:20px">This prototype runs its matching in JavaScript. Please enable JavaScript.</p></noscript>
<script>
/*
 * solver.js - optimisers replacing the SciPy calls in swap_sim.py.
 *
 * solvePacking  replaces scipy.optimize.milp (HiGHS) and solves the same integer
 *               program: max sum w_c x_c, s.t. each firm is in at most one chosen
 *               cycle. Method: connected components, then branch and bound with a
 *               Lagrangian upper bound (firm prices u_i >= 0):
 *                   L(u) = sum_i u_i + sum_c max(0, w_c - sum_{i in c} u_i)
 *               If the time limit is reached the incumbent is returned and flagged
 *               as not proven optimal, with its upper bound.
 *
 * linearSumAssignment  replaces scipy.optimize.linear_sum_assignment
 *               (shortest augmenting paths, O(n^3), minimum total cost).
 */
(globalThis.KX_MODULES = globalThis.KX_MODULES || []).push(function solverModule(KX) {
  "use strict";

  const EPS = 1e-9;

  function solveComponent(cycles, nFirms, deadline, stats) {
    const m = cycles.length;
    const w = new Float64Array(m);
    const members = new Array(m);
    for (let c = 0; c < m; c++) { w[c] = cycles[c].w; members[c] = cycles[c].nodes; }
    const firmCycles = Array.from({ length: nFirms }, () => []);
    for (let c = 0; c < m; c++) for (const f of members[c]) firmCycles[f].push(c);

    let incumbent = [], incumbentValue = 0;
    const dead = new Int32Array(m);    // >0: excluded at the current search node
    const used = new Uint8Array(nFirms);
    const rc = new Float64Array(m);

    const consider = (picks, value) => {
      if (value > incumbentValue + EPS) { incumbentValue = value; incumbent = picks.slice(); }
    };

    /** Lagrangian value over alive cycles and free firms; fills rc and the subgradient. */
    function evalL(u, g) {
      let L = 0;
      for (let f = 0; f < nFirms; f++) {
        g[f] = 1;
        if (!used[f]) L += u[f];
      }
      for (let c = 0; c < m; c++) {
        if (dead[c]) continue;
        const nodes = members[c];
        let r = w[c];
        for (let k = 0; k < nodes.length; k++) r -= u[nodes[k]];
        rc[c] = r;
        if (r > 0) {
          L += r;
          for (let k = 0; k < nodes.length; k++) g[nodes[k]] -= 1;
        }
      }
      return L;
    }

    /** Subgradient steps on prices; keeps the lowest bound (any u >= 0 is valid). */
    function improve(u, iters, value, thetaStart) {
      const g = new Float64Array(nFirms), bestU = Float64Array.from(u);
      let bestL = Infinity, theta = thetaStart, stall = 0;
      for (let it = 0; it < iters; it++) {
        if ((it & 7) === 7 && Date.now() > deadline) break;
        const L = evalL(u, g);
        if (L < bestL - 1e-12) { bestL = L; bestU.set(u); stall = 0; }
        else if (++stall >= 12) { theta *= 0.5; stall = 0; }
        const target = Math.max(incumbentValue - value, 0);
        if (bestL <= target + EPS) break;
        let norm = 0;
        for (let f = 0; f < nFirms; f++) if (!used[f]) {
          const dir = u[f] > 0 || g[f] < 0 ? g[f] : 0;
          norm += dir * dir;
        }
        if (norm < 1e-12) break;
        const t = (theta * Math.max(L - target, 1e-9)) / norm;
        for (let f = 0; f < nFirms; f++) if (!used[f]) u[f] = Math.max(0, u[f] - t * g[f]);
      }
      const finalL = evalL(bestU, g); // leave rc consistent with the returned prices
      u.set(bestU);
      return Math.min(bestL, finalL);
    }

    /** Greedy primal heuristic: alive cycles by reduced cost, then by weight. */
    function primal(u, base, value) {
      const order = [];
      for (let c = 0; c < m; c++) if (!dead[c]) order.push(c);
      order.sort((a, b) => rc[b] - rc[a] || w[b] - w[a]);
      const taken = new Uint8Array(nFirms);
      const picks = base.slice();
      let val = value;
      for (const c of order) {
        const nodes = members[c];
        let free = true;
        for (let k = 0; k < nodes.length; k++) if (taken[nodes[k]]) { free = false; break; }
        if (!free) continue;
        for (let k = 0; k < nodes.length; k++) taken[nodes[k]] = 1;
        picks.push(c);
        val += w[c];
      }
      consider(picks, val);
    }

    // Root: tighten prices and reduced-cost-fix cycles that cannot be in any better solution.
    const u0 = new Float64Array(nFirms);
    for (let c = 0; c < m; c++) {
      const share = w[c] / members[c].length;
      for (const f of members[c]) if (share > u0[f]) u0[f] = share;
    }
    const rootIters = m > 4000 ? 150 : 400;
    evalL(u0, new Float64Array(nFirms));
    primal(u0, [], 0);
    const rootUB = improve(u0, rootIters, 0, 1.5);
    primal(u0, [], 0);
    for (let c = 0; c < m; c++) if (rc[c] < 0 && rootUB + rc[c] < incumbentValue - EPS) dead[c] = 1;

    const nodeIters = m > 4000 ? 1 : m > 800 ? 4 : 10;
    const chosen = [];
    let timedOut = false, nodes = 0;

    const removeFirm = (f, delta) => {
      used[f] = delta > 0 ? 1 : 0;
      const list = firmCycles[f];
      for (let i = 0; i < list.length; i++) dead[list[i]] += delta;
    };

    function dfs(value, parentU) {
      if (timedOut) return;
      if ((++nodes & (m > 2000 ? 0 : 63)) === 0 && Date.now() > deadline) { timedOut = true; return; }
      consider(chosen, value);

      const u = Float64Array.from(parentU);
      let anyAlive = false;
      for (let c = 0; c < m; c++) if (!dead[c]) { anyAlive = true; break; }
      if (!anyAlive) return;
      // Firms with no alive cycle carry no value at this node.
      const liveFirm = new Uint8Array(nFirms);
      for (let c = 0; c < m; c++) if (!dead[c]) for (const f of members[c]) liveFirm[f] = 1;
      const released = [];
      for (let f = 0; f < nFirms; f++) if (!used[f] && !liveFirm[f]) { used[f] = 1; released.push(f); u[f] = 0; }

      const bound = improve(u, nodeIters, value, 0.8);
      const undo = () => { for (const f of released) used[f] = 0; };
      if (value + bound <= incumbentValue + EPS) { undo(); return; }
      if ((nodes & 7) === 1) primal(u, chosen, value);

      // Branch on the firm where the relaxation is most in conflict.
      const conflict = new Int32Array(nFirms);
      for (let c = 0; c < m; c++) if (!dead[c] && rc[c] > 0) for (const f of members[c]) conflict[f]++;
      let branch = -1, bc = -1, bp = -1;
      for (let f = 0; f < nFirms; f++) {
        if (used[f]) continue;
        if (conflict[f] > bc || (conflict[f] === bc && u[f] > bp)) { branch = f; bc = conflict[f]; bp = u[f]; }
      }
      if (branch < 0) { undo(); return; }
      const opts = [];
      const rcSnapshot = new Map();
      for (const c of firmCycles[branch]) if (!dead[c]) { opts.push(c); rcSnapshot.set(c, rc[c]); }
      opts.sort((a, b) => rcSnapshot.get(b) - rcSnapshot.get(a));

      for (const c of opts) {
        // Reduced-cost test: forcing c cannot beat the incumbent.
        const r = rcSnapshot.get(c);
        if (r < 0 && value + bound + r <= incumbentValue + EPS) continue;
        chosen.push(c);
        for (const f of members[c]) removeFirm(f, 1);
        dfs(value + w[c], u);
        for (const f of members[c]) removeFirm(f, -1);
        chosen.pop();
        if (timedOut) { undo(); return; }
      }
      removeFirm(branch, 1); // branch: this firm joins no cycle
      dfs(value, u);
      removeFirm(branch, -1);
      undo();
    }
    dfs(0, u0);
    stats.nodes += nodes;
    return {
      picks: incumbent, value: incumbentValue, proven: !timedOut,
      ub: timedOut ? Math.max(rootUB, incumbentValue) : incumbentValue,
    };
  }

  /**
   * @param {number} N number of firms
   * @param {{nodes:number[], w:number}[]} cands candidate cycles
   * @returns {{selected:number[], value:number, optimal:boolean, upperBound:number, nodes:number}}
   */
  KX.solvePacking = function solvePacking(N, candsIn, opts) {
    let cands = candsIn;
    const timeLimitMs = (opts && opts.timeLimitMs) || 30000;
    const deadline = Date.now() + timeLimitMs;
    // Safe reduction: a cycle is redundant if another cycle uses the same lots or a subset of them
    // and is worth at least as much. Any solution using it can swap without losing value.
    const original = cands;
    {
      const best = new Map();
      const keyOf = (ns) => ns.slice().sort((x, y) => x - y).join(",");
      cands.forEach((c, i) => { const key = keyOf(c.nodes), b = best.get(key); if (b === undefined || c.w > cands[b].w) best.set(key, i); });

    const n = G.n, limit = opts.limit || 200000, deadline = Date.now() + (opts.maxMs || 2000);
    const S = G.S, v = G.v, oc = G.oc;
    const useCredit = regime === "credit_list", dsc = P.credit_discount;
    const gainOf = (me, prev, cost) => {
      let g = G.W(me, prev) - S[me] - cost;
      if (useCredit) { const x = v[prev] - v[me]; g += x > 0 ? -x : dsc * -x; }
      return g;
    };
    const costTo = (me, company) => G.Cc(me, company);
    const out = Array.from({ length: n }, () => []), inn = Array.from({ length: n }, () => []);
    const minC = new Float64Array(n).fill(Infinity);
    if (economic) for (let me = 0; me < n; me++) {
      // Companies that accept my lot are the only places it can ship to.
      for (const ci of G.acceptors[me]) { const c = costTo(me, ci); if (c < minC[me]) minC[me] = c; }
    }
    for (let prev = 0; prev < n; prev++) {
      for (const ci of G.acceptors[prev]) {
        for (const me of G.companyLots[ci]) {
          if (economic && (minC[me] === Infinity || gainOf(me, prev, minC[me]) < 0)) continue;
          out[prev].push(me); inn[me].push(prev);
        }
      }
    }
    // Lots with no way in or no way out can never close a cycle.
    const alive = new Uint8Array(n).fill(1);
    const inDeg = Int32Array.from(inn.map((x) => x.length)), outDeg = Int32Array.from(out.map((x) => x.length));
    const queue = [];
    for (let i = 0; i < n; i++) if (!inDeg[i] || !outDeg[i]) { alive[i] = 0; queue.push(i); }
    while (queue.length) {
      const u = queue.pop();
      for (const w of out[u]) if (alive[w] && --inDeg[w] === 0) { alive[w] = 0; queue.push(w); }
      for (const w of inn[u]) if (alive[w] && --outDeg[w] === 0) { alive[w] = 0; queue.push(w); }
    }
    const liveCount = alive.reduce((a, b) => a + b, 0);
    for (let i = 0; i < n; i++) { out[i] = alive[i] ? out[i].filter((w) => alive[w]).sort((a, b) => a - b) : []; inn[i] = alive[i] ? inn[i].filter((w) => alive[w]) : []; }

    const cycles = [];
    let truncated = false, reason = null, steps = 0, perStart = 0;
    const quota = Math.max(40, Math.ceil((limit / Math.max(liveCount, 1)) * 4));
    const dist = new Int8Array(n);
    const used = new Uint8Array(G.nCompanies);
    const path = new Int32Array(L + 1);
    const stack = [];
    const visit = (s, u, depth) => {
      if ((++steps & 4095) === 0 && Date.now() > deadline) { truncated = true; reason = "time"; return; }
      const list = out[u];
      for (let idx = 0; idx < list.length; idx++) {
        const w = list[idx];
        if (w === s) {
          if (depth >= 2) {
            if (economic) {
              if (gainOf(u, path[depth - 2], costTo(u, oc[s])) < 0) continue;
              if (gainOf(s, u, costTo(s, oc[path[1]])) < 0) continue;
            }
            cycles.push(Array.from(path.subarray(0, depth)));
            if (cycles.length >= limit) { truncated = true; reason = "limit"; return; }
            if (++perStart >= quota) { truncated = true; if (!reason) reason = "quota"; return; }
          }
        } else if (w > s && depth < L && !used[oc[w]] && dist[w] >= 0 && dist[w] + depth <= L) {
          if (economic && depth >= 2 && gainOf(u, path[depth - 2], costTo(u, oc[w])) < 0) continue;
          path[depth] = w; used[oc[w]] = 1;
          visit(s, w, depth + 1);
          used[oc[w]] = 0;
          if (truncated && reason !== "quota") return;
          if (perStart >= quota) return;
        }
      }
    };
    for (let s = 0; s < n; s++) {
      if (!alive[s]) continue;
      // Hops needed to get back to s, over lots with a larger index. Paths that cannot return in time are skipped.
      dist.fill(-1);
      dist[s] = 0;
      stack.length = 0; stack.push(s);
      for (let head = 0; head < stack.length; head++) {
        const u = stack[head];
        if (dist[u] >= L - 1) continue;
        for (const p of inn[u]) if (p > s && dist[p] < 0) { dist[p] = dist[u] + 1; stack.push(p); }
      }
      perStart = 0;
      path[0] = s; used[oc[s]] = 1;
      visit(s, s, 1);
      used[oc[s]] = 0;
      if (truncated && reason !== "quota") break;
    }
    return { cycles, truncated, reason, steps, liveCount };
  }

  /* ---- Market: from platform state to all matches ---- */
  const byId = (arr, id) => arr.find((x) => x.id === id);

  /** Precomputed, indexed view of the lots. Acceptance and shipping are arrays, not repeated scans. */
  function buildGraph(state, lots) {
    const n = lots.length, s = state.settings;
    const seen = new Map(), cos = [];
    const oc = new Int32Array(n);
    lots.forEach((l, i) => {
      if (!seen.has(l.owner)) { seen.set(l.owner, cos.length); cos.push(byId(state.companies, l.owner)); }
      oc[i] = seen.get(l.owner);
    });
    const nC = cos.length;
    const W = new Float64Array(nC * n);
    const acceptors = Array.from({ length: n }, () => []);
    for (let ci = 0; ci < nC; ci++) for (let i = 0; i < n; i++) {
      const w = oc[i] === ci ? -1 : quickW(cos[ci], lots[i]);
      W[ci * n + i] = w;
      if (w >= 0) acceptors[i].push(ci);
    }
    const companyLots = Array.from({ length: nC }, () => []);
    for (let i = 0; i < n; i++) companyLots[oc[i]].push(i);
    const cost = new Float64Array(nC * n).fill(-1);
    const kg = lots.map(lotKg);
    const Cc = (a, ci) => {
      let c = cost[ci * n + a];
      if (c < 0) { c = shippingQuote(lots[a].city, cos[ci].city, kg[a], s).total; cost[ci * n + a] = c; }
      return c;
    };
    const memo = new Map();
    return {
      n, oc, nCompanies: nC, cos, acceptors, companyLots, Cc,
      owner: Array.from(oc),
      S: lots.map((l) => l.value * l.outsidePct),
      v: lots.map((l) => l.value),
      edge: (a, b) => W[oc[b] * n + a] >= 0,
      W: (me, prev) => W[oc[me] * n + prev],
      C: (a, b) => Cc(a, oc[b]),
      assess: (c, l) => { const key = c.id + "|" + l.id; let r = memo.get(key); if (!r) { r = assess(c, l); memo.set(key, r); } return r; },
      lots, companies: lots.map((l, i) => cos[oc[i]]),
    };
  }

  /** Canonical id for a cycle: rotated to start at the smallest lot id. */
  function signature(ids) {
    let best = 0;
    ids.forEach((id, i) => { if (id < ids[best]) best = i; });
    return ids.slice(best).concat(ids.slice(0, best)).join(">");
  }

  function describe(G, nodes, ev, state, regime) {
    const k = nodes.length;
    const members = nodes.map((me, m) => {
      const prev = nodes[(m - 1 + k) % k], next = nodes[(m + 1) % k];
      const lot = G.lots[me], c = G.companies[me], recv = G.lots[prev], to = G.companies[next];
      const a = G.assess(c, recv);
      const q = shippingQuote(lot.city, to.city, lotKg(lot), state.settings);
      const gain = regime === "ntu" ? ev.net[m] : regime === "credit_list" ? ev.net2[m] : ev.surplus / k;
      return {
        company: c.id, companyName: c.name, lotId: lot.id, lotName: lot.name,
        toCompany: to.id, toName: to.name, fromCompany: G.companies[prev].id, fromName: G.companies[prev].name,
        recvId: recv.id, recvName: recv.name,
        km: q.km, kg: q.kg, fromCity: lot.city, toCity: to.city, fromCountry: countryOf(lot.city), toCountry: countryOf(to.city),
        mode: q.mode, domestic: q.domestic, shipBase: q.base, shipCustoms: q.customs, shipLine: q.line,
        W: ev.net[m] + G.S[me] + ev.cc[m], S: G.S[me], C: ev.cc[m], net: ev.net[m], credit: ev.x[m],
        net2: ev.net2 ? ev.net2[m] : null, gain,
        factor: a.factor, soft: a.soft, source: a.source, profileName: a.profile ? a.profile.name : null,
      };
    });
    let reason = null;
    if (!ev.ok) {
      const neg = members.filter((m) => m.gain < 0);
      const costOnly = neg.length > 0 && neg.every((m) => m.W - m.S >= 0);
      reason = regime === "credit_surplus"
        ? "The group as a whole would lose value."
        : costOnly ? `Shipping cost removes the gain for ${neg.map((m) => m.companyName).join(", ")}.`
        : `${neg.map((m) => m.companyName).join(", ")} would receive less than it gives up.`;
    } else if (ev.w <= 0) reason = "The risk of a company pulling out outweighs the gain.";
    const eligible = ev.ok && ev.w > 0;
    const belowMin = members.map((m, i) => ({ company: m.company, name: m.companyName, gain: m.gain, minimum: G.companies[nodes[i]].hurdle || 0 })).filter((b) => b.gain < b.minimum);
    return {
      sig: signature(nodes.map((i) => G.lots[i].id)), nodes, k, lots: nodes.map((i) => G.lots[i].id),
      companies: nodes.map((i) => G.companies[i].id), regime, members,
      ok: ev.ok, w: ev.w, surplus: ev.surplus, succ: ev.succ, failCost: ev.failCost,
      logistics: ev.cc.reduce((a, b) => a + b, 0), reason, eligible, belowMin, ready: eligible && belowMin.length === 0,
    };
  }

  /** One exchange cycle. Numeric fields are stored; text and member detail are built only when read. */
  class Cycle {
    constructor(M, nodes, ev) {
      this.M = M; this.nodes = nodes; this.k = nodes.length; this.regime = M.regime;
      this.ok = ev.ok; this.w = ev.w; this.surplus = ev.surplus; this.succ = ev.succ; this.failCost = ev.failCost;
      this.logistics = ev.cc.reduce((a, b) => a + b, 0);
      this.eligible = ev.ok && ev.w > 0;
      const G = M.G;
      let below = false;
      if (this.eligible) for (let m = 0; m < this.k; m++) {
        const g = M.regime === "ntu" ? ev.net[m] : M.regime === "credit_list" ? ev.net2[m] : ev.surplus / this.k;
        if (g < (G.cos[G.oc[nodes[m]]].hurdle || 0)) { below = true; break; }
      }
      this.ready = this.eligible && !below;
      this.recommended = false;
      this.declined = false;
    }
    get sig() { return this._sig || (this._sig = signature(this.nodes.map((i) => this.M.G.lots[i].id))); }
    get lots() { return this.nodes.map((i) => this.M.G.lots[i].id); }
    get companies() { return this.nodes.map((i) => this.M.G.cos[this.M.G.oc[i]].id); }
    get full() {
      if (!this._full) this._full = describe(this.M.G, this.nodes, evaluate(this.M.G, this.nodes, this.regime, this.M.settings), this.M.state, this.regime);
      return this._full;
    }
    get members() { return this.full.members; }
    get reason() { return this.full.reason; }
    get belowMin() { return this.full.belowMin; }
    get sharesWith() {
      if (this.recommended) return [];
      return this.lots.filter((id) => this.M.lotInRec.has(id)).map((id) => ({ lotId: id, sig: this.M.lotInRec.get(id).sig }));
    }
    get countries() { return [...new Set(this.nodes.map((i) => countryOf(this.M.G.lots[i].city)))]; }
    get domestic() {
      const G = this.M.G, all = new Set();
      for (const i of this.nodes) { all.add(countryOf(G.lots[i].city)); all.add(countryOf(G.cos[G.oc[i]].city)); }
      return all.size === 1;
    }
    get categories() { return [...new Set(this.nodes.map((i) => this.M.G.lots[i].category))]; }
    /** True if no two lots in this cycle could work as a feasible direct swap on their own. */
    get multiOnly() {
      if (this.k < 3) return false;
      if (this._mo !== undefined) return this._mo;
      const G = this.M.G, n = this.nodes;
      let any = false;
      for (let a = 0; a < n.length && !any; a++) for (let b = a + 1; b < n.length && !any; b++) {
        if (G.edge(n[a], n[b]) && G.edge(n[b], n[a]) && evaluate(G, [n[a], n[b]], this.regime, this.M.settings).ok) any = true;
      }
      return (this._mo = !any);
    }
    plain() { return JSON.parse(JSON.stringify(this.full)); }
  }

  /**
   * Full recalculation. Called when inventory, preferences, decisions or rules change, and never
   * for unrelated UI updates.
   * opts: limit (cycle budget), enumMs (search time), timeLimitMs (solver time per set).
   */
  function computeMarket(state, opts = {}) {
    const s = state.settings;
    const timeLimitMs = opts.timeLimitMs || 2000;
    const t0 = Date.now();
    const participating = new Set(state.companies.filter((c) => c.participating !== false).map((c) => c.id));
    const lots = state.lots.filter((l) => l.status === "active" && participating.has(l.owner));
    const G = buildGraph(state, lots);
    const tGraph = Date.now();
    const M = { lots, G, state, settings: s, regime: s.regime };
    const declinedAny = Object.keys(state.declined || {}).length > 0;
    const limit = opts.limit || 200000;
    // Regimes where every member must clear zero can be pruned safely. The theoretical surplus regime cannot.
    const economic = s.regime !== "credit_surplus";
    const main = searchCycles(G, 4, { regime: s.regime, P: s, economic, limit, maxMs: opts.enumMs || 1500 });
    const items = main.cycles.map((nodes) => new Cycle(M, nodes, evaluate(G, nodes, s.regime, s)));
    const tSearch = Date.now();
    // Compatible cycles that fail the economics are listed up to a budget, shorter cycles first.
    let blockedComplete = true;
    if (economic) {
      const budget = opts.blockedLimit || 8000, ms = opts.blockedMs || 200;
      for (const L of [3, 4]) {
        const res = searchCycles(G, L, { regime: s.regime, P: s, economic: false, limit: budget, maxMs: ms });
        if (res.truncated) blockedComplete = false;
        for (const nodes of res.cycles) {
          if (L === 4 && nodes.length < 4) continue;
          const ev = evaluate(G, nodes, s.regime, s);
          if (!ev.ok) items.push(new Cycle(M, nodes, ev));
        }
        if (res.truncated) break;
      }
    }
    if (declinedAny) for (const i of items) i.declined = !!state.declined[i.sig];
    M.items = items;
    let bySig = null;
    Object.defineProperty(M, "bySig", { get() { if (!bySig) bySig = new Map(items.map((i) => [i.sig, i])); return bySig; } });
    // Recommendations use cycles every participant is ready for (gain clears its stated minimum).
    // The wider "feasible" set stays visible, and its best set is computed for comparison.
    const pool = items.filter((i) => i.ready && !i.declined);
    const feasible = items.filter((i) => i.eligible && !i.declined);
    M.pool = pool; M.feasible = feasible;
    const packs = {};
    for (const L of [2, 3, 4]) packs[L] = clear(G, pool, L, { timeLimitMs });
    M.packs = packs;
    M.theory = feasible.length === pool.length ? packs[s.L] : clear(G, feasible, s.L, { timeLimitMs });
    M.truncated = main.truncated;
    M.truncatedReason = main.reason;
    M.blockedComplete = blockedComplete;
    M.cycleCount = main.cycles.length;
    M.views = new Map();
    applyRecommendation(M);
    M.audit = auditPacking(state, M);
    M.timing = { graph: tGraph - t0, search: tSearch - tGraph, solve: Date.now() - tSearch, total: Date.now() - t0 };
    return M;
  }
  /** Sets recommended flags and status from the current best sets. Also used after background refinement. */
  function applyRecommendation(M) {
    const rec = M.packs[M.settings.L];
    if (M.recommended) for (const c of M.recommended.selected) c.recommended = false;
    M.recommended = rec;
    for (const c of rec.selected) c.recommended = true;
    M.lotInRec = new Map();
    for (const c of rec.selected) for (const id of c.lots) M.lotInRec.set(id, c);
    M.status = solverStatus(rec, M.truncated, M.cycleCount, M.truncatedReason);
    if (M.views) M.views.clear();
  }

  /** Honest description of the search behind a recommendation. Only "optimal" may claim to be best. */
  function solverStatus(pack, truncated, cycleCount, reason) {
    if (truncated) {
      const why = reason === "time" ? "ran out of its time budget" : "reached its budget";
      return { code: "truncated", proven: false, label: "Search cut short", detail: `The search for loops ${why} after listing ${cycleCount.toLocaleString("en-US")}, so better exchanges may exist. This set is the best found among those listed.` };
    }
    if (!pack.optimal) {
      const gap = pack.value > 0 ? Math.ceil(((pack.upperBound - pack.value) / pack.value) * 100) : null;
      return { code: "time_limited", proven: false, label: "Best found in the time limit", detail: `The calculation hit its time limit before proving this is the best set.${gap !== null ? ` The best possible set could be up to ${gap}% better.` : ""}` };
    }
    return { code: "optimal", proven: true, label: "Proven best set", detail: "Every possible loop was checked, and no other combination has a higher total expected gain under the stated assumptions." };
  }

  /** Marketplace filter, kept pure so it can be tested without the page. */
  function marketplaceRows(state, cid, f) {
    const company = byId(state.companies, cid);
    const num = (x) => (x === "" || x == null ? null : Number(x));
    const q = String(f.q || "").trim().toLowerCase();
    const names = new Map(state.companies.map((c) => [c.id, c.name]));
    return state.lots.filter((l) => l.owner !== cid && l.status === "active").filter((l) => {
      if (q && !`${l.name} ${l.category} ${names.get(l.owner)} ${l.color} ${l.city} ${countryOf(l.city)} ${compositionText(l.composition)}`.toLowerCase().includes(q)) return false;
      if (f.cat !== "all" && l.category !== f.cat) return false;
      if (f.fiber !== "all" && !l.composition[f.fiber]) return false;
      if (f.city && f.city !== "all" && l.city !== f.city) return false;
      if (f.country && f.country !== "all" && countryOf(l.city) !== f.country) return false;
      if (f.region && f.region !== "all" && regionOf(countryOf(l.city)) !== f.region) return false;
      if (f.color !== "all" && l.colorFamily !== f.color) return false;
      if (num(f.gsmMin) != null && l.gsm < num(f.gsmMin)) return false;
      if (num(f.gsmMax) != null && l.gsm > num(f.gsmMax)) return false;
      if (num(f.qtyMin) != null && l.qty < num(f.qtyMin)) return false;
      return true;
    }).map((l) => ({ l, a: assess(company, l) })).filter(({ a }) => f.fit !== "fit" || a.accepted).sort((x, y) => y.a.accepted - x.a.accepted);
  }

  /** Upgrades data saved by an earlier version and keeps the visitor's edits. */
  function migrateState(s) {
    if (!s || !Array.isArray(s.lots) || !Array.isArray(s.companies)) return null;
    if (s.v === 1) {
      for (const [id, oldV, newV] of [["namsan", 100000, 300000], ["gyeongbu", 150000, 1200000]]) {
        const c = byId(s.companies, id);
        if (c && c.hurdle === oldV) c.hurdle = newV;
      }
      s.welcomed = true;
      s.touched = true;
      s.v = 2;
    }
    if (s.v === 2) {
      // Saved work is never replaced. Larger samples are offered, and added only on request.
      s.sampleAvailable = true;
      s.sampleTier = 2;
      s.v = 3;
    }
    if (s.v === 3) {
      if (s.sampleTier == null) s.sampleTier = s.sampleAvailable ? 2 : 3;
      s.sampleAvailable = true;
      s.sampleDismissed = false;
      s.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings || {});
      s.v = 4;
    }
    return s.v === 4 ? s : null;
  }
  /**
   * Adds sample companies, lots and sourcing needs the saved data lacks. Adds only: existing lots,
   * edited values and preferences stay as they are, and lots from an earlier sample that the visitor
   * removed do not come back. Safe to run more than once.
   */
  function mergeSample(s, fresh) {
    const added = { companies: 0, lots: 0, needs: 0 };
    const tier = s.sampleTier ?? 3;
    const known = new Set(s.lots.map((l) => l.id));
    for (const fc of fresh.companies) {
      const c = byId(s.companies, fc.id);
      if (!c) { s.companies.push(JSON.parse(JSON.stringify(fc))); added.companies++; continue; }
      c.profiles = c.profiles || [];
      for (const p of fc.profiles) {
        if ((p.tier || 2) > tier && !c.profiles.some((x) => x.id === p.id)) { c.profiles.push(JSON.parse(JSON.stringify(p))); added.needs++; }
      }
    }
    for (const l of fresh.lots) {
      if ((l.tier || 2) > tier && !known.has(l.id)) { s.lots.push(JSON.parse(JSON.stringify(l))); added.lots++; }
    }
    s.sampleTier = 4;
    s.sampleAvailable = false;
    s.sampleDismissed = false;
    return added;
  }

  /* ---- Company-level views. Memoized per market, so switching company never re-solves anything. ---- */
  function companyView(state, M, cid) {
    const cached = M.views && M.views.get(cid);
    if (cached) return cached;
    const G = M.G, L = state.settings.L;
    const ci = G.cos.findIndex((c) => c.id === cid);
    const mine = ci < 0 ? [] : M.items.filter((i) => { for (const n of i.nodes) if (G.oc[n] === ci) return true; return false; });
    const eligible = mine.filter((i) => i.eligible && !i.declined && i.k <= L);
    const ready = eligible.filter((i) => i.ready);
    const belowMin = eligible.filter((i) => !i.ready);
    const blocked = mine.filter((i) => !i.eligible && !i.declined && i.k <= L);
    const inPack = (LL) => M.packs[LL].selected.filter((c) => c.companies.includes(cid));
    const myLots = M.lots.filter((l) => l.owner === cid);
    const idx = new Map(G.lots.map((l, i) => [l.id, i]));
    const has = (i, lotId) => i.nodes.includes(idx.get(lotId));
    const routes = (lotId) => ready.filter((i) => has(i, lotId));
    const workable = (lotId) => eligible.filter((i) => has(i, lotId));
    const committed = myLots.map((l) => ({ lot: l, exchange: M.lotInRec.get(l.id) || null }));
    const onlyMultiWay = myLots.filter((l) => {
      const r = routes(l.id);
      return r.length > 0 && !r.some((i) => i.k === 2);
    });
    const view = { mine, eligible, ready, belowMin, blocked, inPack, myLots, routes, workable, onlyMultiWay, committed };
    if (M.views) M.views.set(cid, view);
    return view;
  }
  const gainOf = (item, cid) => { const m = item.members.find((x) => x.company === cid); return m ? m.gain : 0; };

  /** For each hop in a cycle: could this pair simply swap directly, and if not, why? */
  function directSwapAnalysis(state, item) {
    const out = [];
    const lotById = (id) => state.lots.find((l) => l.id === id);
    for (let m = 0; m < item.members.length; m++) {
      const a = item.members[m];
      const toLots = lotById(a.lotId);
      const buyer = byId(state.companies, a.toCompany), seller = byId(state.companies, a.company);
      const next = item.members.find((x) => x.company === a.toCompany);
      const back = lotById(next.lotId);

<script>

  const base = f.scope === "mine" ? v.mine : M.items;
  const status = (i) => {
    if (i.declined || i.k > L) return false;
    if (f.status === "recommended") return i.recommended;
    if (f.status === "ready") return i.ready;
    if (f.status === "feasible") return i.eligible && !i.ready;
    return !i.eligible;
  };

  for (const i of base) {

    if (f.span !== "all" && (f.span === "domestic") !== i.domestic) continue;
    if (f.cat !== "all" && !i.categories.includes(f.cat)) continue;
    if (f.country !== "all" && !i.countries.includes(f.country)) continue;

    <div class="opt-grid">${shown.map((o, i) => {

      return `<button class="opt ${sel && o.sig === sel.sig ? "on" : ""}" id="net-opt-${i}" data-act="net-select" data-sig="${esc(o.sig)}" aria-pressed="${!!(sel && o.sig === sel.sig)}" ${o.sig === "L01>L03>L05" ? 'data-tour="guided-card"' : ""}>
        <span class="opt-top"><span class="opt-marks">${o.companies.map((id) => brandMark(coOf(id), 24)).join("")}</span><span class="opt-k">${o.k}-way</span></span>
        <span class="opt-swatches">${o.lots.map((id) => { const l = lotOf(id); return `<span class="sw" style="${l ? swatchStyle(l) : ""}"></span>`; }).join("")}</span>
        <span class="small muted opt-names">${esc(o.members.map((m) => m.lotName).join(" → "))}</span>
        <span class="opt-foot"><span class="small faint">${esc(o.countries.length === 1 ? o.countries[0] : o.countries.length + " countries")}</span>${mine ? `<b class="num small ${Engine.gainOf(o, me0) < 0 ? "neg" : "pos"}">${signed(Engine.gainOf(o, me0))}</b>` : `<b class="num small">${signed(o.surplus)}</b>`}</span>
        <span class="row" style="gap:4px">${o.multiOnly ? `<span class="pill clay">Multi-way only</span>` : ""}${o.recommended ? `<span class="pill ok">${M.status.proven ? "Recommended" : "Suggested"}</span>` : ""}</span>
      </button>`;
    }).join("")}</div>
    ${opts.length > shown.length ? `<div style="text-align:center;margin-top:12px"><button class="btn" id="net-more" data-act="net-more">Show ${Math.min(24, opts.length - shown.length)} more of ${(opts.length - shown.length).toLocaleString("en-US")}</button></div>` : ""}`;
}
/** Highlights one hop in place, without rebuilding the page. */
function setNetStep(i) {
  netState.step = i;
  $$("#net-host [data-hop]").forEach((el) => {
    const on = i != null && +el.dataset.hop === i;
    el.classList.toggle("hop-on", on);
    el.classList.toggle("hop-off", i != null && !on);
    if (el.tagName === "BUTTON") el.setAttribute("aria-pressed", String(on));
  });
}
function toggleNetPlay() {
  if (netState.timer) { stopNetPlay(); return; }
  const sel = netSelected(filteredMatches());
  if (!sel) return;
  const b = $("#net-play");
  if (b) b.textContent = "Pause";
  let i = netState.step == null ? 0 : (netState.step + 1) % sel.k;
  setNetStep(i);
  netState.timer = setInterval(() => { i = (i + 1) % sel.k; setNetStep(i); }, 1500);
}
</script>
<script>
/* ===========================================================================
 * Pages. Each returns HTML; interactions run through ACT (see ui-app.js).
 * User-facing wording is plain trade language. Formulas stay on How it works.
 * ======================================================================== */
const statusPill = (s) => {
  const cls = { completed: "ok", confirmed: "ok", swatch: "brand", pickup: "brand", delivered: "brand", proposed: "warn", declined: "bad", failed: "bad", superseded: "", invalidated: "" }[s] || "";
  return `<span class="pill ${cls}">${esc(Engine.STAGE_LABEL[s] || s)}</span>`;
};
const SIM = `<span class="pill sim">Simulated</span>`;
const DEMO = `<span class="pill sim" title="Calculated from fictional companies and made-up lots">Demo data</span>`;
const exName = (it) => (it.k === 2 ? "Direct swap" : `${it.k}-way exchange`);

function solverBanner() {
  const st = M.status;
  const icon = st.proven ? "✓" : "!";
  return `<div class="solver ${st.code}" role="status"><span class="tick ${st.proven ? "y" : "h"}">${icon}</span><div><b>${esc(st.label)}</b> <span class="muted">${esc(st.detail)}${M.refining ? " Still checking in the background, so this may change." : ""}</span></div></div>`;
}
const recPill = () => (M.status.proven ? `<span class="pill ok">Recommended</span>` : `<span class="pill warn">Suggested, not proven best</span>`);

function lotCard(l, o = {}) {
  const owner = coOf(l.owner);
  const stat = l.status === "active" ? "" : `<span class="pill ${l.status === "reserved" ? "warn" : l.status === "exchanged" ? "ok" : ""}">${{ paused: "Paused", reserved: "Reserved in demo", exchanged: "Exchanged (simulated)" }[l.status] || l.status}</span>`;
  return `<article class="lot" ${o.tour ? `data-tour="${o.tour}"` : ""}>
    <div class="swatch" style="${swatchStyle(l)}">
      <div class="corner">${stat}${o.badge || ""}</div>

    </div>
    <div class="lot-body">
      <div class="lot-title">${esc(l.name)}</div>
      ${o.showOwner ? `<div class="who small muted">${monogram(owner, true)}<span>${esc(owner.name)}</span></div>` : ""}
      <div class="small muted">${esc(Engine.compositionText(l.composition))}</div>
      <div class="spec num"><span>${l.gsm} GSM</span><span>${l.width} cm wide</span><span>${l.qty.toLocaleString("en-US")} m</span><span>${Math.round(Engine.lotKg(l))} kg approx.</span><span style="grid-column:1/-1">${esc(l.city)}, ${esc(Engine.countryOf(l.city))}</span></div>
      <div class="small muted row" style="gap:5px"><span class="dot" style="background:${lotHex(l)}"></span>${esc(l.color || l.colorFamily)}</div>
      ${o.extra || ""}
      <div class="lot-foot"><b class="num">${won(l.value)}</b>${o.actions || ""}</div>
    </div>
  </article>`;
}

function routePill(ready, workable) {
  if (!ready.length && workable.length) return `<span class="pill warn">${plural(workable.length, "option")} below a minimum</span>`;
  if (!ready.length) return `<span class="pill">No exchange yet</span>`;
  const multi = ready.every((r) => r.k > 2);
  return `<span class="pill ${multi ? "clay" : "brand"}">${plural(ready.length, "exchange option")}${multi ? ", multi-way only" : ""}</span>`;
}
function exchangeBadge(item, ex) {
  if (ex) return statusPill(ex.status);
  if (item.declined) return `<span class="pill bad">Declined</span>`;
  if (item.recommended) return recPill();
  if (item.ready) return `<span class="pill">Alternative</span>`;
  if (item.eligible) return `<span class="pill warn">Below a stated minimum</span>`;
  return `<span class="pill bad">Doesn't pay for everyone</span>`;
}
function exchangeCard(item, cid, o = {}) {
  const ex = Engine.findExchange(state, item.sig);
  const mine = item.members.find((m) => m.company === cid);
  const hops = item.members.map((m) => {
    const l = lotOf(m.lotId);
    return `<span class="hop"><span class="sw" style="${l ? swatchStyle(l) : ""}"></span><span><b style="font-weight:600">${esc(m.lotName)}</b><br><span class="faint">${esc(m.companyName)}</span></span></span>`;
  }).join(`<span class="arrow" aria-hidden="true">→</span>`);
  const shareNote = !item.recommended && item.ready && item.sharesWith && item.sharesWith.length
    ? `Uses ${esc(lotOf(item.sharesWith[0].lotId).name)}, already placed in the ${M.status.proven ? "recommended" : "suggested"} set. A lot can only go to one exchange.` : "";
  const minNote = item.eligible && !item.ready ? item.belowMin.map((b) => `${esc(b.name)} would gain ${won(b.gain)}, below its ${won(b.minimum)} minimum.`).join(" ") : "";
  return `<button class="ex" id="ex-${esc(item.sig)}" data-act="open-ex" data-sig="${esc(item.sig)}" ${o.tour ? `data-tour="${o.tour}"` : ""}>
    <div style="min-width:0">
      <div class="row"><b style="font-size:15px">${exName(item)}</b>${exchangeBadge(item, ex)}${item.multiOnly ? `<span class="pill clay">Multi-way only</span>` : ""}${item.regime !== "ntu" ? `<span class="pill sim">${esc(Engine.REGIMES[item.regime].label)}</span>` : ""}</div>
      <div class="chain">${hops}<span class="arrow" aria-hidden="true">↺</span></div>
      ${item.reason ? `<div class="small" style="color:var(--bad);margin-top:8px">${esc(item.reason)}</div>` : ""}
      ${minNote ? `<div class="small" style="color:var(--warn);margin-top:8px">${minNote}</div>` : ""}
      ${shareNote ? `<div class="small faint" style="margin-top:8px">${shareNote}</div>` : ""}
    </div>
    <div class="ex-side">
      ${mine ? `<span class="small muted">Your estimated gain</span><span class="gain ${mine.gain < 0 ? "neg" : ""}">${signed(mine.gain)}</span>` : `<span class="small muted">Total estimated gain</span><span class="gain">${signed(item.surplus)}</span>`}
      <span class="small faint">Shipping ${won(item.logistics)}</span>
      <span class="small faint">${Math.round(item.succ * 100)}% chance everyone follows through</span>
    </div>
  </button>`;
}

/* ---- 1. Dashboard ---- */
function pageDashboard() {
  const c = me(), v = Engine.companyView(state, M, c.id);
  const allMine = state.lots.filter((l) => l.owner === c.id);
  const active = allMine.filter((l) => l.status === "active");
  const place = (i) => (i.recommended ? (i.multiOnly ? 2 : 1) : 0);
  const rank = (a, b) => (b.ready - a.ready) || (place(b) - place(a)) || (Engine.gainOf(b, c.id) - Engine.gainOf(a, c.id));
  const guided = ui.tour != null ? v.ready.find((i) => i.sig === "L01>L03>L05") : null;
  const best = guided || v.ready.slice().sort(rank)[0];
  const openApprovals = state.exchanges.filter((e) => e.status === "proposed" && e.companies.includes(c.id) && !e.approvals[c.id]);
  const liveEx = state.exchanges.filter((e) => ["confirmed", "swatch", "pickup", "delivered"].includes(e.status) && e.companies.includes(c.id));
  const acts = state.activity.filter((a) => a.companies.includes(c.id)).slice(0, 5);
  const top = v.eligible.slice().sort(rank).slice(0, 3);
  const bm = best ? best.members.find((m) => m.company === c.id) : null;
  return `
  <div class="page-head"><div><h1>Your surplus, at a glance</h1><p>${c.participating === false ? "You've paused participation, so your lots aren't being matched." : `Here is what ${esc(c.name)}'s fabric could become.`}</p></div>
    <div class="row"><button class="btn" id="dash-add" data-act="new-lot">Add a lot</button><button class="btn primary" data-go="matches">View matches</button></div></div>
  <div class="stack">
    ${best ? `<section class="hero" data-tour="hero">
      <div><span class="pill">${best.k === 2 ? "Direct swap available" : `${best.k}-way exchange`}</span>
        <h2>${esc(bm.lotName)} could become ${esc(bm.recvName)}</h2>
        <p>${best.k > 2 ? `No direct partner is needed: ${best.k} companies each send one lot and receive one they asked for.` : "You and one other company each want what the other holds."} Your estimated gain: <b style="color:#fff;white-space:nowrap">${signed(Engine.gainOf(best, c.id))}</b>.</p>
        <div class="row" style="margin-top:14px"><button class="btn" data-act="open-ex" data-sig="${esc(best.sig)}">See who sends what</button></div></div>
      <div class="graph" data-graph="${esc(best.sig)}" data-tone="dark" data-size="compact" data-h="230"></div>
    </section>` : `<section class="card" data-tour="hero"><h2>No exchange ready yet</h2><p class="muted" style="margin-top:6px">${v.belowMin.length ? `${plural(v.belowMin.length, "option")} would work on paper but falls below someone's minimum gain. See Exchange Matches.` : `Nothing currently matches on both fabric and economics for ${esc(c.name)}.`} Widen what you'd accept, or add a lot another company has asked for.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-go="preferences">Review preferences</button><button class="btn" data-go="marketplace">Browse marketplace</button></div></section>`}
    <section class="net-strip" aria-label="Fictional network summary">
      <div class="net-strip-head"><span class="eyebrow">Sample network</span><span class="small faint">Fictional companies and lots. Nothing here has been traded.</span></div>
      <div class="net-strip-grid">
        <div><b>${state.companies.length}</b><span>fictional companies</span></div>
        <div><b>${new Set(state.companies.map((x) => Engine.countryOf(x.city))).size}</b><span>countries</span></div>
        <div><b>${M.lots.length.toLocaleString("en-US")}</b><span>active lots</span></div>
        <div><b>${M.pool.length.toLocaleString("en-US")}</b><span>possible exchanges ready${M.truncated ? " (search cut short)" : ""}</span></div>
        <div><b>${won(M.recommended.selected.reduce((sum, x) => sum + x.nodes.reduce((t, n) => t + M.G.v[n], 0), 0))}</b><span>listed value in the ${M.status.proven ? "recommended" : "suggested"} set, if every exchange went ahead (model estimate)</span></div>
      </div>
    </section>
    <div class="stats">
      <div class="stat"><div class="lab">Lots available to exchange</div><div class="val">${active.length}</div><div class="sub">${allMine.length - active.length} reserved, paused or exchanged</div></div>
      <div class="stat"><div class="lab">Listed value available</div><div class="val">${won(active.reduce((s, l) => s + l.value, 0))}</div><div class="sub">Your own estimate</div></div>
      <div class="stat"><div class="lab">${esc(c.name)}'s exchange options</div><div class="val">${v.ready.length}</div><div class="sub">${v.ready.filter((i) => i.k > 2).length} multi-way, ${v.belowMin.length} below a minimum</div></div>
      <div class="stat"><div class="lab">Awaiting your approval</div><div class="val">${openApprovals.length}</div><div class="sub">${liveEx.length} exchanges in progress (simulated)</div></div>
    </div>
    <div class="grid-main">
      <section class="stack" style="min-width:0">
        <div class="between"><h2>Potential matches</h2><button class="btn ghost" data-go="matches">All matches →</button></div>
        ${top.length ? top.map((i) => exchangeCard(i, c.id)).join("") : `<div class="empty"><h3>No exchange options for ${esc(c.name)} right now</h3><p class="small">${v.blocked.length ? `${plural(v.blocked.length, "fabric match")} didn't pay for everyone. Exchange Matches shows why.` : "No other company has asked for these lots yet."}</p></div>`}
      </section>
      <aside class="stack" style="min-width:0">
        <div class="card"><div class="between"><h3>Your lots</h3><button class="btn ghost sm" data-go="inventory">Manage</button></div>
          <div style="margin-top:8px">${active.slice(0, 5).map((l) => `<div class="row" style="padding:7px 0;border-top:1px solid var(--line);flex-wrap:nowrap"><span class="sw" style="${swatchStyle(l)};width:36px;height:36px;border-radius:7px;flex:none"></span><div style="min-width:0;flex:1"><div class="small" style="font-weight:600">${esc(l.name)}</div><div>${routePill(v.routes(l.id), v.workable(l.id))}</div></div></div>`).join("") || `<p class="small muted">No lots available.</p>`}</div>
          <p class="small faint" style="margin-top:8px">You can join several exchanges at once. Each lot goes to only one.</p></div>
        <div class="card"><div class="between"><h3>Recent activity</h3><button class="btn ghost sm" data-go="activity">All</button></div>
          <div style="margin-top:6px">${acts.map((a) => `<div style="padding:7px 0;border-top:1px solid var(--line)" class="small"><div>${esc(a.text)}</div><div class="faint">${ago(a.at)} · simulated</div></div>`).join("") || `<p class="small muted">Nothing yet. Open an exchange to start the simulated approval flow.</p>`}</div></div>
      </aside>
    </div>
  </div>`;
}

/* ---- 2. My Inventory ---- */
function pageInventory() {
  const c = me(), v = Engine.companyView(state, M, c.id);
  const all = state.lots.filter((l) => l.owner === c.id);
  const f = ui.invFilter;
  const shown = all.filter((l) => f === "all" || (f === "active" ? l.status === "active" : l.status !== "active"));
  return `
  <div class="page-head"><div><h1>My Inventory</h1><p>Surplus lots ${esc(c.name)} is willing to exchange. Every change updates your matches.</p></div>
    <button class="btn primary" id="inv-add" data-act="new-lot" data-tour="add-lot">Add a lot</button></div>
  <div class="note" style="margin-bottom:14px"><b>One lot, one exchange.</b> Your company can take part in several exchanges at the same time, as long as each uses a different lot.</div>
  <div class="row" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Filter lots">${[["active", "Available"], ["other", "Reserved, paused, exchanged"], ["all", "All"]].map(([k, l]) => `<button id="inv-f-${k}" data-act="inv-filter" data-v="${k}" aria-pressed="${f === k}">${l}</button>`).join("")}</div></div>
  ${shown.length ? `<div class="lot-grid">${shown.map((l) => {
    const locked = Engine.lotLockedBy(state, l.id);
    const placed = M.lotInRec.get(l.id);
    return lotCard(l, {
      tour: l.id,
      extra: l.status === "active" ? `<div>${routePill(v.routes(l.id), v.workable(l.id))}</div>${placed ? `<div class="small faint">Placed in a ${placed.k === 2 ? "direct swap" : placed.k + "-way exchange"}</div>` : ""}` : "",
      actions: l.status === "exchanged" ? "" : `<span class="row" style="gap:3px">
        ${locked ? `<button class="btn ghost sm" data-act="open-ex" data-sig="${esc(locked.sig)}">View exchange</button>` : `<button class="btn ghost sm" id="edit-${l.id}" data-act="edit-lot" data-id="${l.id}">Edit</button>
        <button class="btn ghost sm" id="pause-${l.id}" data-act="toggle-pause" data-id="${l.id}">${l.status === "paused" ? "Resume" : "Pause"}</button>
        <button class="btn ghost sm" id="rm-${l.id}" data-act="remove-lot" data-id="${l.id}" aria-label="Remove ${esc(l.name)}">Remove</button>`}</span>`,
    });
  }).join("")}</div>` : `<div class="empty"><h3>Nothing here</h3><p class="small">Add a lot to see which exchanges it unlocks.</p></div>`}`;
}

function citySelect(name, val) {
  const groups = {};
  for (const [city, c] of Object.entries(Engine.CITIES)) (groups[c.country] = groups[c.country] || []).push(city);
  return `<select id="f-${name}" name="${name}">${Object.keys(groups).sort().map((country) => `<optgroup label="${esc(country)}">${groups[country].map((x) => `<option value="${esc(x)}" ${x === val ? "selected" : ""}>${esc(x)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}
function lotForm() {
  const d = ui.drawer, l = d.draft, e = d.errors || {};
  const aria = (name) => (e[name] ? `aria-invalid="true" aria-describedby="err-${name}"` : "");
  const fld = (name, label, input, hint) => `<div class="field ${name === "name" || name === "note" || name === "composition" ? "full" : ""}"><label for="f-${name}">${label}</label>${input}${hint ? `<span class="hint">${hint}</span>` : ""}${e[name] ? `<span class="err" id="err-${name}" role="alert">${esc(e[name])}</span>` : ""}</div>`;
  const txt = (name, val, extra = "") => `<input id="f-${name}" name="${name}" type="text" value="${esc(val ?? "")}" ${aria(name)} ${extra}>`;
  const numb = (name, val, extra = "") => `<input id="f-${name}" name="${name}" type="number" inputmode="decimal" value="${esc(val ?? "")}" ${aria(name)} ${extra}>`;
  const sel = (name, val, opts) => `<select id="f-${name}" name="${name}">${opts.map((o) => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  return `<form id="lot-form" class="form-grid" novalidate>
    ${fld("name", "Textile name", txt("name", l.name, 'placeholder="e.g. Washed Indigo Selvedge Denim"'))}
    ${fld("category", "Material category", sel("category", l.category, Engine.CATEGORIES))}
    ${fld("city", "Location", citySelect("city", l.city), "Used to estimate shipping")}
    ${fld("composition", "Composition", txt("composition", l.compositionText, 'placeholder="98% cotton, 2% elastane"'), `Must add up to 100%. Fibers: ${Engine.FIBERS.join(", ")}.`)}
    ${fld("gsm", "Weight (GSM)", numb("gsm", l.gsm, 'min="1"'))}
    ${fld("width", "Width (cm)", numb("width", l.width, 'min="1"'))}
    ${fld("colorFamily", "Color family", sel("colorFamily", l.colorFamily, Object.keys(Engine.COLORS)))}
    ${fld("color", "Color name", txt("color", l.color, 'placeholder="Optional"'))}
    ${fld("qty", "Quantity (m)", numb("qty", l.qty, 'min="1"'), "The whole lot moves together")}
    ${fld("value", "Estimated value (KRW)", numb("value", l.value, 'min="1" step="10000"'), "Your own estimate, not a verified price")}
    ${fld("outsidePct", "Clearance value (%)", numb("outsidePct", Math.round((l.outsidePct ?? 0.5) * 100), 'min="0" max="100"'), "What you'd recover by selling it off another way, as % of estimated value. You give this up by exchanging.")}
    <div class="field"><span class="lab">Certifications (self-declared)</span><div class="row">${Engine.CERTS.map((x) => `<label class="small row" style="gap:4px"><input type="checkbox" name="cert" value="${x}" ${(l.certs || []).includes(x) ? "checked" : ""}>${x}</label>`).join("")}</div></div>
    ${fld("note", "Notes", `<textarea id="f-note" name="note">${esc(l.note || "")}</textarea>`)}
    <div class="field full"><span class="lab">Photos</span><div class="photo-row">${(l.photos || []).map((p, i) => `<div class="photo" style="background-image:url('${p}')"><button type="button" data-act="rm-photo" data-i="${i}" aria-label="Remove photo ${i + 1}">×</button></div>`).join("")}
      ${(l.photos || []).length < 3 ? `<button type="button" class="btn sm" id="pick-photo" data-act="pick-photo" style="height:74px;width:74px;white-space:normal">Add photo</button><input type="file" accept="image/*" id="photo-in" hidden aria-label="Choose a photo">` : ""}</div>
      <span class="hint">Up to 3. Resized and kept in this browser only. Without a photo, the card shows a generated texture.</span>${e.photos ? `<span class="err" role="alert">${esc(e.photos)}</span>` : ""}</div>
    <button type="submit" hidden aria-hidden="true" tabindex="-1"></button>
  </form>`;
}

/* ---- 3. My Preferences ---- */
function chipSet(pid, field, options, selected) {
  return `<div class="chips" role="group">${options.map((o, i) => `<button type="button" class="chip" id="chip-${pid}-${field}-${i}" data-act="pf-chip" data-pid="${pid}" data-field="${field}" data-v="${esc(o)}" aria-pressed="${(selected || []).includes(o)}">${esc(o)}</button>`).join("")}</div>`;
}
function profileFitPill(c, p) {
  const others = state.lots.filter((l) => l.owner !== c.id && l.status === "active");
  const count = others.filter((l) => Engine.checkProfile(c, p, l).pass).length;
  const clash = p.gsmMin != null && p.gsmMax != null && p.gsmMin > p.gsmMax;
  return `<span class="pill ${count ? "ok" : ""}">${plural(count, "lot")} fit today</span>${clash ? `<span class="pill bad">"GSM from" is above "GSM to"</span>` : ""}`;
}
function prefStats() {
  const c = me(), v = Engine.companyView(state, M, c.id);
  const others = state.lots.filter((l) => l.owner !== c.id && l.status === "active");
  const accepted = others.filter((l) => Engine.assess(c, l).accepted);
  return `<div class="stat"><div class="lab">Lots you would accept</div><div class="val">${accepted.length}</div><div class="sub">Of ${others.length} from other companies</div></div>
    <div class="stat"><div class="lab">Exchange options ready</div><div class="val">${v.ready.length}</div><div class="sub">Everyone clears their minimum</div></div>
    <div class="stat"><div class="lab">Below a minimum</div><div class="val">${v.belowMin.length}</div><div class="sub">Works on paper, not yet acceptable</div></div>

function marketResults() {
  const c = me();

  const rows = all.slice(0, ui.mpCap);
  const more = all.length - rows.length;
  return `<div class="lot-grid">${rows.map(({ l, a }) => {
    const miss = !a.accepted ? Engine.closestMiss(a) : null;
    const override = (c.overrides || {})[l.id];
    const rs = Engine.companyView(state, M, c.id).ready.filter((i) => i.lots.includes(l.id));
    const fit = a.accepted ? `<span class="pill ok">${a.source === "wishlist" ? "On your wishlist" : "Fits what you need"}</span>` : override === "reject" ? `<span class="pill bad">Not for us</span>` : `<span class="pill">Outside your needs</span>`;
    const whyNot = miss && miss.failed.length ? `<div class="small faint">${esc(miss.failed[0].label)}: ${esc(miss.failed[0].detail)}</div>` : "";
    return lotCard(l, {
      showOwner: true,
      extra: `<div class="row">${fit}${rs.length ? `<span class="pill brand">${plural(rs.length, "exchange option")}</span>` : ""}</div>${whyNot}`,
      actions: `<span class="row" style="gap:3px"><button class="btn ghost sm" id="view-${l.id}" data-act="view-lot" data-id="${l.id}">Details</button>${a.source === "profile" ? "" : override === "accept" ? `<button class="btn ghost sm" id="wish-${l.id}" data-act="set-override" data-id="${l.id}" data-v="">Unlist</button>` : `<button class="btn sm" id="wish-${l.id}" data-act="set-override" data-id="${l.id}" data-v="accept">Wishlist</button>`}</span>`,

function shippingAssumptions() {
  const s = state.settings;
  return `<details class="ship-assume"><summary>Shipping cost assumptions</summary>
    <p class="small muted" style="margin:6px 0 8px"><b>Illustrative estimates, not freight quotes.</b> These figures are prototype assumptions and have not been validated against carrier rates. Tariffs, duties, taxes and customs compliance are <b>not</b> included in any figure.</p>
    <div class="tw"><table><thead><tr><th>Part</th><th>How it's estimated</th><th>Current value</th></tr></thead><tbody>
      <tr><td>Distance</td><td>Great-circle (Haversine) distance between city centres, 8 km minimum</td><td>Approximate coordinates</td></tr>
      <tr><td>Weight</td><td>Length × width × GSM. Excludes rolls and packaging</td><td>Calculated per lot</td></tr>
      <tr><td>Domestic road</td><td>Fixed cost + rate × routed km × kg / 50. Routed km = distance × road factor. Beyond ${s.taper_km} km the rate falls to ${Math.round(s.taper_share * 100)}%</td><td>${won(s.c_fixed)} + ₩${s.c_km} per km per 50 kg, factor ${s.road_factor}</td></tr>
      <tr><td>Cross-border handling</td><td>Forwarding and documents, per shipment</td><td>${won(s.intl_handling)}</td></tr>
      <tr><td>Customs processing</td><td>Administrative handling only. Not duties or taxes</td><td>${won(s.customs_fee)}</td></tr>
      <tr><td>International freight (estimated)</td><td>Rate × kg × routed km / 1,000, with a minimum charge. Routed km = distance × route factor, since freight doesn't travel in a straight line</td><td>₩${s.freight_rate} per kg per 1,000 km, factor ${s.freight_route}, minimum ${won(s.intl_min)}</td></tr>
      <tr><td>Air freight (estimated)</td><td>Same formula at a higher rate</td><td>₩${s.air_rate} per kg per 1,000 km, factor ${s.air_route}</td></tr>
    </tbody></table></div></details>`;
}
