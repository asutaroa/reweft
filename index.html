<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reweft: Circular Textile Exchange (Prototype)</title>
<meta name="description" content="Prototype B2B exchange where textile companies list deadstock, state what they need, and join 2, 3 and 4-way circular exchanges. Fictional demo data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231f4d3a' stroke-width='4'/%3E%3Cpath d='M16 5a11 11 0 0 1 9.5 16.5' fill='none' stroke='%23b0603a' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f6f4ef; --panel: #fffefb; --panel-2: #f1eee7; --line: #e5e1d7; --line-2: #d6d1c4;
  --ink: #191a17; --ink-2: #55564f; --ink-3: #7c7c72;
  --brand: #1f4d3a; --brand-2: #2f6b52; --brand-soft: #e4ede7; --clay: #b0603a; --clay-soft: #f6e8df;
  --ok: #1f7a4d; --ok-soft: #e2f1e8; --warn: #9a6a0c; --warn-soft: #f8efd9; --bad: #a93a32; --bad-soft: #f8e5e2;
  --radius: 14px; --radius-s: 9px;
  --shadow: 0 1px 2px rgba(25,26,23,.05), 0 6px 22px rgba(25,26,23,.05);
  --shadow-l: 0 12px 44px rgba(25,26,23,.18);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font: 500 30px/1.15 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
h2 { font: 500 21px/1.2 var(--serif); letter-spacing: -.005em; }
h3 { font-size: 15px; font-weight: 620; line-height: 1.3; }
h4 { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 12.5px; } .num { font-variant-numeric: tabular-nums; }

/* Shell */
main { min-width: 0; padding: 28px 36px 80px; max-width: 1280px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 7px 36px; font-size: 12.5px; color: var(--ink-2); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { color: var(--ink-2); margin-top: 5px; max-width: 66ch; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-weight: 550; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn.danger { color: var(--bad); border-color: #e4c3bf; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); padding: 6px 8px; }
.btn.ghost:hover { background: var(--panel-2); color: var(--ink); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
input[type="text"], input[type="search"], input[type="number"], select, textarea { width: 100%; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; font-size: 13.5px; }
textarea { min-height: 62px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .lab { font-size: 12.5px; font-weight: 550; color: var(--ink-2); }
.field .hint { font-size: 11.5px; color: var(--ink-3); }
.field .err { font-size: 12px; color: var(--bad); font-weight: 550; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.form-grid .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line-2); background: var(--panel); border-radius: 99px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 13px; font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand); } .pill.clay { background: var(--clay-soft); color: var(--clay); }
.pill.sim { background: none; border: 1px dashed var(--line-2); color: var(--ink-2); }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card > h2, .card > h3 { margin-bottom: 4px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .lab { font-size: 12.5px; color: var(--ink-2); }
.stat .val { font: 500 27px/1.2 var(--serif); margin-top: 3px; }
.stat .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* Textile cards */
.lot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 16px; }
.lot { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; min-width: 0; }
.lot:hover { transform: translateY(-2px); box-shadow: var(--shadow-l); }
.swatch { position: relative; background-size: cover; background-position: center; }
.lot .swatch { height: 148px; }
.swatch .tagline { position: absolute; left: 8px; bottom: 8px; background: rgba(255,254,251,.9); color: var(--ink-2); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; }
.swatch .corner { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.lot-body { padding: 12px 14px 13px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.lot-title { font-weight: 620; font-size: 14.5px; line-height: 1.3; }
.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; font-size: 12.5px; color: var(--ink-2); }
.lot-foot { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); flex: none; }
.mono { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 650; flex: none; letter-spacing: .02em; }
.mono.sm { width: 22px; height: 22px; font-size: 9px; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }

/* Exchange cards */
.ex { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 16px; cursor: pointer; transition: border-color .15s; text-align: left; width: 100%; }
.ex:hover { border-color: var(--brand-2); }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.chain .hop { display: flex; align-items: center; gap: 7px; background: var(--bg); border-radius: 9px; padding: 5px 9px 5px 5px; min-width: 0; font-size: 12.5px; }
.chain .sw { width: 30px; height: 30px; border-radius: 6px; background-size: cover; flex: none; }
.chain .arrow { color: var(--ink-3); }
.ex-side { border-left: 1px solid var(--line); padding-left: 16px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.gain { font: 500 22px/1.2 var(--serif); }
.give-get { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.give-get > div { background: var(--bg); border-radius: 10px; padding: 8px; display: flex; gap: 9px; align-items: center; min-width: 0; }
.give-get .sw { width: 42px; height: 42px; border-radius: 7px; flex: none; background-size: cover; }

/* Graph */
.graph { width: 100%; min-height: 200px; }
.graph svg { display: block; width: 100%; height: auto; }
.flow-step { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.flow-step:first-child { border-top: 0; }
.flow-step .sw { width: 54px; height: 54px; border-radius: 9px; background-size: cover; }

/* Tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 8px 11px; background: var(--bg); vertical-align: bottom; }
td { padding: 8px 11px; border-top: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pos { color: var(--ok); font-weight: 600; } .neg { color: var(--bad); font-weight: 600; }

/* Notes */
.note { background: var(--bg); border-radius: 10px; padding: 10px 13px; font-size: 13px; color: var(--ink-2); }
.note b { color: var(--ink); }
.note.warn { background: var(--warn-soft); } .note.clay { background: var(--clay-soft); } .note.ok { background: var(--ok-soft); }
.check { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 7px; font-size: 13px; padding: 3px 0; }
.tick { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; color: #fff; margin-top: 2px; }
.tick.y { background: var(--ok); } .tick.n { background: var(--bad); } .tick.w { background: var(--line-2); color: var(--ink-2); }
.timeline { display: flex; gap: 0; flex-wrap: wrap; margin: 6px 0; }
.tl { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); padding-right: 12px; }
.tl i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); display: inline-block; }
.tl.done { color: var(--ink); } .tl.done i { background: var(--brand); }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 62px; align-items: center; gap: 10px; font-size: 13px; }
.bar-track { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--brand); border-radius: 5px; transition: width .35s; }

/* Empty */
.empty { text-align: center; padding: 34px 20px; border: 1px dashed var(--line-2); border-radius: var(--radius); color: var(--ink-2); }
.empty h3 { margin-bottom: 5px; color: var(--ink); }

/* Drawer, toast, tour */
.scrim { position: fixed; inset: 0; background: rgba(25,26,23,.32); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel); z-index: 41; box-shadow: var(--shadow-l); display: flex; flex-direction: column; }
.drawer header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.drawer .body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.drawer footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: var(--shadow-l); max-width: min(560px, 90vw); }
.tour { position: fixed; right: 22px; bottom: 22px; width: min(370px, calc(100vw - 32px)); background: var(--ink); color: #f6f4ef; border-radius: var(--radius); padding: 16px 18px; z-index: 50; box-shadow: var(--shadow-l); }
.tour h3 { font: 500 18px/1.25 var(--serif); margin: 4px 0 6px; }
.tour p { font-size: 13.5px; color: #d9d6cc; }
.tour .bar { height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
.tour .bar i { display: block; height: 100%; background: #9fd0b5; }
.tour .btn { background: #f6f4ef; color: var(--ink); border-color: #f6f4ef; }
.tour .btn.ghost { background: none; color: #d9d6cc; border-color: transparent; }
.tour-target { outline: 2px solid var(--clay); outline-offset: 4px; border-radius: 10px; }
.photo-row { display: flex; gap: 8px; flex-wrap: wrap; }
.photo { position: relative; width: 74px; height: 74px; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid var(--line); }
.photo button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 11px; cursor: pointer; line-height: 1; }
details summary { cursor: pointer; font-weight: 550; font-size: 13px; color: var(--ink-2); }
details[open] summary { margin-bottom: 8px; }
.hero { background: linear-gradient(135deg, #1f4d3a, #17392b); color: #f6f4ef; border-radius: var(--radius); padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: center; box-shadow: var(--shadow); }
.hero h2 { color: #fff; font-size: 24px; margin: 6px 0; }
.hero p { color: #d6e2da; font-size: 14px; }
.hero .btn { background: #f6f4ef; color: var(--brand); border-color: #f6f4ef; }
.hero .btn.outline { background: none; color: #f6f4ef; border-color: rgba(255,255,255,.4); }
.hero .pill { background: rgba(255,255,255,.14); color: #f6f4ef; }
.hero .graph text { fill: #f6f4ef; }

@media (max-width: 1040px) { .grid-main, .hero { grid-template-columns: minmax(0, 1fr); } .hero .graph { max-width: 340px; } }
@media (max-width: 820px) {
  main { padding: 18px 16px 90px; } .banner { padding: 6px 16px; }
  h1 { font-size: 25px; }
  .grid2, .form-grid { grid-template-columns: minmax(0, 1fr); }
  .ex { grid-template-columns: minmax(0, 1fr); } .ex-side { border-left: 0; border-top: 1px solid var(--line); padding: 10px 0 0; }
  .give-get { grid-template-columns: minmax(0, 1fr); }
  .tour { right: 16px; bottom: 16px; }
  .flow-step { grid-template-columns: 44px minmax(0, 1fr); } .flow-step .sw { width: 44px; height: 44px; } .flow-step .end { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* v2: solver status, network, onboarding */
.solver { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; font-size: 13px; }
.solver.optimal { border-color: #bcd9c6; background: var(--ok-soft); }
.solver.time_limited, .solver.truncated { border-color: #e6d3a4; background: var(--warn-soft); }
.tick.h { background: #b78716; }
.net-card { padding-bottom: 14px; }
.net-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.net-canvas { min-width: 0; }
.net-canvas svg { display: block; width: 100%; height: auto; }
.net-canvas [role="button"]:focus-visible { outline: none; }
.net-canvas [role="button"]:focus-visible circle:nth-of-type(2) { stroke: var(--clay); stroke-width: 4; }
.net-panel { min-width: 0; font-size: 13.5px; }
.net-steps { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.net-step { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--bg); border: 1px solid transparent; border-radius: 9px; padding: 6px 8px; cursor: pointer; font-size: 13px; line-height: 1.35; }
.net-step:hover { border-color: var(--line-2); }
.net-step.mine { background: var(--clay-soft); }
.net-step[aria-pressed="true"], .net-step.hop-on { border-color: var(--brand-2); box-shadow: 0 0 0 1px var(--brand-2); }
.net-step .sw { width: 38px; height: 38px; border-radius: 7px; background-size: cover; display: block; }
.net-step-text b { font-weight: 620; }
.net-opts { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; max-height: 190px; overflow-y: auto; }
.net-opt { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 5px 7px; border-radius: 7px; cursor: pointer; text-align: left; font-size: 12.5px; color: var(--ink-2); }
.net-opt:hover { background: var(--panel-2); }
.net-opt[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.net-opt i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.net-hop { transition: opacity .2s, stroke-width .2s; }
.net-hop.hop-off { opacity: .22; }
.net-hop.hop-on { stroke-width: 5; }
.net-chip { transition: opacity .2s; }
.net-chip.hop-off { opacity: .35; }
.welcome { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border-radius: 18px; padding: 28px 30px; z-index: 41; box-shadow: var(--shadow-l); }
.welcome-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.welcome-steps { margin: 14px 0 0; padding-left: 20px; font-size: 14px; }
.welcome-steps li { margin-bottom: 6px; }
@media (max-width: 1040px) { .net-layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) { .welcome-grid { grid-template-columns: minmax(0, 1fr); } .welcome { padding: 20px; } #welcome-graph { max-width: 300px; margin: 0 auto; } }
.net-opt-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.net-opt-text .faint { font-size: 11.5px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.net-opts { max-height: 240px; }

/* v3: horizontal header, company identity, calmer hierarchy */
:root { --shadow: 0 1px 2px rgba(25,26,23,.04); --shadow-l: 0 14px 44px rgba(25,26,23,.16); --content: 1160px; }
h1 { font-size: 34px; }
h2 { font-size: 22px; }
.banner { justify-content: center; padding: 6px 24px; font-size: 12px; background: var(--bg); border-bottom: 1px solid var(--line); text-align: center; }
.banner b { font-weight: 600; color: var(--ink); }
.top-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 20px 32px 12px; background: var(--bg); }
.top-left { justify-self: start; } .top-right { justify-self: end; display: flex; align-items: center; gap: 14px; }
.brand { display: inline-flex; align-items: center; gap: 11px; background: none; border: 0; padding: 2px 4px; cursor: pointer; color: var(--ink); }
.brand b { font: 500 31px/1 var(--serif); letter-spacing: -.015em; }
.brand-mark { width: 31px; height: 31px; flex: none; }
.link-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 5px 2px; font-size: 13px; color: var(--ink-2); cursor: pointer; border-radius: 4px; white-space: nowrap; }
.link-btn:hover, .link-btn.on { color: var(--ink); }
.link-btn .q { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-2); font-size: 10.5px; }
.chev { width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); display: inline-block; margin-left: 3px; flex: none; transition: transform .15s; }
[aria-expanded="true"] > .chev { transform: rotate(225deg) translate(-2px, 0); }
.menu-wrap { position: relative; }

<script>
/*
 * solver.js - optimisers replacing the SciPy calls in swap_sim.py.
 *
 * solvePacking  replaces scipy.optimize.milp (HiGHS) and solves the same integer
 *               program: max sum w_c x_c, s.t. each firm is in at most one chosen
 *               cycle. Method: connected components, then branch and bound with a
 *               Lagrangian upper bound (firm prices u_i >= 0):
 *                   L(u) = sum_i u_i + sum_c max(0, w_c - sum_{i in c} u_i)
 *               If the time limit is reached the incumbent is returned and flagged
 *               as not proven optimal, with its upper bound.
 *
 * linearSumAssignment  replaces scipy.optimize.linear_sum_assignment
 *               (shortest augmenting paths, O(n^3), minimum total cost).
 */
(globalThis.KX_MODULES = globalThis.KX_MODULES || []).push(function solverModule(KX) {
  "use strict";

  const EPS = 1e-9;

  function solveComponent(cycles, nFirms, deadline, stats) {
    const m = cycles.length;
    const w = new Float64Array(m);
    const members = new Array(m);
    for (let c = 0; c < m; c++) { w[c] = cycles[c].w; members[c] = cycles[c].nodes; }
    const firmCycles = Array.from({ length: nFirms }, () => []);
    for (let c = 0; c < m; c++) for (const f of members[c]) firmCycles[f].push(c);

    let incumbent = [], incumbentValue = 0;
    const dead = new Int32Array(m);    // >0: excluded at the current search node
    const used = new Uint8Array(nFirms);
    const rc = new Float64Array(m);

    const consider = (picks, value) => {
      if (value > incumbentValue + EPS) { incumbentValue = value; incumbent = picks.slice(); }
    };

    /** Lagrangian value over alive cycles and free firms; fills rc and the subgradient. */
    function evalL(u, g) {
      let L = 0;
      for (let f = 0; f < nFirms; f++) {
        g[f] = 1;
        if (!used[f]) L += u[f];
      }
      for (let c = 0; c < m; c++) {
        if (dead[c]) continue;
        const nodes = members[c];
        let r = w[c];
        for (let k = 0; k < nodes.length; k++) r -= u[nodes[k]];
        rc[c] = r;
        if (r > 0) {
          L += r;
          for (let k = 0; k < nodes.length; k++) g[nodes[k]] -= 1;
        }
      }
      return L;
    }

    /** Subgradient steps on prices; keeps the lowest bound (any u >= 0 is valid). */
    function improve(u, iters, value, thetaStart) {
      const g = new Float64Array(nFirms), bestU = Float64Array.from(u);
      let bestL = Infinity, theta = thetaStart, stall = 0;
      for (let it = 0; it < iters; it++) {
        const L = evalL(u, g);
        if (L < bestL - 1e-12) { bestL = L; bestU.set(u); stall = 0; }
        else if (++stall >= 12) { theta *= 0.5; stall = 0; }
        const target = Math.max(incumbentValue - value, 0);
        if (bestL <= target + EPS) break;
        let norm = 0;
        for (let f = 0; f < nFirms; f++) if (!used[f]) {
          const dir = u[f] > 0 || g[f] < 0 ? g[f] : 0;
          norm += dir * dir;
        }
        if (norm < 1e-12) break;
        const t = (theta * Math.max(L - target, 1e-9)) / norm;
        for (let f = 0; f < nFirms; f++) if (!used[f]) u[f] = Math.max(0, u[f] - t * g[f]);
      }
      const finalL = evalL(bestU, g); // leave rc consistent with the returned prices
      u.set(bestU);
      return Math.min(bestL, finalL);
    }

    /** Greedy primal heuristic: alive cycles by reduced cost, then by weight. */
    function primal(u, base, value) {
      const order = [];
      for (let c = 0; c < m; c++) if (!dead[c]) order.push(c);
      order.sort((a, b) => rc[b] - rc[a] || w[b] - w[a]);
      const taken = new Uint8Array(nFirms);
      const picks = base.slice();
      let val = value;
      for (const c of order) {
        const nodes = members[c];
        let free = true;
        for (let k = 0; k < nodes.length; k++) if (taken[nodes[k]]) { free = false; break; }
        if (!free) continue;
        for (let k = 0; k < nodes.length; k++) taken[nodes[k]] = 1;
        picks.push(c);
        val += w[c];
      }
      consider(picks, val);
    }

    // Root: tighten prices and reduced-cost-fix cycles that cannot be in any better solution.
    const u0 = new Float64Array(nFirms);
    for (let c = 0; c < m; c++) {
      const share = w[c] / members[c].length;
      for (const f of members[c]) if (share > u0[f]) u0[f] = share;
    }
    const rootIters = m > 4000 ? 150 : 400;
    evalL(u0, new Float64Array(nFirms));
    primal(u0, [], 0);
    const rootUB = improve(u0, rootIters, 0, 1.5);
    primal(u0, [], 0);
    for (let c = 0; c < m; c++) if (rc[c] < 0 && rootUB + rc[c] < incumbentValue - EPS) dead[c] = 1;

    const nodeIters = m > 4000 ? 1 : m > 800 ? 4 : 10;
    const chosen = [];
    let timedOut = false, nodes = 0;

    const removeFirm = (f, delta) => {
      used[f] = delta > 0 ? 1 : 0;
      const list = firmCycles[f];
      for (let i = 0; i < list.length; i++) dead[list[i]] += delta;
    };

    function dfs(value, parentU) {
      if (timedOut) return;
      if ((++nodes & 63) === 0 && Date.now() > deadline) { timedOut = true; return; }
      consider(chosen, value);

      const u = Float64Array.from(parentU);
      let anyAlive = false;
      for (let c = 0; c < m; c++) if (!dead[c]) { anyAlive = true; break; }
      if (!anyAlive) return;
      // Firms with no alive cycle carry no value at this node.
      const liveFirm = new Uint8Array(nFirms);
      for (let c = 0; c < m; c++) if (!dead[c]) for (const f of members[c]) liveFirm[f] = 1;
      const released = [];
      for (let f = 0; f < nFirms; f++) if (!used[f] && !liveFirm[f]) { used[f] = 1; released.push(f); u[f] = 0; }

      const bound = improve(u, nodeIters, value, 0.8);
      const undo = () => { for (const f of released) used[f] = 0; };
      if (value + bound <= incumbentValue + EPS) { undo(); return; }
      if ((nodes & 7) === 1) primal(u, chosen, value);

      // Branch on the firm where the relaxation is most in conflict.
      const conflict = new Int32Array(nFirms);
      for (let c = 0; c < m; c++) if (!dead[c] && rc[c] > 0) for (const f of members[c]) conflict[f]++;
      let branch = -1, bc = -1, bp = -1;
      for (let f = 0; f < nFirms; f++) {
        if (used[f]) continue;
        if (conflict[f] > bc || (conflict[f] === bc && u[f] > bp)) { branch = f; bc = conflict[f]; bp = u[f]; }
      }
      if (branch < 0) { undo(); return; }
      const opts = [];
      const rcSnapshot = new Map();
      for (const c of firmCycles[branch]) if (!dead[c]) { opts.push(c); rcSnapshot.set(c, rc[c]); }
      opts.sort((a, b) => rcSnapshot.get(b) - rcSnapshot.get(a));

      for (const c of opts) {
        // Reduced-cost test: forcing c cannot beat the incumbent.
        const r = rcSnapshot.get(c);
        if (r < 0 && value + bound + r <= incumbentValue + EPS) continue;
        chosen.push(c);
        for (const f of members[c]) removeFirm(f, 1);
        dfs(value + w[c], u);
        for (const f of members[c]) removeFirm(f, -1);
        chosen.pop();
        if (timedOut) { undo(); return; }
      }
      removeFirm(branch, 1); // branch: this firm joins no cycle
      dfs(value, u);
      removeFirm(branch, -1);
      undo();
    }
    dfs(0, u0);
    stats.nodes += nodes;
    return {
      picks: incumbent, value: incumbentValue, proven: !timedOut,
      ub: timedOut ? Math.max(rootUB, incumbentValue) : incumbentValue,
    };
  }

  /**
   * @param {number} N number of firms
   * @param {{nodes:number[], w:number}[]} cands candidate cycles
   * @returns {{selected:number[], value:number, optimal:boolean, upperBound:number, nodes:number}}
   */
  KX.solvePacking = function solvePacking(N, cands, opts) {
    const timeLimitMs = (opts && opts.timeLimitMs) || 30000;
    const deadline = Date.now() + timeLimitMs;
    const parent = Int32Array.from({ length: N }, (_, i) => i);
    const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
    for (const c of cands) for (let k = 1; k < c.nodes.length; k++) parent[find(c.nodes[k])] = find(c.nodes[0]);

    const comps = new Map();
    cands.forEach((c, idx) => {
      const r = find(c.nodes[0]);
      if (!comps.has(r)) comps.set(r, []);
      comps.get(r).push(idx);
    });

    const stats = { nodes: 0 };
    const selected = [];
    let value = 0, ub = 0, optimal = true;
    for (const idxs of comps.values()) {
      const localId = new Map();
      const local = idxs.map((idx) => ({
        w: cands[idx].w,
        nodes: cands[idx].nodes.map((f) => {
          if (!localId.has(f)) localId.set(f, localId.size);
          return localId.get(f);
        }),
      }));
      const r = solveComponent(local, localId.size, deadline, stats);
      for (const p of r.picks) selected.push(idxs[p]);
      value += r.value; ub += r.ub;
      if (!r.proven) optimal = false;
    }
    return { selected, value, optimal, upperBound: ub, nodes: stats.nodes };
  };

  /** Minimum-cost assignment on a square cost matrix (flat, row-major). Returns colOfRow. */
  KX.linearSumAssignment = function linearSumAssignment(cost, n) {
    const INF = Infinity;
    const uu = new Float64Array(n + 1), vv = new Float64Array(n + 1);
    const p = new Int32Array(n + 1), way = new Int32Array(n + 1);
    const minv = new Float64Array(n + 1), usedCol = new Uint8Array(n + 1);
    for (let i = 1; i <= n; i++) {
      p[0] = i;
      let j0 = 0;
      minv.fill(INF);
      usedCol.fill(0);
      do {
        usedCol[j0] = 1;
        const i0 = p[j0];
        let delta = INF, j1 = 0;
        for (let j = 1; j <= n; j++) {
          if (usedCol[j]) continue;
          const cur = cost[(i0 - 1) * n + (j - 1)] - uu[i0] - vv[j];
          if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
          if (minv[j] < delta) { delta = minv[j]; j1 = j; }
        }
        for (let j = 0; j <= n; j++) {
          if (usedCol[j]) { uu[p[j]] += delta; vv[j] -= delta; } else minv[j] -= delta;
        }
        j0 = j1;
      } while (p[j0] !== 0);
      do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0 !== 0);
    }
    const colOfRow = new Int32Array(n);
    for (let j = 1; j <= n; j++) colOfRow[p[j] - 1] = j - 1;
    return colOfRow;
  };
});
const KX = {}; globalThis.KX_MODULES.forEach((m) => m(KX));
</script>
<script>
/* ===========================================================================
 * Matching engine. Pure logic, no DOM.
 *
 * Reused from the research code (see research-lab.html): the cycle enumeration
 * walk, net = W - S - C, the three participation regimes, expected profit w, and
 * the exact packing solver (KX.solvePacking, unchanged).
 *
 * Adapted for the product: graph nodes are inventory LOTS, not firms. A lot joins
 * at most one chosen cycle and a company appears at most once inside a cycle.
 * With one lot per company this reduces exactly to the research model.
 * ======================================================================== */
const Engine = (function () {
  "use strict";

  /* ---- Reference data ---- */
  const CITIES = { Seoul: [0, 0], Daegu: [150, -190], Busan: [200, -270], Daejeon: [10, -140], Gwangju: [-60, -250] };
  const CATEGORIES = ["Denim", "Cotton woven", "Jersey & knit", "Viscose & satin", "Silk", "Linen", "Wool & suiting", "Canvas & twill", "Technical synthetics", "Swim & active"];
  const FIBERS = ["cotton", "recycled cotton", "polyester", "recycled polyester", "viscose", "lyocell", "linen", "hemp", "wool", "silk", "nylon", "elastane"];
  const COLORS = {
    Indigo: "#2b3f66", Black: "#232325", Navy: "#1f2c49", Grey: "#8d8f92", Ecru: "#e9e0cd", White: "#f3f0ea", Beige: "#cdb999",
    Olive: "#68683f", Sage: "#99a78a", Terracotta: "#b6653f", Burgundy: "#6d2734", Rose: "#d2a0a0", Coral: "#e27d66", Mustard: "#c79a35", Khaki: "#a39670",
  };
  const CERTS = ["GOTS", "GRS", "OEKO-TEX"];

  /* ---- Default rules: same values as DEFAULTS in swap_sim.py, converted to KRW ---- */
  const DEFAULT_SETTINGS = Object.freeze({
    L: 4, regime: "ntu", p_fail: 0.05, fail_cost_share: 0.5, credit_discount: 0.8,
    c_fixed: 30000, c_km: 150, cost_scale: 1,
  });
  const REGIMES = {
    ntu: { label: "Everyone gains", note: "Every company must come out ahead from the swap itself. No credits involved." },
    credit_list: { label: "Balancing credits (simulated)", note: "Estimated-value gaps are settled in simulated credits, valued at the credit rate. This ledger is not budget-balanced and is not a payment system." },
    credit_surplus: { label: "Shared gain (theoretical)", note: "An exchange qualifies if the group gains overall, assuming gains can be shared perfectly. A theoretical upper bound, not an operable mechanism." },
  };

  /* ---- Lot helpers ---- */
  const lotKg = (l) => (l.qty * l.width / 100 * l.gsm) / 1000;
  const distKm = (a, b) => {
    const p = CITIES[a] || CITIES.Seoul, q = CITIES[b] || CITIES.Seoul;
    return Math.max(8, Math.hypot(p[0] - q[0], p[1] - q[1])); // straight-line km, 8 km floor inside a city
  };
  const fiberPct = (l, f) => l.composition[f] || 0;
  function parseComposition(text) {
    const out = {};
    let sum = 0, parts = 0;
    for (const raw of String(text).split(/[,;+\/]/)) {
      const m = raw.trim().toLowerCase().match(/^(\d+(?:\.\d+)?)\s*%?\s*(.+)$/);
      if (!m) { if (raw.trim()) return { error: `Could not read "${raw.trim()}". Use a format like 98% cotton, 2% elastane.` }; continue; }
      if (!FIBERS.includes(m[2].trim())) return { error: `Unknown fiber "${m[2].trim()}". Known fibers: ${FIBERS.join(", ")}.` };
      out[m[2].trim()] = (out[m[2].trim()] || 0) + Number(m[1]);
      sum += Number(m[1]); parts++;
    }
    if (!parts) return { error: "Enter at least one fiber, for example 100% cotton." };
    if (Math.abs(sum - 100) > 1) return { error: `Percentages add up to ${sum}%, not 100%.` };
    return { composition: out };
  }
  const compositionText = (c) => Object.entries(c).sort((a, b) => b[1] - a[1]).map(([f, p]) => `${p}% ${f}`).join(", ");

  /* ---- Compatibility: hard requirements. Replaces the random A[j,i]. ---- */
  function checkProfile(company, profile, lot) {
    const checks = [];
    const add = (key, label, pass, detail) => checks.push({ key, label, pass, detail });
    if (profile.categories && profile.categories.length)
      add("category", "Material category", profile.categories.includes(lot.category), `${lot.category}; wanted ${profile.categories.join(" or ")}`);
    if (profile.fiberMin && profile.fiberMin.fiber)
      add("fiber", "Required fiber", fiberPct(lot, profile.fiberMin.fiber) >= profile.fiberMin.min, `${fiberPct(lot, profile.fiberMin.fiber)}% ${profile.fiberMin.fiber}; needs at least ${profile.fiberMin.min}%`);
    if (profile.excludeFibers && profile.excludeFibers.length) {
      const hit = profile.excludeFibers.filter((f) => fiberPct(lot, f) > 0);
      add("exclude", "Excluded fibers", hit.length === 0, hit.length ? `Contains ${hit.join(", ")}` : `None of ${profile.excludeFibers.join(", ")}`);
    }
    if (profile.gsmMin != null || profile.gsmMax != null) {
      const lo = profile.gsmMin ?? 0, hi = profile.gsmMax ?? Infinity;
      add("gsm", "Weight (GSM)", lot.gsm >= lo && lot.gsm <= hi, `${lot.gsm} GSM; wanted ${lo}${hi === Infinity ? "+" : "-" + hi}`);
    }
    if (profile.widthMin != null) add("width", "Minimum width", lot.width >= profile.widthMin, `${lot.width} cm; needs ${profile.widthMin} cm`);
    if (profile.qtyMin != null) add("qty", "Minimum quantity", lot.qty >= profile.qtyMin, `${lot.qty} m; needs ${profile.qtyMin} m`);
    if (profile.colors && profile.colors.length) add("color", "Color", profile.colors.includes(lot.colorFamily), `${lot.colorFamily}; wanted ${profile.colors.join(", ")}`);
    if (profile.certs && profile.certs.length) {
      const miss = profile.certs.filter((c) => !(lot.certs || []).includes(c));
      add("cert", "Certification (self-declared)", miss.length === 0, miss.length ? `Missing ${miss.join(", ")}` : `Declares ${profile.certs.join(", ")}`);
    }
    if (profile.maxKm != null) {
      const d = distKm(lot.city, company.city);
      add("distance", "Maximum distance", d <= profile.maxKm, `${Math.round(d)} km; limit ${profile.maxKm} km`);
    }
    return { pass: checks.every((c) => c.pass), checks };
  }

  /** Does the company accept the lot, why, and what is it worth to them (W)? */
  function assess(company, lot) {
    if (company.id === lot.owner) return { accepted: false, source: "own", W: 0, profiles: [] };
    const override = (company.overrides || {})[lot.id];
    const profiles = (company.profiles || []).map((p) => Object.assign({ profile: p }, checkProfile(company, p, lot)));
    if (override === "reject") return { accepted: false, source: "rejected", W: 0, profiles };
    let best = null;
    for (const r of profiles) {
      if (!r.pass) continue;
      const soft = softMultiplier(r.profile, lot);
      const W = lot.value * r.profile.valueFactor * soft;
      if (!best || W > best.W) best = { W, soft, factor: r.profile.valueFactor, profile: r.profile, checks: r.checks };
    }
    if (best) return { accepted: true, source: "profile", W: best.W, soft: best.soft, factor: best.factor, profile: best.profile, checks: best.checks, profiles };
    if (override === "accept") {
      const factor = company.wishFactor ?? 0.9;
      return { accepted: true, source: "wishlist", W: lot.value * factor, soft: 1, factor, checks: [], profiles };
    }
    return { accepted: false, source: "none", W: 0, profiles };
  }
  /** Preferred-but-not-required colors lower W by 10% when missed. Prototype assumption. */
  const softMultiplier = (p, lot) => (p.preferColors && p.preferColors.length && !p.preferColors.includes(lot.colorFamily) ? 0.9 : 1);

  /** Closest miss, for "why not" explanations. */
  function closestMiss(a) {
    if (!a.profiles || !a.profiles.length) return null;
    const ranked = a.profiles.slice().sort((x, y) => x.checks.filter((c) => !c.pass).length - y.checks.filter((c) => !c.pass).length);
    return { profile: ranked[0].profile, failed: ranked[0].checks.filter((c) => !c.pass) };
  }

  /* ---- Generic graph core. Works on lot indices, independent of textiles. ---- */
  /** Port of enumerate_cycles: DFS from the smallest index, each cycle listed once. Adds: distinct owners. */
  function enumerateCycles(G, L, limit) {
    const n = G.n, out = [];
    for (let a = 0; a < n; a++) { out.push([]); for (let b = 0; b < n; b++) if (a !== b && G.owner[a] !== G.owner[b] && G.edge(a, b)) out[a].push(b); }
    const cycles = [], path = [], owners = new Set();
    let truncated = false;
    const visit = (s, u) => {
      if (truncated) return;
      for (const v of out[u]) {
        if (v === s) { if (path.length >= 2) cycles.push(path.slice()); }
        else if (v > s && path.length < L && !owners.has(G.owner[v])) {
          path.push(v); owners.add(G.owner[v]);
          visit(s, v);
          path.pop(); owners.delete(G.owner[v]);
        }
        if (cycles.length >= limit) { truncated = true; return; }
      }
    };
    for (let s = 0; s < n && !truncated; s++) {
      path.length = 0; path.push(s); owners.clear(); owners.add(G.owner[s]);
      visit(s, s);
    }
    return { cycles, truncated };
  }

  /** Port of cycle_stats + candidates: member gains, admissibility, expected profit. */
  function evaluate(G, nodes, regime, P) {
    const k = nodes.length;
    const net = [], cc = [], x = [];
    for (let m = 0; m < k; m++) {
      const me = nodes[m], prev = nodes[(m - 1 + k) % k], next = nodes[(m + 1) % k];
      cc[m] = G.C(me, next);
      net[m] = G.W(me, prev) - G.S[me] - cc[m];
      x[m] = G.v[prev] - G.v[me];
    }
    let ok, surplus = 0, net2 = null;
    if (regime === "ntu") { ok = net.every((n) => n >= 0); surplus = net.reduce((a, b) => a + b, 0); }
    else if (regime === "credit_list") {
      net2 = net.map((n, m) => n - Math.max(x[m], 0) + P.credit_discount * Math.max(-x[m], 0));
      ok = net2.every((n) => n >= 0); surplus = net2.reduce((a, b) => a + b, 0);
    } else if (regime === "credit_surplus") { surplus = net.reduce((a, b) => a + b, 0); ok = surplus >= 0; }
    else throw new Error("Unknown regime " + regime);
    const succ = Math.pow(1 - P.p_fail, k);
    const failCost = P.fail_cost_share * cc.reduce((a, b) => a + b, 0);
    return { ok, surplus, net, net2, cc, x, succ, failCost, w: succ * surplus - (1 - succ) * failCost };
  }

  /** Port of clear_cycles: maximum total expected profit over disjoint cycles. */
  function clear(G, list, L, opts) {
    const cands = list.filter((c) => c.nodes.length <= L);
    const res = { L, selected: [], value: 0, optimal: true, upperBound: 0, nCandidates: cands.length, planned: 0, expected: 0 };
    if (!cands.length) return res;
    const sol = KX.solvePacking(G.n, cands, opts || { timeLimitMs: 2000 });
    res.value = sol.value; res.optimal = sol.optimal; res.upperBound = sol.upperBound;
    res.selected = sol.selected.map((i) => cands[i]);
    for (const c of res.selected) { res.planned += c.nodes.length; res.expected += c.nodes.length * Math.pow(1 - (opts && opts.p || 0), c.nodes.length); }
    return res;
  }

  /* ---- Market: from platform state to all matches ---- */
  const isPoolLot = (state, l) => l.status === "active" && byId(state.companies, l.owner) && byId(state.companies, l.owner).participating !== false;
  const byId = (arr, id) => arr.find((x) => x.id === id);

  function buildGraph(state, lots) {
    const owner = lots.map((l) => l.owner);
    const companies = lots.map((l) => byId(state.companies, l.owner));
    const s = state.settings;
    const memo = new Map();
    const ass = (c, l) => {
      const key = c.id + "|" + l.id;
      if (!memo.has(key)) memo.set(key, assess(c, l));
      return memo.get(key);
    };
    return {
      n: lots.length, owner,
      S: lots.map((l) => l.value * l.outsidePct),
      v: lots.map((l) => l.value),
      edge: (a, b) => ass(companies[b], lots[a]).accepted,
      W: (me, prev) => ass(companies[me], lots[prev]).W,
      C: (a, b) => s.cost_scale * (s.c_fixed + (s.c_km * distKm(lots[a].city, companies[b].city) * lotKg(lots[a])) / 50),
      assess: ass, lots, companies,
    };
  }

  /** Canonical id for a cycle: rotated to start at the smallest lot id. */
  function signature(ids) {
    let best = 0;
    ids.forEach((id, i) => { if (id < ids[best]) best = i; });
    return ids.slice(best).concat(ids.slice(0, best)).join(">");
  }

  function describe(G, nodes, ev, state, regime) {
    const k = nodes.length, s = state.settings;
    const members = nodes.map((me, m) => {
      const prev = nodes[(m - 1 + k) % k], next = nodes[(m + 1) % k];
      const lot = G.lots[me], c = G.companies[me], recv = G.lots[prev], to = G.companies[next];
      const a = G.assess(c, recv);
      const gain = regime === "ntu" ? ev.net[m] : regime === "credit_list" ? ev.net2[m] : ev.surplus / k;
      return {
        company: c.id, companyName: c.name, lotId: lot.id, lotName: lot.name,
        toCompany: to.id, toName: to.name, fromCompany: G.companies[prev].id, fromName: G.companies[prev].name,
        recvId: recv.id, recvName: recv.name,
        km: distKm(lot.city, to.city), kg: lotKg(lot), fromCity: lot.city, toCity: to.city,
        W: ev.net[m] + G.S[me] + ev.cc[m], S: G.S[me], C: ev.cc[m], net: ev.net[m], credit: ev.x[m],
        net2: ev.net2 ? ev.net2[m] : null, gain,
        factor: a.factor, soft: a.soft, source: a.source, profileName: a.profile ? a.profile.name : null,
      };
    });
    let reason = null;
    if (!ev.ok) {
      const neg = members.filter((m) => m.gain < 0);
      const costOnly = neg.length > 0 && neg.every((m) => m.W - m.S >= 0);
      reason = regime === "credit_surplus"
        ? "The group as a whole would lose value."
        : costOnly ? `Shipping cost removes the gain for ${neg.map((m) => m.companyName).join(", ")}.`
        : `${neg.map((m) => m.companyName).join(", ")} would receive less than it gives up.`;
    } else if (ev.w <= 0) reason = "The risk of a company pulling out outweighs the gain.";
    void s;
    const eligible = ev.ok && ev.w > 0;
    const belowMin = members.map((m, i) => ({ company: m.company, name: m.companyName, gain: m.gain, minimum: G.companies[nodes[i]].hurdle || 0 })).filter((b) => b.gain < b.minimum);
    return {
      sig: signature(nodes.map((i) => G.lots[i].id)), nodes, k, lots: nodes.map((i) => G.lots[i].id),
      companies: nodes.map((i) => G.companies[i].id), regime, members,
      ok: ev.ok, w: ev.w, surplus: ev.surplus, succ: ev.succ, failCost: ev.failCost,
      logistics: ev.cc.reduce((a, b) => a + b, 0), reason, eligible, belowMin, ready: eligible && belowMin.length === 0,
    };
  }

  /** Full recalculation. Called whenever inventory, preferences, decisions or rules change. */
  function computeMarket(state, opts = {}) {
    const s = state.settings;
    const timeLimitMs = opts.timeLimitMs || 2000;
    const lots = state.lots.filter((l) => isPoolLot(state, l));
    const G = buildGraph(state, lots);
    const { cycles, truncated } = enumerateCycles(G, 4, opts.limit || 200000);
    const items = cycles.map((nodes) => {
      const it = describe(G, nodes, evaluate(G, nodes, s.regime, s), state, s.regime);
      it.declined = !!state.declined[it.sig];
      return it;
    });
    const bySig = new Map(items.map((i) => [i.sig, i]));
    // Recommendations use cycles every participant is ready for (gain clears its stated minimum).
    // The wider "feasible" set stays visible, and its best set is computed for comparison.
    const pool = items.filter((i) => i.ready && !i.declined);
    const feasible = items.filter((i) => i.eligible && !i.declined);
    const packs = {};
    for (const L of [2, 3, 4]) packs[L] = clear(G, pool, L, { timeLimitMs, p: s.p_fail });
    const recommended = packs[s.L];
    const theory = feasible.length === pool.length ? recommended : clear(G, feasible, s.L, { timeLimitMs, p: s.p_fail });
    const recSet = new Set(recommended.selected.map((c) => c.sig));
    const lotInRec = new Map();
    for (const c of recommended.selected) for (const id of c.lots) lotInRec.set(id, c);
    for (const i of items) {
      i.recommended = recSet.has(i.sig);
      i.sharesWith = i.recommended ? [] : i.lots.filter((id) => lotInRec.has(id)).map((id) => ({ lotId: id, sig: lotInRec.get(id).sig }));
    }
    const M = { lots, G, items, bySig, pool, feasible, packs, recommended, theory, truncated, cycleCount: cycles.length, lotInRec };
    M.status = solverStatus(recommended, truncated, cycles.length);
    M.audit = auditPacking(state, M);
    return M;
  }

  /** Honest description of the search behind a recommendation. Only "optimal" may claim to be best. */
  function solverStatus(pack, truncated, cycleCount) {
    if (truncated) return { code: "truncated", proven: false, label: "Search cut short", detail: `The search stopped after listing ${cycleCount.toLocaleString("en-US")} possible loops, so better exchanges may exist. This set is the best among those listed.` };
    if (!pack.optimal) {
      const gap = pack.value > 0 ? Math.round(((pack.upperBound - pack.value) / pack.value) * 100) : null;
      return { code: "time_limited", proven: false, label: "Best found in the time limit", detail: `The calculation hit its time limit before proving this is the best set.${gap !== null ? ` The best possible set could be up to ${gap}% better.` : ""}` };
    }
    return { code: "optimal", proven: true, label: "Proven best set", detail: "Every possible loop was checked, and no other combination has a higher total expected gain under the stated assumptions." };
  }

  /** Marketplace filter, kept pure so it can be tested without the page. */
  function marketplaceRows(state, cid, f) {
    const company = byId(state.companies, cid);
    const num = (x) => (x === "" || x == null ? null : Number(x));
    const q = String(f.q || "").trim().toLowerCase();
    return state.lots.filter((l) => l.owner !== cid && l.status === "active").map((l) => ({ l, a: assess(company, l) })).filter(({ l, a }) => {
      if (q && !`${l.name} ${l.category} ${byId(state.companies, l.owner).name} ${l.color} ${l.city} ${compositionText(l.composition)}`.toLowerCase().includes(q)) return false;
      if (f.cat !== "all" && l.category !== f.cat) return false;
      if (f.fiber !== "all" && !l.composition[f.fiber]) return false;
      if (f.city !== "all" && l.city !== f.city) return false;
      if (f.color !== "all" && l.colorFamily !== f.color) return false;
      if (num(f.gsmMin) != null && l.gsm < num(f.gsmMin)) return false;
      if (num(f.gsmMax) != null && l.gsm > num(f.gsmMax)) return false;
      if (num(f.qtyMin) != null && l.qty < num(f.qtyMin)) return false;
      if (f.fit === "fit" && !a.accepted) return false;
      return true;
    }).sort((x, y) => y.a.accepted - x.a.accepted);
  }

  /** Upgrades data saved by an earlier version and keeps the visitor's edits. */
  function migrateState(s) {
    if (!s || !Array.isArray(s.lots) || !Array.isArray(s.companies)) return null;
    if (s.v === 1) {
      for (const [id, oldV, newV] of [["namsan", 100000, 300000], ["gyeongbu", 150000, 1200000]]) {
        const c = byId(s.companies, id);
        if (c && c.hurdle === oldV) c.hurdle = newV;
      }
      s.welcomed = true;
      s.touched = true;
      s.v = 2;
    }
    if (s.v === 2) {
      // Saved work is never replaced. The larger sample is offered, and added only on request.
      s.sampleAvailable = true;
      s.v = 3;
    }
    return s.v === 3 ? s : null;
  }

  /**
   * Adds sample lots and sourcing needs the saved data lacks. Adds only: existing lots,
   * edited values and preferences stay as they are, and lots from the earlier sample that
   * the visitor removed do not come back. Safe to run more than once.
   */
  function mergeSample(s, fresh) {
    const added = { lots: 0, needs: 0 };
    const known = new Set(s.lots.map((l) => l.id));
    for (const l of fresh.lots) {
      if (Number(l.id.slice(1)) > 20 && l.id[0] === "L" && !known.has(l.id)) { s.lots.push(JSON.parse(JSON.stringify(l))); added.lots++; }
    }
    for (const fc of fresh.companies) {
      const c = byId(s.companies, fc.id);
      if (!c) continue;
      c.profiles = c.profiles || [];
      for (const p of fc.profiles) {
        if (p.added3 && !c.profiles.some((x) => x.id === p.id)) { c.profiles.push(JSON.parse(JSON.stringify(p))); added.needs++; }
      }
    }
    s.sampleAvailable = false;
    s.sampleDismissed = false;
    return added;
  }

  /* ---- Company-level views ---- */
  function companyView(state, M, cid) {
    const mine = M.items.filter((i) => i.companies.includes(cid));
    const eligible = mine.filter((i) => i.eligible && !i.declined && i.k <= state.settings.L);
    const ready = eligible.filter((i) => i.ready);
    const belowMin = eligible.filter((i) => !i.ready);
    const blocked = mine.filter((i) => !i.eligible && !i.declined && i.k <= state.settings.L);
    const inPack = (L) => M.packs[L].selected.filter((c) => c.companies.includes(cid));
    const myLots = M.lots.filter((l) => l.owner === cid);
    const routes = (lotId) => ready.filter((i) => i.lots.includes(lotId));
    const workable = (lotId) => eligible.filter((i) => i.lots.includes(lotId));
    const committed = myLots.map((l) => ({ lot: l, exchange: M.lotInRec.get(l.id) || null }));
    const onlyMultiWay = myLots.filter((l) => {
      const r = routes(l.id);
      return r.length > 0 && !r.some((i) => i.k === 2);
    });
    return { mine, eligible, ready, belowMin, blocked, inPack, myLots, routes, workable, onlyMultiWay, committed };
  }
  const gainOf = (item, cid) => { const m = item.members.find((x) => x.company === cid); return m ? m.gain : 0; };

  /** For each hop in a cycle: could this pair simply swap directly, and if not, why? */
  function directSwapAnalysis(state, item) {
    const out = [];
    for (let m = 0; m < item.members.length; m++) {
      const a = item.members[m];
      const toLots = state.lots.find((l) => l.id === a.lotId);
      const buyer = byId(state.companies, a.toCompany), seller = byId(state.companies, a.company);
      const next = item.members.find((x) => x.company === a.toCompany);
      const back = state.lots.find((l) => l.id === next.lotId);
      if (!toLots || !back) continue;
      const res = assess(seller, back), miss = closestMiss(res);
      out.push({
        from: seller.name, to: buyer.name, lotName: toLots.name, backName: back.name, accepted: res.accepted,
        why: res.accepted ? null : miss && miss.failed.length ? miss.failed.map((f) => `${f.label}: ${f.detail}`).join("; ") : `${seller.name} has no preference that covers this lot`,
      });
    }
    return out;
  }

  /* ---- Independent audit: re-derived from raw lots, not from solver output ---- */
  function auditPacking(state, M) {
    const seenLot = new Set(), violations = [];
    let checked = 0;
    for (const c of M.recommended.selected) {
      checked++;
      const owners = new Set(), k = c.lots.length;
      if (k < 2 || k > state.settings.L) violations.push(`${c.sig}: length ${k}`);
      let sum = 0, sumC = 0;
      const nets = [];
      for (let m = 0; m < k; m++) {
        const lot = state.lots.find((l) => l.id === c.lots[m]), prev = state.lots.find((l) => l.id === c.lots[(m - 1 + k) % k]), next = state.lots.find((l) => l.id === c.lots[(m + 1) % k]);
        if (seenLot.has(lot.id)) violations.push(`${c.sig}: lot ${lot.id} selected twice`);
        seenLot.add(lot.id);
        if (owners.has(lot.owner)) violations.push(`${c.sig}: company ${lot.owner} appears twice`);
        owners.add(lot.owner);
        if (lot.status !== "active") violations.push(`${c.sig}: lot ${lot.id} is not available`);
        const me = byId(state.companies, lot.owner), to = byId(state.companies, next.owner);
        const a = assess(me, prev);
        if (!a.accepted) violations.push(`${c.sig}: ${me.id} does not accept ${prev.id}`);
        const s = state.settings;
        const cost = s.cost_scale * (s.c_fixed + (s.c_km * distKm(lot.city, to.city) * lotKg(lot)) / 50);
        const net = a.W - lot.value * lot.outsidePct - cost;
        const gap = prev.value - lot.value;
        nets.push(s.regime === "credit_list" ? net - Math.max(gap, 0) + s.credit_discount * Math.max(-gap, 0) : net);
        sumC += cost;
      }
      sum = nets.reduce((a, b) => a + b, 0);
      if (state.settings.regime !== "credit_surplus" && nets.some((n) => n < -1e-6)) violations.push(`${c.sig}: a participant does not gain`);
      for (let m = 0; m < k; m++) {
        const owner = byId(state.companies, state.lots.find((l) => l.id === c.lots[m]).owner);
        const g = state.settings.regime === "credit_surplus" ? sum / k : nets[m];
        if (g < (owner.hurdle || 0) - 1e-6) violations.push(`${c.sig}: ${owner.id} is below its stated minimum`);
      }
      if (state.settings.regime === "credit_surplus" && sum < -1e-6) violations.push(`${c.sig}: group does not gain`);
      const succ = Math.pow(1 - state.settings.p_fail, k);
      const w = succ * sum - (1 - succ) * state.settings.fail_cost_share * sumC;
      if (Math.abs(w - c.w) > 1e-6) violations.push(`${c.sig}: expected profit mismatch`);
      if (w <= 0) violations.push(`${c.sig}: expected profit not positive`);
    }
    return { pass: violations.length === 0, violations, checked };
  }

  /* ---- State transitions (simulated workflow) ---- */
  function log(state, type, text, sig, companies) {
    state.activity.unshift({ id: "a" + (state.seq = (state.seq || 0) + 1), at: state.clock ? state.clock() : Date.now(), type, text, sig: sig || null, companies: companies || [] });
  }
  const liveStatuses = ["proposed", "confirmed", "swatch", "pickup", "delivered"];
  const STAGE = { confirmed: "swatch", swatch: "pickup", pickup: "delivered", delivered: "completed" };
  const STAGE_LABEL = {
    proposed: "Awaiting approvals", confirmed: "All approved", swatch: "Swatch check", pickup: "Pickup planned", delivered: "Delivered",
    completed: "Completed", declined: "Declined", superseded: "Superseded", invalidated: "No longer valid", failed: "Participant dropped out",
  };
  const findExchange = (state, sig) => state.exchanges.find((e) => e.sig === sig && liveStatuses.includes(e.status));

  function propose(state, item) {
    const live = findExchange(state, item.sig);
    if (live) return live;
    const approvals = {};
    item.companies.forEach((c) => (approvals[c] = null));
    const ex = {
      sig: item.sig, id: "x" + (state.seq = (state.seq || 0) + 1), status: "proposed", regime: item.regime, approvals, k: item.k,
      companies: item.companies.slice(), lots: item.lots.slice(), snapshot: JSON.parse(JSON.stringify(item)), reasons: {},
      createdAt: state.clock ? state.clock() : Date.now(),
    };
    state.exchanges.unshift(ex);
    log(state, "proposed", `${item.k}-way exchange opened for approval`, item.sig, item.companies);
    return ex;
  }
  /** Returns an error string, or null on success. */
  function respond(state, sig, cid, decision, reason) {
    const ex = findExchange(state, sig);
    if (!ex || ex.status !== "proposed") return "This exchange is not awaiting approval.";
    if (!(cid in ex.approvals)) return "This company is not part of the exchange.";
    const name = byId(state.companies, cid).name;
    if (decision === "declined") {
      ex.approvals[cid] = "declined"; ex.status = "declined"; ex.reasons[cid] = reason || null;
      state.declined[sig] = { by: cid, reason: reason || null };

<script>

}
let state = loadState() || Seed.fresh();

const ui = {

/* ---- Formatting ---- */
const won = (x) => {

const monogram = (c, small) => brandMark(c, small ? 24 : 34);

/* ---- Generated textile swatches (no external image files) ---- */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));

const swatchCache = new Map();
function weaveSvg(category, hex) {

  const line = (x1, y1, x2, y2, c, w, o) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" opacity="${o ?? 1}"/>`;

    for (let i = 0; i < 24; i++) s += line(i * 4 + 2, 0, i * 4 + 2 + (r[(i + 5) % 12] % 3) - 1, 96, i % 4 ? hi2 : lo, 0.9 + (r[(i + 3) % 12] % 2) * 0.7, 0.55);

}
const lotHex = (l) => Engine.COLORS[l.colorFamily] || "#999999";
const swatchUri = (l) => (l.photos && l.photos[0]) || weaveSvg(l.category, lotHex(l));
function swatchStyle(l) {

const swatchFor = (id, name) => { const l = lotOf(id); return l ? swatchStyle(l) : "background:#d9d5ca"; void name; };

/* ---- Exchange graph: who sends what to whom ---- */
function wrapLabel(text, max) {
  const words = String(text).split(" "), lines = [""];

    if ((lines[lines.length - 1] + " " + w).trim().length > max && lines.length < 2) lines.push(w);

  }

}
function exchangeGraph(item, W, o = {}) {
  const k = item.members.length;
  const compact = !!o.compact || W < 470;
  const H = o.height || (compact ? Math.max(220, W * 0.78) : k === 2 ? 300 : 430);
  const cx = W / 2, cy = H / 2 + (k === 3 ? 14 : 0);

    const a = k === 2 ? (i === 0 ? Math.PI : 0) : (2 * Math.PI * i) / k - Math.PI / 2;
    return { m, x: cx + rx * Math.cos(a), y: cy + (k === 2 ? 0 : ry * Math.sin(a)) };

  nodes.forEach((n, i) => {
    const t = nodes[(i + 1) % k];

    if (!compact) {

      const centered = k === 2 || Math.abs(ux) < 40;
      const tx = centered ? px : px + (right ? chipR + 8 : -(chipR + 8));
      const below = uy > 0;
      const ty = centered ? (below ? py + chipR + 15 : py - chipR - 22) : py - 2;
      const anchor = centered ? "middle" : right ? "start" : "end";

      });

function hydrateGraphs() {
  $$("[data-graph]").forEach((el) => {

      compact: el.dataset.size === "compact", height: el.dataset.h ? +el.dataset.h : undefined,

/** Open exchange snapshot if there is one, otherwise the live calculation. */
function itemFor(sig) {

  return M.bySig.get(sig) || null;
}

/* ---- Photos: resized in the browser and stored with the demo data ---- */
function readPhoto(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Could not read file"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Not a readable image"));
      img.onload = () => {
        const max = 560, r = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL("image/jpeg", 0.72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---- Fictional brand marks: drawn from each company's id, no real logos ---- */
const BRANDS = {
  namsan: ["circle", "arch"], palgong: ["square", "rib"], mudeung: ["circle", "wave"], yeonhui: ["square", "chevron"], daecheong: ["squircle", "grid"],
  hangang: ["square", "bars"], gyeongbu: ["squircle", "hex"], dongrae: ["circle", "twill"], seomjin: ["squircle", "slub"], haeundae: ["circle", "sun"],

let markSeq = 0;
function brandMotif(kind) {
  const line = (a, b, c, d, w = 1.4) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#fff" stroke-width="${w}" opacity=".3"/>`;
  const out = [];
  if (kind === "arch") for (const r of [14, 20, 26]) out.push(`<path d="M${20 - r} 42A${r} ${r} 0 0 1 ${20 + r} 42" fill="none" stroke="#fff" stroke-width="1.5" opacity=".3"/>`);

  if (kind === "chevron") for (const y of [-2, 8, 26, 36]) out.push(`<path d="M-2 ${y + 8}L20 ${y}L42 ${y + 8}" fill="none" stroke="#fff" stroke-width="1.6" opacity=".3"/>`);
  if (kind === "grid") { for (let i = 5; i < 40; i += 10) { out.push(line(i, 0, i, 40, 1.1)); out.push(line(0, i, 40, i, 1.1)); } }

  if (kind === "twill") for (let i = -40; i < 40; i += 6) out.push(line(i, 40, i + 40, 0, 1.3));

  const shape = o.shape || shape0, id = "bm" + ++markSeq;
  const clip = shape === "circle" ? `<circle cx="20" cy="20" r="20"/>` : `<rect width="40" height="40" rx="${shape === "square" ? 7 : 13}"/>`;
  const body = `<clipPath id="${id}">${clip}</clipPath><g clip-path="url(#${id})"><rect width="40" height="40" fill="${c.hue || "#555"}"/>${brandMotif(motif)}</g><text x="20" y="26.5" text-anchor="middle" font-family="var(--serif)" font-size="17" font-weight="500" fill="#fff">${esc(initials(c.name))}</text>`;
  if (o.at) return `<svg x="${o.at[0]}" y="${o.at[1]}" width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true">${body}</svg>`;

<script>
/* ===========================================================================
 * Exchange network: the interactive circular view on Exchange Matches.
 * Companies sit on a ring. Each exchange is a colored loop through them.
 * Selecting a loop shows, hop by hop, who sends which fabric to whom.
 * ======================================================================== */
const LOOP_COLORS = ["#1f4d3a", "#b0603a", "#3a4c7a", "#7a2e3a", "#8a7a2b", "#2f7f7a", "#6b4a8a", "#55564f"];

const prefersStill = () => matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/** A color belongs to the exchange, not its position in a filtered list. */

const NET_DRAW_LIMIT = 14;
function netDrawn(opts, sel) {

  return d;
}
function netOptions() {
  const c = state.current, L = state.settings.L;
  if (netState.mode === "mine") return Engine.companyView(state, M, c).eligible.slice().sort((a, b) => (b.ready - a.ready) || (b.recommended - a.recommended) || Engine.gainOf(b, c) - Engine.gainOf(a, c));
  if (netState.mode === "all") return M.feasible.filter((i) => i.k <= L).slice().sort((a, b) => (b.recommended - a.recommended) || (b.ready - a.ready) || b.w - a.w);
  return M.recommended.selected.slice().sort((a, b) => (b.companies.includes(c) - a.companies.includes(c)) || b.w - a.w);
}
function netSelected(opts) {
  let it = opts.find((i) => i.sig === netState.sel);
  if (!it) {
    it = opts.find((i) => i.companies.includes(state.current)) || opts[0] || null;
    netState.sel = it ? it.sig : null;
    netState.step = null;

}
function stopNetPlay() {
  if (netState.timer) { clearInterval(netState.timer); netState.timer = null; }
  const b = $("#net-play");
  if (b) b.textContent = "Play";
}
function netSvg(opts, sel, W) {
  const companies = state.companies;
  const n = companies.length, showNames = W >= 520;
  const H = Math.max(330, Math.min(W * 0.78, 500));
  const cx = W / 2, cy = H / 2, R = Math.min(W * (showNames ? 0.33 : 0.4), H * 0.39);
  // The selected exchange is spread evenly around the ring, so its loop reads as a clear circle.
  const slots = new Array(n).fill(null);
  if (sel) sel.companies.forEach((id, i) => { slots[Math.round((i * n) / sel.k) % n] = id; });
  const rest = companies.map((c) => c.id).filter((id) => !slots.includes(id));
  for (let i = 0; i < n; i++) if (slots[i] === null) slots[i] = rest.shift();
  const pos = {};
  slots.forEach((id, i) => {
    const a = (2 * Math.PI * i) / n - Math.PI / 2;
    pos[id] = { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a };
  });
  const nodeR = showNames ? 17 : 14;
  let back = "", front = "", chips = "", defs = "";
  const uid = "n" + Math.random().toString(36).slice(2, 7);
  const edgePath = (from, to, bendScale, side) => {
    const p = pos[from], q = pos[to];
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const len = Math.hypot(q.x - p.x, q.y - p.y) || 1;
    // A direct swap bows out sideways, so its two arrows and fabric chips never sit on top of each other.
    const qx = side ? mx + ((q.y - p.y) / len) * side : mx + (cx - mx) * bendScale;
    const qy = side ? my - ((q.x - p.x) / len) * side : my + (cy - my) * bendScale;
    const a1 = Math.atan2(qy - p.y, qx - p.x), a2 = Math.atan2(q.y - qy, q.x - qx);

  };

    const isSel = sel && it.sig === sel.sig, color = loopColor(it.sig);
    const bend = 0.32 + (oi % 4) * 0.09;
    if (isSel) defs += `<marker id="${uid}m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 .6L7.4 4L0 7.4Z" fill="${color}"/></marker>`;
    it.members.forEach((m, hop) => {
      const e = isSel && it.k === 2 ? edgePath(m.company, m.toCompany, 0, R * 0.62) : edgePath(m.company, m.toCompany, isSel ? 0.16 : bend);
      if (!isSel) {
        back += `<path d="${e.d}" fill="none" stroke="${color}" stroke-width="1.4" opacity=".16" style="cursor:pointer" data-act="net-select" data-sig="${esc(it.sig)}"><title>${esc(m.companyName)} sends ${esc(m.lotName)} to ${esc(m.toName)}</title></path>`;
        return;

      front += `<path class="net-hop" data-hop="${hop}" id="${uid}p${hop}" d="${e.d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" marker-end="url(#${uid}m)"><title>${esc(m.companyName)} sends ${esc(m.lotName)} to ${esc(m.toName)}</title></path>`;
      if (!prefersStill()) front += `<circle r="4" fill="${color}" stroke="var(--panel)" stroke-width="1.5" pointer-events="none"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#${uid}p${hop}"/></animateMotion></circle>`;
      const l = lotOf(m.lotId), r = showNames ? 19 : 15;
      chips += `<g class="net-chip" data-hop="${hop}" data-act="net-step" data-i="${hop}" style="cursor:pointer"><title>${esc(m.lotName)}: from ${esc(m.companyName)} to ${esc(m.toName)}</title><clipPath id="${uid}c${hop}"><circle cx="${e.mid.x}" cy="${e.mid.y}" r="${r}"/></clipPath><circle cx="${e.mid.x}" cy="${e.mid.y}" r="${r + 3}" fill="var(--panel)" stroke="${color}" stroke-width="2"/><rect x="${e.mid.x - r}" y="${e.mid.y - r}" width="${2 * r}" height="${2 * r}" fill="${l ? lotHex(l) : "#aaa"}" clip-path="url(#${uid}c${hop})"/>${l ? `<image href="${swatchUri(l)}" x="${e.mid.x - r}" y="${e.mid.y - r}" width="${2 * r}" height="${2 * r}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${uid}c${hop})"/>` : ""}</g>`;
      if (showNames) {
        const dx = e.mid.x - cx, dy = e.mid.y - cy, side = Math.abs(dx) >= 34;
        const tx = side ? e.mid.x + (dx > 0 ? r + 8 : -(r + 8)) : e.mid.x;
        const ty = side ? e.mid.y - 2 : e.mid.y + (dy > 0 ? r + 16 : -(r + 22));
        wrapLabel(m.lotName, 20).forEach((ln, li) => {
          chips += `<text class="net-chip" data-hop="${hop}" x="${tx}" y="${ty + li * 13}" text-anchor="${side ? (dx > 0 ? "start" : "end") : "middle"}" font-size="11" font-weight="620" fill="var(--ink)" paint-order="stroke" stroke="var(--panel)" stroke-width="3" pointer-events="none">${esc(ln)}</text>`;
        });
      }
    });
  });
  let nodes = "";
  companies.forEach((c) => {
    const p = pos[c.id], inSel = sel && sel.companies.includes(c.id), isMe = c.id === state.current;
    const inAny = opts.some((o) => o.companies.includes(c.id));
    const dim = sel ? !inSel : !inAny;
    const ax = Math.cos(p.a), ay = Math.sin(p.a);
    const label = showNames ? wrapLabel(c.name, 15).map((ln, li, arr) => {
      const off = nodeR + 8;
      const anchor = Math.abs(ax) < 0.25 ? "middle" : ax > 0 ? "start" : "end";
      const baseY = Math.abs(ax) < 0.25 ? (ay < 0 ? p.y - off - (arr.length - 1 - li) * 13 : p.y + off + 9 + li * 13) : p.y + 4 + (li - (arr.length - 1) / 2) * 13;
      const baseX = Math.abs(ax) < 0.25 ? p.x : p.x + ax * off;
      return `<text x="${baseX}" y="${baseY}" text-anchor="${anchor}" font-size="11.5" font-weight="${inSel || isMe ? 620 : 450}" fill="${inSel ? "var(--ink)" : "var(--ink-2)"}">${esc(ln)}</text>`;
    }).join("") : "";
    nodes += `<g data-act="net-node" data-co="${c.id}" id="net-node-${c.id}" role="button" tabindex="0" aria-label="${esc(c.name)}: show its exchanges" style="cursor:pointer" opacity="${dim ? 0.38 : 1}"><title>${esc(c.name)}: ${esc(c.kind)}, ${esc(c.city)}</title>
      <circle cx="${p.x}" cy="${p.y}" r="${nodeR + 6}" fill="transparent"/>
      <circle cx="${p.x}" cy="${p.y}" r="${nodeR}" fill="${c.hue}" stroke="${isMe ? "var(--clay)" : "var(--panel)"}" stroke-width="${isMe ? 3 : 2}"/>
      ${brandMark(c, nodeR * 2, { shape: "circle", at: [p.x - nodeR, p.y - nodeR] })}<circle cx="${p.x}" cy="${p.y}" r="${nodeR}" fill="none" stroke="${isMe ? "var(--clay)" : "var(--panel)"}" stroke-width="${isMe ? 3 : 2}"/>${label}</g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Exchange network: companies on a ring, with each exchange drawn as a loop"><defs>${defs}</defs><g>${back}</g><g>${front}</g><g>${chips}</g><g>${nodes}</g></svg>`;
}
function exchangeStateLabel(it) {
  if (it.recommended) return M.status.proven ? `<span class="pill ok">Recommended</span>` : `<span class="pill warn">Suggested, not proven best</span>`;
  if (it.ready) return `<span class="pill">Alternative</span>`;

}
function renderNetwork() {

      <div class="seg" role="group" aria-label="Which exchanges to show">${modes.map(([k, l]) => `<button id="net-mode-${k}" data-act="net-mode" data-v="${k}" aria-pressed="${netState.mode === k}">${esc(l)}</button>`).join("")}</div></div>
    <div class="net-layout">
      <div class="net-canvas" id="net-canvas"></div>
      <div class="net-panel">
      ${sel ? `
        <div class="row"><b style="font-size:15px">${sel.k === 2 ? "Direct swap" : `${sel.k}-way exchange`}</b>${exchangeStateLabel(sel)}</div>
        ${sel.k > 2 && direct.every((d) => !d.accepted) ? `<p class="small muted" style="margin-top:4px">None of these companies could swap directly. The loop is what makes it work.</p>` : ""}
        <ol class="net-steps" aria-label="Who sends what to whom">${sel.members.map((m, i) => {
          const l = lotOf(m.lotId);
          return `<li><button class="net-step ${m.company === me0 ? "mine" : ""}" id="net-step-${i}" data-act="net-step" data-i="${i}" data-hop="${i}" aria-pressed="${netState.step === i}"><span class="sw" style="${l ? swatchStyle(l) : ""}"></span><span class="net-step-text"><b>${esc(m.companyName)}</b> sends <b>${esc(m.lotName)}</b> to <b>${esc(m.toName)}</b></span></button></li>`;
        }).join("")}</ol>
        <div class="row" style="margin-top:8px"><button class="btn sm" id="net-play" data-act="net-play">Play</button><button class="btn sm primary" id="net-open" data-act="open-ex" data-sig="${esc(sel.sig)}">Open details</button></div>
        ${sel.companies.includes(me0) ? `<div class="between small" style="margin-top:10px"><span class="muted">${esc(me().name)}'s estimated gain</span><b class="num">${signed(Engine.gainOf(sel, me0))}</b></div>` : `<div class="between small" style="margin-top:10px"><span class="muted">Total estimated gain</span><b class="num">${signed(sel.surplus)}</b></div>`}
      ` : `<div class="empty" style="padding:18px"><h3>No loops to show</h3><p class="small">Nothing qualifies at these settings. Try a larger exchange size or another view.</p></div>`}
      ${opts.length > 1 ? `<h4 style="margin-top:14px">Exchanges (${opts.length})</h4>${opts.length > NET_DRAW_LIMIT ? `<p class="small faint">The ring shows ${NET_DRAW_LIMIT} loops so it stays readable. Every option is listed here.</p>` : ""}<div class="net-opts">${opts.map((o, i) => `<button class="net-opt" id="net-opt-${i}" data-act="net-select" data-sig="${esc(o.sig)}" aria-pressed="${sel && o.sig === sel.sig}"><i style="background:${loopColor(o.sig)}"></i><span>${o.k}-way: ${esc(o.companies.map((id) => initials(coOf(id).name)).join(" → "))}</span></button>`).join("")}</div>` : ""}

<script>
/* ===========================================================================
 * Pages. Each returns HTML; interactions run through ACT (see ui-app.js).

 * ======================================================================== */
const statusPill = (s) => {

const recPill = () => (M.status.proven ? `<span class="pill ok">Recommended</span>` : `<span class="pill warn">Suggested, not proven best</span>`);

  const stat = l.status === "active" ? "" : `<span class="pill ${l.status === "reserved" ? "warn" : l.status === "exchanged" ? "ok" : ""}">${{ paused: "Paused", reserved: "Reserved in demo", exchanged: "Exchanged (simulated)" }[l.status] || l.status}</span>`;

    <div class="lot-body">

}
function exchangeCard(item, cid, o = {}) {
  const ex = Engine.findExchange(state, item.sig);

  const hops = item.members.map((m) => {
    const l = lotOf(m.lotId);
    return `<span class="hop"><span class="sw" style="${l ? swatchStyle(l) : ""}"></span><span><b style="font-weight:600">${esc(m.lotName)}</b><br><span class="faint">${esc(m.companyName)}</span></span></span>`;
