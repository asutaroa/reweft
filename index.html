    <div class="ex-side">
      ${mine ? `<span class="small muted">Your estimated gain</span><span class="gain ${mine.gain < 0 ? "neg" : ""}">${signed(mine.gain)}</span>` : `<span class="small muted">Total estimated gain</span><span class="gain">${signed(item.surplus)}</span>`}
      <span class="small faint">Shipping ${won(item.logistics)}</span>
      <span class="small faint">${Math.round(item.succ * 100)}% chance everyone follows through</span>
    </div>
  </button>`;
}

/* ---- 1. Dashboard ---- */
function pageDashboard() {
  const c = me(), v = Engine.companyView(state, M, c.id);
  const allMine = state.lots.filter((l) => l.owner === c.id);
  const active = allMine.filter((l) => l.status === "active");
  const rank = (a, b) => (b.ready - a.ready) || (b.recommended - a.recommended) || (Engine.gainOf(b, c.id) - Engine.gainOf(a, c.id));
  const guided = ui.tour != null ? v.ready.find((i) => i.sig === "L01>L03>L05") : null;
  const best = guided || v.ready.slice().sort(rank)[0];
  const openApprovals = state.exchanges.filter((e) => e.status === "proposed" && e.companies.includes(c.id) && !e.approvals[c.id]);
  const liveEx = state.exchanges.filter((e) => ["confirmed", "swatch", "pickup", "delivered"].includes(e.status) && e.companies.includes(c.id));
  const acts = state.activity.filter((a) => a.companies.includes(c.id)).slice(0, 5);
  const top = v.eligible.slice().sort(rank).slice(0, 3);
  const bm = best ? best.members.find((m) => m.company === c.id) : null;
  return `
  <div class="page-head"><div><h1>Your surplus, at a glance</h1><p>${c.participating === false ? "You've paused participation, so your lots aren't being matched." : `Here is what ${esc(c.name)}'s fabric could become.`}</p></div>
    <div class="row"><button class="btn" id="dash-add" data-act="new-lot">Add a lot</button><button class="btn primary" data-go="matches">View matches</button></div></div>
  <div class="stack">
    ${best ? `<section class="hero" data-tour="hero">
      <div><span class="pill">${best.k === 2 ? "Direct swap available" : `${best.k}-way exchange`}</span>
        <h2>${esc(bm.lotName)} could become ${esc(bm.recvName)}</h2>
        <p>${best.k > 2 ? `No direct partner is needed: ${best.k} companies each send one lot and receive one they asked for.` : "You and one other company each want what the other holds."} Your estimated gain: <b style="color:#fff;white-space:nowrap">${signed(Engine.gainOf(best, c.id))}</b>.</p>
        <div class="row" style="margin-top:14px"><button class="btn" data-act="open-ex" data-sig="${esc(best.sig)}">See who sends what</button></div></div>
      <div class="graph" data-graph="${esc(best.sig)}" data-tone="dark" data-size="compact" data-h="230"></div>
    </section>` : `<section class="card" data-tour="hero"><h2>No exchange ready yet</h2><p class="muted" style="margin-top:6px">${v.belowMin.length ? `${plural(v.belowMin.length, "option")} would work on paper but falls below someone's minimum gain. See Exchange Matches.` : `Nothing currently matches on both fabric and economics for ${esc(c.name)}.`} Widen what you'd accept, or add a lot another company has asked for.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-go="preferences">Review preferences</button><button class="btn" data-go="marketplace">Browse marketplace</button></div></section>`}
    <div class="stats">
      <div class="stat"><div class="lab">Lots available to exchange</div><div class="val">${active.length}</div><div class="sub">${allMine.length - active.length} reserved, paused or exchanged</div></div>
      <div class="stat"><div class="lab">Listed value available</div><div class="val">${won(active.reduce((s, l) => s + l.value, 0))}</div><div class="sub">Your own estimate</div></div>
      <div class="stat"><div class="lab">Exchange options ready</div><div class="val">${v.ready.length}</div><div class="sub">${v.ready.filter((i) => i.k > 2).length} multi-way, ${v.belowMin.length} below a minimum</div></div>
      <div class="stat"><div class="lab">Awaiting your approval</div><div class="val">${openApprovals.length}</div><div class="sub">${liveEx.length} exchanges in progress (simulated)</div></div>
    </div>
    <div class="grid-main">
      <section class="stack" style="min-width:0">
        <div class="between"><h2>Potential matches</h2><button class="btn ghost" data-go="matches">All matches →</button></div>
        ${top.length ? top.map((i) => exchangeCard(i, c.id)).join("") : `<div class="empty"><h3>No exchange options for ${esc(c.name)} right now</h3><p class="small">${v.blocked.length ? `${plural(v.blocked.length, "fabric match")} didn't pay for everyone. Exchange Matches shows why.` : "No other company has asked for these lots yet."}</p></div>`}
      </section>
      <aside class="stack" style="min-width:0">
        <div class="card"><div class="between"><h3>Your lots</h3><button class="btn ghost sm" data-go="inventory">Manage</button></div>
          <div style="margin-top:8px">${active.slice(0, 5).map((l) => `<div class="row" style="padding:7px 0;border-top:1px solid var(--line);flex-wrap:nowrap"><span class="sw" style="${swatchStyle(l)};width:36px;height:36px;border-radius:7px;flex:none"></span><div style="min-width:0;flex:1"><div class="small" style="font-weight:600">${esc(l.name)}</div><div>${routePill(v.routes(l.id), v.workable(l.id))}</div></div></div>`).join("") || `<p class="small muted">No lots available.</p>`}</div>
          <p class="small faint" style="margin-top:8px">You can join several exchanges at once. Each lot goes to only one.</p></div>
        <div class="card"><div class="between"><h3>Recent activity</h3><button class="btn ghost sm" data-go="activity">All</button></div>
          <div style="margin-top:6px">${acts.map((a) => `<div style="padding:7px 0;border-top:1px solid var(--line)" class="small"><div>${esc(a.text)}</div><div class="faint">${ago(a.at)} · simulated</div></div>`).join("") || `<p class="small muted">Nothing yet. Open an exchange to start the simulated approval flow.</p>`}</div></div>
      </aside>
    </div>
  </div>`;
}

/* ---- 2. My Inventory ---- */
function pageInventory() {
  const c = me(), v = Engine.companyView(state, M, c.id);
  const all = state.lots.filter((l) => l.owner === c.id);
  const f = ui.invFilter;
  const shown = all.filter((l) => f === "all" || (f === "active" ? l.status === "active" : l.status !== "active"));
  return `
  <div class="page-head"><div><h1>My Inventory</h1><p>Surplus lots ${esc(c.name)} is willing to exchange. Every change updates your matches.</p></div>
    <button class="btn primary" id="inv-add" data-act="new-lot" data-tour="add-lot">Add a lot</button></div>
  <div class="note" style="margin-bottom:14px"><b>One lot, one exchange.</b> Your company can take part in several exchanges at the same time, as long as each uses a different lot.</div>
  <div class="row" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Filter lots">${[["active", "Available"], ["other", "Reserved, paused, exchanged"], ["all", "All"]].map(([k, l]) => `<button id="inv-f-${k}" data-act="inv-filter" data-v="${k}" aria-pressed="${f === k}">${l}</button>`).join("")}</div></div>
  ${shown.length ? `<div class="lot-grid">${shown.map((l) => {
    const locked = Engine.lotLockedBy(state, l.id);
    const placed = M.lotInRec.get(l.id);
    return lotCard(l, {
      tour: l.id,
      extra: l.status === "active" ? `<div>${routePill(v.routes(l.id), v.workable(l.id))}</div>${placed ? `<div class="small faint">Placed in a ${placed.k === 2 ? "direct swap" : placed.k + "-way exchange"}</div>` : ""}` : "",
      actions: l.status === "exchanged" ? "" : `<span class="row" style="gap:3px">
        ${locked ? `<button class="btn ghost sm" data-act="open-ex" data-sig="${esc(locked.sig)}">View exchange</button>` : `<button class="btn ghost sm" id="edit-${l.id}" data-act="edit-lot" data-id="${l.id}">Edit</button>
        <button class="btn ghost sm" id="pause-${l.id}" data-act="toggle-pause" data-id="${l.id}">${l.status === "paused" ? "Resume" : "Pause"}</button>
        <button class="btn ghost sm" id="rm-${l.id}" data-act="remove-lot" data-id="${l.id}" aria-label="Remove ${esc(l.name)}">Remove</button>`}</span>`,
    });
  }).join("")}</div>` : `<div class="empty"><h3>Nothing here</h3><p class="small">Add a lot to see which exchanges it unlocks.</p></div>`}`;
}

function lotForm() {
  const d = ui.drawer, l = d.draft, e = d.errors || {};
  const aria = (name) => (e[name] ? `aria-invalid="true" aria-describedby="err-${name}"` : "");
  const fld = (name, label, input, hint) => `<div class="field ${name === "name" || name === "note" || name === "composition" ? "full" : ""}"><label for="f-${name}">${label}</label>${input}${hint ? `<span class="hint">${hint}</span>` : ""}${e[name] ? `<span class="err" id="err-${name}" role="alert">${esc(e[name])}</span>` : ""}</div>`;
  const txt = (name, val, extra = "") => `<input id="f-${name}" name="${name}" type="text" value="${esc(val ?? "")}" ${aria(name)} ${extra}>`;
  const numb = (name, val, extra = "") => `<input id="f-${name}" name="${name}" type="number" inputmode="decimal" value="${esc(val ?? "")}" ${aria(name)} ${extra}>`;
  const sel = (name, val, opts) => `<select id="f-${name}" name="${name}">${opts.map((o) => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  return `<form id="lot-form" class="form-grid" novalidate>
    ${fld("name", "Textile name", txt("name", l.name, 'placeholder="e.g. Washed Indigo Selvedge Denim"'))}
    ${fld("category", "Material category", sel("category", l.category, Engine.CATEGORIES))}
    ${fld("city", "Location", sel("city", l.city, Object.keys(Engine.CITIES)), "Used to estimate shipping")}
    ${fld("composition", "Composition", txt("composition", l.compositionText, 'placeholder="98% cotton, 2% elastane"'), `Must add up to 100%. Fibers: ${Engine.FIBERS.join(", ")}.`)}
    ${fld("gsm", "Weight (GSM)", numb("gsm", l.gsm, 'min="1"'))}
    ${fld("width", "Width (cm)", numb("width", l.width, 'min="1"'))}
    ${fld("colorFamily", "Color family", sel("colorFamily", l.colorFamily, Object.keys(Engine.COLORS)))}
    ${fld("color", "Color name", txt("color", l.color, 'placeholder="Optional"'))}
    ${fld("qty", "Quantity (m)", numb("qty", l.qty, 'min="1"'), "The whole lot moves together")}
    ${fld("value", "Estimated value (KRW)", numb("value", l.value, 'min="1" step="10000"'), "Your own estimate, not a verified price")}
    ${fld("outsidePct", "Clearance value (%)", numb("outsidePct", Math.round((l.outsidePct ?? 0.5) * 100), 'min="0" max="100"'), "What you'd recover by selling it off another way, as % of estimated value. You give this up by exchanging.")}
    <div class="field"><span class="lab">Certifications (self-declared)</span><div class="row">${Engine.CERTS.map((x) => `<label class="small row" style="gap:4px"><input type="checkbox" name="cert" value="${x}" ${(l.certs || []).includes(x) ? "checked" : ""}>${x}</label>`).join("")}</div></div>
    ${fld("note", "Notes", `<textarea id="f-note" name="note">${esc(l.note || "")}</textarea>`)}
    <div class="field full"><span class="lab">Photos</span><div class="photo-row">${(l.photos || []).map((p, i) => `<div class="photo" style="background-image:url('${p}')"><button type="button" data-act="rm-photo" data-i="${i}" aria-label="Remove photo ${i + 1}">×</button></div>`).join("")}
      ${(l.photos || []).length < 3 ? `<button type="button" class="btn sm" id="pick-photo" data-act="pick-photo" style="height:74px;width:74px;white-space:normal">Add photo</button><input type="file" accept="image/*" id="photo-in" hidden aria-label="Choose a photo">` : ""}</div>
      <span class="hint">Up to 3. Resized and kept in this browser only. Without a photo the card shows a generated swatch.</span>${e.photos ? `<span class="err" role="alert">${esc(e.photos)}</span>` : ""}</div>
    <button type="submit" hidden aria-hidden="true" tabindex="-1"></button>
  </form>`;
}

/* ---- 3. My Preferences ---- */
function chipSet(pid, field, options, selected) {
  return `<div class="chips" role="group">${options.map((o, i) => `<button type="button" class="chip" id="chip-${pid}-${field}-${i}" data-act="pf-chip" data-pid="${pid}" data-field="${field}" data-v="${esc(o)}" aria-pressed="${(selected || []).includes(o)}">${esc(o)}</button>`).join("")}</div>`;
}
function profileFitPill(c, p) {
  const others = state.lots.filter((l) => l.owner !== c.id && l.status === "active");
  const count = others.filter((l) => Engine.checkProfile(c, p, l).pass).length;
  const clash = p.gsmMin != null && p.gsmMax != null && p.gsmMin > p.gsmMax;
  return `<span class="pill ${count ? "ok" : ""}">${plural(count, "lot")} fit today</span>${clash ? `<span class="pill bad">"GSM from" is above "GSM to"</span>` : ""}`;
}
function prefStats() {
  const c = me(), v = Engine.companyView(state, M, c.id);
  const others = state.lots.filter((l) => l.owner !== c.id && l.status === "active");
  const accepted = others.filter((l) => Engine.assess(c, l).accepted);
  return `<div class="stat"><div class="lab">Lots you would accept</div><div class="val">${accepted.length}</div><div class="sub">Of ${others.length} from other companies</div></div>
    <div class="stat"><div class="lab">Exchange options ready</div><div class="val">${v.ready.length}</div><div class="sub">Everyone clears their minimum</div></div>
    <div class="stat"><div class="lab">Below a minimum</div><div class="val">${v.belowMin.length}</div><div class="sub">Works on paper, not yet acceptable</div></div>
    <div class="stat"><div class="lab">Right fabric, wrong economics</div><div class="val">${v.blocked.length}</div><div class="sub">Fabric fits, the numbers don't</div></div>`;
}
function pagePreferences() {
  const c = me();
  const wish = Object.entries(c.overrides || {});
  const pct = (x) => (x == null ? "" : Math.round(x * 100));
  const profile = (p) => {
    const n = (field, label, val, hint, extra = "") => `<div class="field"><label for="pf-${p.id}-${field}">${label}</label><input id="pf-${p.id}-${field}" type="number" inputmode="decimal" data-pf="${field}" data-pid="${p.id}" value="${val ?? ""}" ${extra}>${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
    return `<section class="card">
      <div class="between"><div class="row" style="flex:1;min-width:200px"><input type="text" id="pf-${p.id}-name" data-pf="name" data-pid="${p.id}" value="${esc(p.name)}" aria-label="Name of this sourcing need" style="font-weight:600;max-width:320px"><span id="pf-live-${p.id}" class="row" aria-live="polite">${profileFitPill(c, p)}</span></div>
      <button class="btn ghost sm" id="pf-rm-${p.id}" data-act="pf-remove" data-pid="${p.id}">Remove</button></div>
      <div class="stack" style="gap:12px;margin-top:12px">
        <div class="field"><span class="lab small" style="font-weight:550;color:var(--ink-2)">Acceptable material categories</span>${chipSet(p.id, "categories", Engine.CATEGORIES, p.categories)}<span class="hint">None selected means any category.</span></div>
        <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
          <div class="field"><label for="pf-${p.id}-fiber">Must contain fiber</label><select id="pf-${p.id}-fiber" data-pf="fiber" data-pid="${p.id}"><option value="">Any</option>${Engine.FIBERS.map((f) => `<option ${p.fiberMin && p.fiberMin.fiber === f ? "selected" : ""}>${f}</option>`).join("")}</select></div>
          ${n("fibermin", "At least (%)", p.fiberMin ? p.fiberMin.min : "", "", 'min="0" max="100"')}
          ${n("gsmMin", "GSM from", p.gsmMin)}${n("gsmMax", "GSM to", p.gsmMax)}
          ${n("widthMin", "Minimum width (cm)", p.widthMin)}${n("qtyMin", "Minimum quantity (m)", p.qtyMin)}${n("maxKm", "Maximum distance (km)", p.maxKm)}
          ${n("valueFactor", "What a fit is worth to you (%)", pct(p.valueFactor), "% of the seller's listed value. 100 means you'd value it at the listed estimate.", 'min="10" max="200" step="5"')}
        </div>
        <div class="field"><span class="lab small" style="font-weight:550;color:var(--ink-2)">Exclude fibers</span>${chipSet(p.id, "excludeFibers", Engine.FIBERS, p.excludeFibers)}</div>
        <div class="field"><span class="lab small" style="font-weight:550;color:var(--ink-2)">Required colors</span>${chipSet(p.id, "colors", Object.keys(Engine.COLORS), p.colors)}<span class="hint">None selected means any color.</span></div>
        <details><summary>More options</summary><div class="stack" style="gap:10px">
          <div class="field"><span class="lab small" style="font-weight:550;color:var(--ink-2)">Preferred colors</span>${chipSet(p.id, "preferColors", Object.keys(Engine.COLORS), p.preferColors)}<span class="hint">Not a requirement. Other colors are valued 10% lower.</span></div>
          <div class="field"><span class="lab small" style="font-weight:550;color:var(--ink-2)">Required certifications (self-declared)</span>${chipSet(p.id, "certs", Engine.CERTS, p.certs)}</div>
        </div></details>
      </div></section>`;
  };
  return `
  <div class="page-head"><div><h1>My Preferences</h1><p>Tell other companies what ${esc(c.name)} is looking for. A lot qualifies when it meets everything in at least one sourcing need.</p></div>
    <button class="btn primary" id="pf-add" data-act="pf-add">Add a sourcing need</button></div>
  <div class="stats" id="pf-stats" style="margin-bottom:16px" aria-live="polite">${prefStats()}</div>
  <div class="grid-main">
    <div class="stack" data-tour="profiles" style="min-width:0">${(c.profiles || []).map(profile).join("") || `<div class="empty"><h3>No sourcing needs</h3><p class="small">Without one, you only accept lots on your wishlist.</p></div>`}</div>
    <aside class="stack" style="min-width:0">
      <section class="card"><h3>Participation</h3>
        <label class="row small" style="margin-top:8px;flex-wrap:nowrap"><input type="checkbox" id="co-part" data-act="toggle-part" ${c.participating === false ? "" : "checked"}><span>Include ${esc(c.name)} in matching</span></label>
        <div class="field" style="margin-top:12px"><label for="co-hurdle">Minimum acceptable gain (KRW)</label><input id="co-hurdle" type="number" inputmode="numeric" step="10000" min="0" data-co="hurdle" value="${c.hurdle || 0}"><span class="hint">Exchanges below this stay visible but aren't recommended. A simulated company approves only above it.</span></div>
        <div class="field" style="margin-top:12px"><label for="co-wish">What a wishlist lot is worth to you (%)</label><input id="co-wish" type="number" inputmode="decimal" step="5" min="10" max="200" data-co="wishFactor" value="${pct(c.wishFactor ?? 0.9)}"><span class="hint">% of listed value, for lots you add from the Marketplace.</span></div>
      </section>
      <section class="card"><h3>Manual choices</h3><p class="small muted">Added from the Marketplace. Wishlist items are accepted even if no sourcing need covers them.</p>
        <div style="margin-top:8px">${wish.map(([id, kind]) => { const l = lotOf(id); return l ? `<div class="between small" style="padding:6px 0;border-top:1px solid var(--line)"><span>${esc(l.name)} <span class="pill ${kind === "accept" ? "ok" : "bad"}">${kind === "accept" ? "Wishlist" : "Not for us"}</span></span><button class="btn ghost sm" id="clr-${id}" data-act="clear-override" data-id="${id}">Clear</button></div>` : ""; }).join("") || `<p class="small faint">None yet.</p>`}</div>
      </section>
      <div class="note"><b>These are your own statements.</b> What a fit is worth and your minimum gain are figures you enter. Reweft hasn't verified them against real trades.</div>
    </aside>
  </div>`;
}

/* ---- 4. Marketplace ---- */
function marketResults() {
  const c = me();
  const rows = Engine.marketplaceRows(state, c.id, ui.mp);
  if (!rows.length) return `<div class="empty"><h3>No lots match these filters</h3><button class="btn sm" data-act="mp-clear" style="margin-top:6px">Clear filters</button></div>`;
  return `<div class="lot-grid">${rows.map(({ l, a }) => {
    const miss = !a.accepted ? Engine.closestMiss(a) : null;
    const override = (c.overrides || {})[l.id];
    const rs = M.items.filter((i) => i.ready && !i.declined && i.lots.includes(l.id) && i.companies.includes(c.id));
    const fit = a.accepted ? `<span class="pill ok">${a.source === "wishlist" ? "On your wishlist" : "Fits what you need"}</span>` : override === "reject" ? `<span class="pill bad">Not for us</span>` : `<span class="pill">Outside your needs</span>`;
    const whyNot = miss && miss.failed.length ? `<div class="small faint">${esc(miss.failed[0].label)}: ${esc(miss.failed[0].detail)}</div>` : "";
    return lotCard(l, {
      showOwner: true,
      extra: `<div class="row">${fit}${rs.length ? `<span class="pill brand">${plural(rs.length, "exchange option")}</span>` : ""}</div>${whyNot}`,
      actions: `<span class="row" style="gap:3px"><button class="btn ghost sm" id="view-${l.id}" data-act="view-lot" data-id="${l.id}">Details</button>${a.source === "profile" ? "" : override === "accept" ? `<button class="btn ghost sm" id="wish-${l.id}" data-act="set-override" data-id="${l.id}" data-v="">Unlist</button>` : `<button class="btn sm" id="wish-${l.id}" data-act="set-override" data-id="${l.id}" data-v="accept">Wishlist</button>`}</span>`,
    });
  }).join("")}</div>`;
}
const marketCount = () => plural(Engine.marketplaceRows(state, me().id, ui.mp).length, "lot");

    <div class="row" style="align-items:flex-end;gap:10px" role="search">
      <div class="field" style="flex:2;min-width:180px"><label for="mp-q">Search</label><input id="mp-q" type="search" autocomplete="off" data-mp="q" value="${esc(f.q)}" placeholder="Fabric, company, fiber or city"></div>
      ${sel("cat", "Category", Engine.CATEGORIES)}${sel("fiber", "Contains fiber", Engine.FIBERS)}${sel("city", "Location", Object.keys(Engine.CITIES))}${sel("color", "Color", Object.keys(Engine.COLORS))}
      ${numF("gsmMin", "GSM from")}${numF("gsmMax", "GSM to")}${numF("qtyMin", "Min. m")}

      <span class="small muted" style="margin-left:6px">Exchange rule</span><div class="seg" role="group" aria-label="Exchange rule">${Object.entries(Engine.REGIMES).map(([k, r]) => `<button id="set-R-${k}" data-act="set-regime" data-v="${k}" aria-pressed="${s.regime === k}">${esc(r.label)}</button>`).join("")}</div></div>
      <button class="btn ghost sm" id="toggle-rules" data-act="toggle-rules" aria-expanded="${!!ui.rulesOpen}">${ui.rulesOpen ? "Hide cost assumptions" : "Edit cost assumptions"}</button></div>

    ${ui.rulesOpen ? `<div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px">

      ${nf("c_km", "KRW per km per 50 kg", s.c_km, 10, "")}

      ${nf("p_fail", "Chance a company pulls out", s.p_fail, 0.01, "0.05 means 5% per company")}
      ${nf("fail_cost_share", "Shipping lost if it falls through", s.fail_cost_share, 0.05, "0.5 means half")}

    </div><p class="small faint" style="margin-top:8px">Assumed defaults, not market data. How it works lists them all.</p>` : ""}
  </section>`;
}

/* ---- 5. Exchange Matches ---- */
function matchesSummary() {
  const c = me(), s = state.settings, v = Engine.companyView(state, M, c.id), packs = M.packs;
  const totalLots = M.lots.length;
  const mineIn = packs[s.L].selected.filter((x) => x.companies.includes(c.id)).length;
  const movedTheory = M.theory.selected.reduce((a, x) => a + x.k, 0);
  const gainGap = M.theory.value - M.recommended.value;
  const placed = v.committed.filter((x) => x.exchange);
  return `<section class="card" data-tour="compare"><div class="between"><h3>What multi-way adds</h3>${DEMO}</div><p class="small muted">Lots that could move across this demo's companies, counting only exchanges everyone would accept.</p>
        <div class="bars" style="margin-top:12px">${[2, 3, 4].map((L) => {
          const moved = packs[L].selected.reduce((sum, x) => sum + x.k, 0);
          return `<div class="bar-row"><span>${L === 2 ? "Direct swaps only" : `Up to ${L}-way`}</span><div class="bar-track"><div class="bar-fill" style="width:${totalLots ? (moved / totalLots) * 100 : 0}%"></div></div><b class="num" style="text-align:right">${moved} of ${totalLots}</b></div>`;
        }).join("")}</div>
        <p class="small faint" style="margin-top:10px">${M.theory !== M.recommended && gainGap > 0.5 ? `Ignoring everyone's minimum gain, the top set would move ${movedTheory} lots and gain ${won(gainGap)} more on paper, but at least one company wouldn't accept it. ` : ""}Fictional companies and made-up lots: an illustration of the mechanism, not evidence of how a real market would perform.</p></section>
      <section class="card"><h3>For ${esc(c.name)}</h3>
        <div class="row" style="gap:22px;margin-top:8px">
          <div><div style="font:500 26px var(--serif)">${v.ready.length}</div><div class="small muted">Options ready</div></div>
          <div><div style="font:500 26px var(--serif)">${mineIn}</div><div class="small muted">${M.status.proven ? "Recommended" : "Suggested"}</div></div>
          <div><div style="font:500 26px var(--serif)">${v.onlyMultiWay.length}</div><div class="small muted">Lots only multi-way can move</div></div>
        </div>
        <h4 style="margin-top:14px">Where your lots go</h4>
        <div style="margin-top:4px">${v.committed.map(({ lot, exchange }) => `<div class="between small" style="padding:5px 0;border-top:1px solid var(--line)"><span>${esc(lot.name)}</span>${exchange ? `<span class="pill ok">${exchange.k === 2 ? "Direct swap" : exchange.k + "-way exchange"}</span>` : `<span class="pill">Not placed</span>`}</div>`).join("") || `<p class="small faint">No lots available.</p>`}</div>
        <p class="small muted" style="margin-top:8px">${placed.length > 1 ? `Your company is in ${placed.length} exchanges at once, each with a different lot.` : "A company can join several exchanges at once. Each lot goes to only one."}</p>
      </section>`;
}
const capped = (arr, key) => {
  const list = arr.slice(0, ui.listCap[key]);
  // The guided exchange stays in view during the demonstration.
  const g = arr.find((i) => i.sig === "L01>L03>L05");
  if (ui.tour != null && g && !list.includes(g)) list[list.length - 1] = g;
  return list;
};
const moreBtn = (arr, key) => (arr.length > ui.listCap[key] ? `<button class="btn" id="more-${key}" data-act="list-more" data-key="${key}" style="align-self:center">Show ${Math.min(12, arr.length - ui.listCap[key])} more of ${arr.length - ui.listCap[key]}</button>` : "");
function matchesList() {
  const c = me(), s = state.settings, v = Engine.companyView(state, M, c.id);
  const scope = ui.matchScope, k = ui.matchK;
  const inK = (i) => k === "all" || i.k === +k;
  const rank = (a, b) => (b.recommended - a.recommended) || (scope === "mine" ? Engine.gainOf(b, c.id) - Engine.gainOf(a, c.id) : b.w - a.w);
  const ready = (scope === "mine" ? v.ready : M.pool.filter((i) => i.k <= s.L));
  const below = (scope === "mine" ? v.belowMin : M.feasible.filter((i) => !i.ready && i.k <= s.L));
  const counts = { 2: 0, 3: 0, 4: 0 };
  ready.forEach((i) => counts[i.k]++);
  const list = ready.filter(inK).slice().sort(rank);
  const blocked = (scope === "mine" ? v.blocked : M.items.filter((i) => !i.eligible && !i.declined && i.k <= s.L));
  const declined = M.items.filter((i) => i.declined && (scope !== "mine" || i.companies.includes(c.id)));
  return `<div class="between">
      <div class="row">
        <div class="seg" role="group" aria-label="Whose exchanges"><button id="scope-mine" data-act="match-scope" data-v="mine" aria-pressed="${scope === "mine"}">${esc(c.name)}</button><button id="scope-all" data-act="match-scope" data-v="all" aria-pressed="${scope === "all"}">All companies</button></div>
        <div class="seg" role="group" aria-label="Exchange size"><button id="k-all" data-act="match-k" data-v="all" aria-pressed="${k === "all"}">All</button>${[2, 3, 4].filter((n) => n <= s.L).map((n) => `<button id="k-${n}" data-act="match-k" data-v="${n}" aria-pressed="${k === String(n)}">${n}-way (${counts[n]})</button>`).join("")}</div>
      </div>
      ${M.audit.pass ? `<span class="pill ok" title="Separate from the optimality status above">✓ Rechecked: each lot used once, every company clears its minimum</span>` : `<span class="pill bad">Recheck failed: ${esc(M.audit.violations[0])}</span>`}
    </div>
    <h2 style="margin-top:6px">Ready to propose</h2>
    ${list.length ? capped(list, "ready").map((i) => exchangeCard(i, c.id, { tour: i.sig === "L01>L03>L05" ? "guided-card" : null })).join("") + moreBtn(list, "ready") : `<div class="empty"><h3>Nothing ready at this setting</h3><p class="small">Try a larger exchange size, widen your sourcing needs, or add a lot from My Inventory.</p></div>`}
    ${below.filter(inK).length ? `<details class="card flat" open data-tour="below"><summary>Works on paper, but below someone's minimum (${below.filter(inK).length})</summary><p class="small muted">These pass the economics, but at least one company has said it needs a bigger gain. They aren't recommended. You can still open them, and a company could lower its minimum.</p><div class="stack" style="gap:10px;margin-top:10px">${capped(below.filter(inK).sort(rank), "below").map((i) => exchangeCard(i, c.id)).join("")}${moreBtn(below.filter(inK), "below")}</div></details>` : ""}
    ${blocked.filter(inK).length ? `<details class="card flat"><summary>Right fabric, wrong economics (${blocked.filter(inK).length})</summary><p class="small muted">The fabrics match every step of the way, but at least one company would lose out under the current rule. These aren't offered.</p><div class="stack" style="gap:10px;margin-top:10px">${capped(blocked.filter(inK), "blocked").map((i) => exchangeCard(i, c.id)).join("")}${moreBtn(blocked.filter(inK), "blocked")}</div></details>` : ""}
    ${declined.length ? `<details class="card flat"><summary>Declined (${declined.length})</summary><div class="stack" style="gap:8px;margin-top:8px">${declined.map((i) => `<div class="between small"><span>${esc(i.members.map((m) => m.lotName).join(" → "))}</span><button class="btn ghost sm" id="reopen-${esc(i.sig)}" data-act="reopen" data-sig="${esc(i.sig)}">Allow again</button></div>`).join("")}</div></details>` : ""}`;
}

/* ---- 6. Exchange Details ---- */
function pageExchange() {
  const sig = ui.sig, it = itemFor(sig), c = me();
  if (!it) return `<div class="empty"><h3>This exchange is no longer available</h3><p class="small">Inventory or preferences changed, so it no longer exists.</p><button class="btn" data-go="matches" style="margin-top:8px">Back to matches</button></div>`;
  const ex = Engine.findExchange(state, sig) || (it.exchange || null);
  const live = ex && Engine.findExchange(state, sig);
  const mine = it.members.find((m) => m.company === c.id);
  const regime = it.regime;
  const direct = Engine.directSwapAnalysis(state, it);
  const stages = ["proposed", "confirmed", "swatch", "pickup", "delivered", "completed"];
  const at = ex ? stages.indexOf(ex.status) : -1;
  const steps = it.members.map((m) => {
    const l = lotOf(m.lotId);
    return `<div class="flow-step"><div class="sw" style="${l ? swatchStyle(l) : "background:#d9d5ca"}"></div>
      <div style="min-width:0"><div style="font-weight:600">${esc(m.lotName)}</div>
      <div class="small muted">${esc(m.companyName)} sends to <b style="font-weight:600;color:var(--ink)">${esc(m.toName)}</b></div>
      <div class="small faint">${esc(m.fromCity)} → ${esc(m.toCity)}, ${Math.round(m.km)} km, about ${Math.round(m.kg)} kg</div></div>
      <div class="end small num" style="text-align:right"><b>${won(m.C)}</b><div class="faint">shipping</div></div></div>`;
  }).join("");
  const creditCols = regime === "credit_list";
  const table = `<div class="tw"><table><thead><tr><th>Company</th><th>Receives</th><th class="r">Worth to them</th><th class="r">Clearance value given up</th><th class="r">Shipping paid</th><th class="r">Net gain</th><th class="r">Their minimum</th>${creditCols ? `<th class="r">Simulated credit</th><th class="r">After credit</th>` : ""}${regime === "credit_surplus" ? `<th class="r">Equal share (theoretical)</th>` : ""}</tr></thead><tbody>
    ${it.members.map((m) => { const co = coOf(m.company); const hurdle = co ? co.hurdle || 0 : 0; return `<tr ${m.company === c.id ? 'style="background:var(--clay-soft)"' : ""}><td style="font-weight:550">${esc(m.companyName)}</td><td>${esc(m.recvName)}<div class="small faint">${m.source === "wishlist" ? "Wishlist" : esc(m.profileName || "")}, valued at ${Math.round((m.factor || 0) * 100)}% of listed${m.soft !== 1 ? `, less 10% for color` : ""}</div></td>
      <td class="r">${won(m.W)}</td><td class="r">${won(m.S)}</td><td class="r">${won(m.C)}</td><td class="r ${m.net < 0 ? "neg" : "pos"}">${signed(m.net)}</td><td class="r ${m.gain < hurdle ? "neg" : ""}">${won(hurdle)}</td>
      ${creditCols ? `<td class="r">${m.credit > 0 ? "pays " + won(m.credit) : "gets " + won(state.settings.credit_discount * -m.credit)}</td><td class="r ${m.net2 < 0 ? "neg" : "pos"}">${signed(m.net2)}</td>` : ""}
      ${regime === "credit_surplus" ? `<td class="r">${signed(m.gain)}</td>` : ""}</tr>`; }).join("")}
  </tbody></table></div>`;

    [regime === "credit_surplus" ? "The group comes out ahead overall" : "Every company comes out ahead", allGain, regime === "ntu" ? "After shipping and clearance value given up." : "After simulated credits or theoretical sharing."],
    ["It still pays after the risk of someone pulling out", it.w > 0, `${won(it.w)} risk-adjusted gain at a ${Math.round(it.succ * 100)}% chance everyone follows through, with ${won(it.failCost)} of shipping lost if it falls through.`],
  ];
  const ready = [
    ["Every company clears its own minimum gain", below.length === 0, below.length ? below.map((b) => `${b.name} would gain ${won(b.gain)}, below its ${won(b.minimum)} minimum.`).join(" ") : "This is what makes an exchange eligible for recommendation."],
  ];
  const approvals = it.companies.map((id) => {

        ${direct.map((d) => `<div class="check"><span class="tick ${d.accepted ? "y" : "n"}">${d.accepted ? "✓" : "×"}</span><span><b style="font-weight:600">${esc(d.to)}</b> wants ${esc(d.lotName)}, but <b style="font-weight:600">${esc(d.from)}</b> ${d.accepted ? `would also accept ${esc(d.backName)}` : `doesn't want ${esc(d.backName)}`}${d.why ? `<div class="small faint">${esc(d.why)}</div>` : ""}</span></div>`).join("")}</section>` : ""}

        ${table}

/* ---- 8. How it works (technical language lives here) ---- */
function researchLabBlock() {

function pageHow() {
  const t = (cols, rows) => `<div class="tw"><table><thead><tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((x) => `<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

    <section class="card"><h2>From inventory to exchanges</h2>
      <ol class="small" style="margin:10px 0 0;padding-left:18px;max-width:78ch"><li style="margin-bottom:5px"><b>Compatibility.</b> Each company's sourcing needs are compared with each lot's specifications. This builds a directed graph: an edge means "this company would accept this lot".</li>
      <li style="margin-bottom:5px"><b>Cycle search.</b> All 2-, 3- and 4-way cycles are listed. A cycle can't include the same company twice.</li>
      <li style="margin-bottom:5px"><b>Economic test (feasible).</b> Each company's net gain is <code>W − S − C</code>. Under the default rule, everyone's net gain must be ≥ 0, and expected profit after failure risk must be positive.</li>

    <section class="card"><h2>Glossary: screen wording and model terms</h2>
      ${t(["On screen", "Model term", "Definition"], [
        ["Worth to them", "Subjective value W", "Listed value × value factor × color multiplier"],
        ["What a fit is worth (%)", "Value factor", "Stated by the company. 105% is a factor of 1.05"],
        ["Clearance value", "Outside option S", "Owner-stated share of listed value"],
        ["Shipping", "Logistics cost C", "₩c_fixed + ₩c_km × distance × kg / 50, times the multiplier"],
        ["Net gain", "net", "W − S − C"],
        ["Chance everyone follows through", "succ", "(1 − p_fail)^k"],
        ["Risk-adjusted gain", "Expected profit w", "succ × surplus − (1 − succ) × fail_cost_share × ΣC"],
        ["Minimum acceptable gain", "Participation hurdle", "A cycle is ready if each member's gain ≥ its hurdle"],
        ["Works on paper", "Feasible", "Passes the regime's admissibility test and w > 0"],

        ["Everyone gains", "ntu regime", "No transfers. net ≥ 0 for all"],
        ["Balancing credits (simulated)", "credit_list regime", "net2 = net − max(x, 0) + discount × max(−x, 0), with x = v_prev − v_me"],
        ["Shared gain (theoretical)", "credit_surplus regime", "Σ net ≥ 0, with an equal share shown per member"],

    <section class="card"><h2>Prototype assumptions</h2><p class="small muted" style="margin:3px 0 10px">Written for this demo. None has been validated with real companies or trades.</p>
      ${t(["Item", "Rule used here", "Status"], [
        ["Compatibility", "A lot qualifies if it meets every stated requirement in at least one sourcing need (category, fiber share, excluded fibers, GSM, width, quantity, color, certification, distance), or if it is on the wishlist.", "Prototype assumption. Real fit also depends on hand, drape, shade and quality, which aren't modelled"],
        ["W", "Listed value × value factor. Missing a preferred color lowers it by 10%.", "Prototype assumption. Factors are stated by the company and uncalibrated"],
        ["Listed value", "Owner's estimate.", "Self-reported. No price discovery or verification"],
        ["S", "Owner-stated share of listed value. Demo lots use 45-60%.", "Assumed. The research used a 30-70% range"],
        ["Participation hurdle", "A fixed KRW amount per company. Demo values are made up.", "Prototype assumption. Not part of the research model"],
        ["Weight", "Quantity × width × GSM.", "Physical formula. Ignores core and packaging"],
        ["C", "₩30,000 per shipment + ₩150 per km per 50 kg, straight-line distance, 8 km floor.", "Assumed. Carried over from the research, not carrier rates"],
        ["Failure risk", "5% per company; a cycle succeeds with (1−risk)^k; half of logistics is sunk on failure.", "Assumed. Carried over from the research"],
        ["Simulated approval", "A company approves if its gain clears its stated minimum.", "Illustrative only. Not a model of behaviour"],
      ])}</section>
    <section class="card"><h2>Research model and this prototype</h2>
      ${t(["Topic", "Research model", "This prototype", "Why"], [
        ["Graph node", "One firm with one lot", "One inventory lot", "Companies hold many lots. With one lot per company the two are identical"],
        ["Packing limit", "Each firm in at most one cycle", "Each lot in at most one cycle; a company may join several cycles with different lots", "Multiple lots per company"],
        ["Inside a cycle", "Firms are distinct by construction", "Explicit rule: no company twice", "A company must not trade with itself"],

        ["Own fabric type", "Never accepted", "Allowed if needs say so", "Now an explicit choice"],
        ["W", "Random lognormal draw", "Listed value × stated factor", "Companies can state it. Removes noise, adds an unverified assumption"],

      <div class="note ok" style="margin-top:10px"><b>Consistency check.</b> With one lot per company and research data fed in, this engine chose the same cycles as the research engine in all 900 comparisons run during development. That shows the logic carries over. It doesn't validate the textile assumptions above.</div></section>
    <section class="card"><h2>Credits aren't payments</h2><p class="small" style="margin-top:6px;max-width:78ch">"Everyone gains" is the default and uses no credits. <b>Balancing credits</b> and <b>Shared gain</b> are research mechanisms kept for comparison. Balancing credits aren't budget-balanced: the payer's amount and the receiver's amount differ, so this couldn't operate as a ledger as written. Shared gain assumes gains can be divided perfectly. Neither is a wallet, invoice, payment or settlement feature, and nothing is held or transferred.</p></section>
    <section class="card"><h2>What isn't here</h2><ul class="small" style="margin:8px 0 0;padding-left:18px;max-width:78ch"><li>Real companies, verification, contracts, carriers, payments, tax or customs handling</li><li>Splitting a lot, or partial quantities</li><li>Physical quality checks: swatch stages are simulated labels only</li><li>Protection against misreported lots or values, and any evidence that companies would adopt this</li><li>Chains that don't close into a cycle, and arrivals over time</li></ul></section>
    <section class="card"><div class="between"><div><h2>Built-in checks</h2><p class="small muted">Small markets with hand-worked answers, plus workflow safeguards.</p></div><button class="btn primary" id="run-checks" data-act="run-checks">${results ? "Run again" : "Run checks"}</button></div>
      ${results ? `<div class="note ${results.every((r) => r.ok) ? "ok" : "warn"}" style="margin-top:10px"><b>${results.filter((r) => r.ok).length} of ${results.length} checks passed</b></div>

<script>
/* ===========================================================================
 * App shell: routing, commits, interactions, drawer, onboarding, guided demo.
 * ======================================================================== */
const PAGES = {
  dashboard: ["Dashboard", pageDashboard], inventory: ["My Inventory", pageInventory], preferences: ["My Preferences", pagePreferences],
  marketplace: ["Marketplace", pageMarketplace], matches: ["Exchange Matches", pageMatches], activity: ["Activity", pageActivity], how: ["How it works", pageHow],
};
const mySigs = () => new Set(M ? Engine.companyView(state, M, state.current).ready.map((i) => i.sig) : []);

/**
 * Any change to inventory, preferences, decisions or rules comes through here.
 * opts.soft: a function that updates only the live parts of the page, so a form
 * being typed in is not rebuilt and keeps focus, caret and pending clicks.
 */
function commit(message, opts = {}) {
  const before = mySigs();
  const closed = Engine.revalidate(state);
  M = Engine.computeMarket(state);
  state.touched = true;
  saveState();
  const after = mySigs();
  const added = [...after].filter((s) => !before.has(s)).length, removed = [...before].filter((s) => !after.has(s)).length;
  const bits = [];
  if (message) bits.push(message);
  if (!opts.quiet && (added || removed)) bits.push(`Matches updated for ${me().name}: ${added ? `+${added} new` : ""}${added && removed ? ", " : ""}${removed ? `${removed} no longer available` : ""}`);
  if (closed) bits.push(`${closed} open proposal${closed === 1 ? "" : "s"} closed`);
  if (!storageOk) bits.push("Couldn't save in this browser, so changes last only until you close the page");
  if (bits.length) toast(bits.join(". ") + ".");
  if (opts.soft) { renderShell(); opts.soft(); } else render();
}
let toastTimer;
function toast(msg) {
  ui.toast = msg;
  const el = $("#toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; ui.toast = null; }, 4200);
}

/* ---- Routing and render ---- */
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("exchange/")) { ui.page = "exchange"; ui.sig = h.slice(9); return; }
  ui.page = PAGES[h] ? h : "dashboard"; ui.sig = null;
}
function setHash(h) { try { history.replaceState(null, "", "#" + h); } catch (e) { /* non-navigable origin */ } }
function go(page, sig) {

}
function render() {
  const active = document.activeElement, focusId = active && active.id && active.id !== "main" ? active.id : null;

}

    <div class="top-right"><button class="link-btn ${ui.page === "how" ? "on" : ""}" id="nav-how" data-go="how" aria-label="How it works"><span class="q" aria-hidden="true">?</span>How it works</button>
      <div class="menu-wrap"><button class="link-btn" id="demo-btn" data-act="demo-toggle" aria-haspopup="menu" aria-expanded="${ui.demoOpen}">Demo<span class="chev" aria-hidden="true"></span></button>
      ${ui.demoOpen ? `<div class="menu" role="menu" id="demo-menu">
        <button role="menuitem" id="menu-tour" data-act="tour-start">See a 3-way exchange</button>

function renderContext() {

        <button class="co-btn" id="co-btn" data-act="co-toggle" aria-haspopup="listbox" aria-expanded="${ui.coOpen}" aria-label="Viewing as ${esc(c.name)}. Switch company" data-tour="switcher">
          ${brandMark(c, 44)}<span class="co-text"><span class="co-name">${esc(c.name)}</span><span class="co-meta">${esc(c.kind)} · ${esc(c.city)}</span></span><span class="chev" aria-hidden="true"></span>

          ${state.companies.map((x) => {

            return `<button class="co-opt ${sel ? "on" : ""}" id="co-opt-${x.id}" role="option" aria-selected="${sel}" data-act="co-pick" data-co="${x.id}">${brandMark(x, 38)}<span class="co-text"><span class="co-name">${esc(x.name)}</span><span class="co-meta">${esc(x.kind)} · ${esc(x.city)} · ${plural(n, "lot")}</span></span>${sel ? `<span class="co-check" aria-hidden="true">✓</span>` : ""}</button>`;

      </div></div>`;
}
function switchCompany(id) {
  const changed = id !== state.current;

  if (proto !== "file:") return done(false);
  // fetch() is blocked on file://. A script element loads the file without running it:
  // an HTML page can't parse as JavaScript, so it stops at a syntax error, and a missing
  // file fires onerror. The expected syntax error is silenced for this one file.
  const swallow = (ev) => { if (!ev.filename || ev.filename.includes("research-lab.html")) ev.preventDefault(); };
  window.addEventListener("error", swallow);
  const probe = document.createElement("script");
  probe.src = "research-lab.html";
  const finish = (ok) => { window.removeEventListener("error", swallow); probe.remove(); done(ok); };
  probe.onload = () => finish(true);
  probe.onerror = () => finish(false);
  document.head.appendChild(probe);
}

const currentTour = () => TOURS[ui.tourKey || "quick"];
function startTour(key) {
  const begin = () => { resetDemo(true); ui.tourKey = key; tourGo(0); };
  if (!state.touched) return begin();
  openDrawer({ type: "confirm", title: "Start the demonstration?", text: "It starts from the original data, so your edits, photos and activity in this browser will be replaced.", yes: "Reset and start", run: begin });
}
function tourGo(i) {
  const list = currentTour();
  ui.tour = Math.max(0, Math.min(list.length - 1, i));
  if (ui.drawer && !list[ui.tour].drawer) { ui.drawer = null; renderOverlay(); }
  list[ui.tour].go();
  renderTour();
  if (list[ui.tour].run) list[ui.tour].run();
  const n = $("#tour-next");
  if (n && !ui.drawer) n.focus({ preventScroll: true });
}
function tourNext() {
  const s = currentTour()[ui.tour];
  if (s.next) {
    const res = s.next();
    if (res === false) return; // form errors: stay on this step
  }
  if (s.last) { ui.tour = null; render(); return; }
  tourGo(ui.tour + 1);
}
function renderTour() {
  $$(".tour-target").forEach((x) => x.classList.remove("tour-target"));
  const host = $("#tour");
  if (ui.tour == null) { host.innerHTML = ""; return; }
  const list = currentTour(), s = list[ui.tour];
  host.innerHTML = `<div class="tour" role="dialog" aria-label="Guided demonstration"><div class="bar"><i style="width:${((ui.tour + 1) / list.length) * 100}%"></i></div>
    <div class="small" style="color:#a9c9b6">Step ${ui.tour + 1} of ${list.length}</div><h3>${esc(s.title)}</h3><p>${esc(typeof s.text === "function" ? s.text() : s.text)}</p>

  if (s.target) {
    const el = document.querySelector(`[data-tour="${CSS.escape(s.target)}"]`);
    if (el) { el.classList.add("tour-target"); el.scrollIntoView({ block: "center", behavior: "auto" }); }
  }
}
