        <div style="margin-top:8px">${wish.map(([id, kind]) => { const l = lotOf(id); return l ? `<div class="between small" style="padding:6px 0;border-top:1px solid var(--line)"><span>${esc(l.name)} <span class="pill ${kind === "accept" ? "ok" : "bad"}">${kind === "accept" ? "Wishlist" : "Not for us"}</span></span><button class="btn ghost sm" data-act="clear-override" data-id="${id}">Clear</button></div>` : ""; }).join("") || `<p class="small faint">None yet.</p>`}</div>
      </section>
      <div class="note"><b>Value factor is your statement, not a measurement.</b> The value a lot has to you is estimated as listed value × your value factor. It replaces the random draw in the research model and has not been calibrated against real trades.</div>
    </aside>
  </div>`;
}

/* ---- 4. Marketplace ---- */
function pageMarketplace() {
  const c = me(), f = ui.mp;
  const v = Engine.companyView(state, M, c.id);
  const num = (x) => (x === "" ? null : Number(x));
  const pool = state.lots.filter((l) => l.owner !== c.id && l.status === "active");
  const rows = pool.map((l) => ({ l, a: Engine.assess(c, l) })).filter(({ l, a }) => {
    const q = f.q.trim().toLowerCase();
    if (q && !`${l.name} ${l.category} ${coOf(l.owner).name} ${l.color}`.toLowerCase().includes(q)) return false;
    if (f.cat !== "all" && l.category !== f.cat) return false;
    if (f.fiber !== "all" && !l.composition[f.fiber]) return false;
    if (f.city !== "all" && l.city !== f.city) return false;
    if (f.color !== "all" && l.colorFamily !== f.color) return false;
    if (num(f.gsmMin) != null && l.gsm < num(f.gsmMin)) return false;
    if (num(f.gsmMax) != null && l.gsm > num(f.gsmMax)) return false;
    if (num(f.qtyMin) != null && l.qty < num(f.qtyMin)) return false;
    if (f.fit === "fit" && !a.accepted) return false;
    return true;
  }).sort((x, y) => y.a.accepted - x.a.accepted);
  const sel = (key, label, opts) => `<div class="field" style="min-width:128px;flex:1"><label for="mp-${key}">${label}</label><select id="mp-${key}" data-mp="${key}"><option value="all">All</option>${opts.map((o) => `<option ${f[key] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
  const numF = (key, label) => `<div class="field" style="width:96px"><label for="mp-${key}">${label}</label><input id="mp-${key}" type="number" data-mp="${key}" value="${esc(f[key])}"></div>`;
  return `
  <div class="page-head"><div><h1>Marketplace</h1><p>Lots other companies have made available for exchange. Nothing here is for sale: lots move through approved exchanges.</p></div></div>
  <section class="card flat" style="margin-bottom:16px">
    <div class="row" style="align-items:flex-end;gap:10px">
      <div class="field" style="flex:2;min-width:180px"><label for="mp-q">Search</label><input id="mp-q" type="search" data-mp="q" value="${esc(f.q)}" placeholder="Fabric, company or color"></div>
      ${sel("cat", "Category", Engine.CATEGORIES)}${sel("fiber", "Contains fiber", Engine.FIBERS)}${sel("city", "Location", Object.keys(Engine.CITIES))}${sel("color", "Color", Object.keys(Engine.COLORS))}
      ${numF("gsmMin", "GSM from")}${numF("gsmMax", "GSM to")}${numF("qtyMin", "Min. m")}
    </div>
    <div class="between" style="margin-top:12px"><div class="seg" role="group" aria-label="Fit filter"><button data-act="mp-fit" data-v="all" aria-pressed="${f.fit === "all"}">All lots</button><button data-act="mp-fit" data-v="fit" aria-pressed="${f.fit === "fit"}">Fits ${esc(c.name)}</button></div>
    <span class="row"><span class="small muted">${plural(rows.length, "lot")}</span><button class="btn ghost sm" data-act="mp-clear">Clear filters</button></span></div>
  </section>
  ${rows.length ? `<div class="lot-grid">${rows.map(({ l, a }) => {
    const miss = !a.accepted ? Engine.closestMiss(a) : null;
    const override = (c.overrides || {})[l.id];
    const rs = M.items.filter((i) => i.eligible && !i.declined && i.lots.includes(l.id) && i.companies.includes(c.id));
    const fit = a.accepted ? `<span class="pill ok">${a.source === "wishlist" ? "On your wishlist" : "Fits your preferences"}</span>` : override === "reject" ? `<span class="pill bad">Not for us</span>` : `<span class="pill">Outside your preferences</span>`;
    const whyNot = miss && miss.failed.length ? `<div class="small faint">${esc(miss.failed[0].label)}: ${esc(miss.failed[0].detail)}</div>` : "";
    return lotCard(l, {
      showOwner: true,
      extra: `<div class="row">${fit}${rs.length ? `<span class="pill brand">${plural(rs.length, "route")}</span>` : ""}</div>${whyNot}`,
      actions: `<span class="row" style="gap:3px"><button class="btn ghost sm" data-act="view-lot" data-id="${l.id}">Details</button>${a.source === "profile" ? "" : override === "accept" ? `<button class="btn ghost sm" data-act="set-override" data-id="${l.id}" data-v="">Unlist</button>` : `<button class="btn sm" data-act="set-override" data-id="${l.id}" data-v="accept">Wishlist</button>`}</span>`,
    });
  }).join("")}</div>` : `<div class="empty"><h3>No lots match these filters</h3><button class="btn sm" data-act="mp-clear" style="margin-top:6px">Clear filters</button></div>`}`;
  void v;
}

function lotDetail(l) {
  const c = me(), a = Engine.assess(c, l), owner = coOf(l.owner);
  const list = a.source === "own" ? [] : (a.profiles || []);
  return `<div class="swatch" style="${swatchStyle(l)};height:190px;border-radius:12px"></div>
    <div class="who" style="margin:14px 0 4px">${monogram(owner)}<div><b>${esc(owner.name)}</b><div class="small muted">${esc(owner.kind)}, ${esc(owner.city)}</div></div></div>
    <div class="tw" style="margin-top:10px"><table><tbody>
      ${[["Composition", Engine.compositionText(l.composition)], ["Category", l.category], ["Weight", l.gsm + " GSM"], ["Width", l.width + " cm"], ["Color", l.color || l.colorFamily], ["Quantity", l.qty.toLocaleString("en-US") + " m (about " + Math.round(Engine.lotKg(l)) + " kg)"], ["Location", l.city], ["Estimated value", won(l.value) + " (owner's estimate)"], ["Certifications", (l.certs || []).length ? l.certs.join(", ") + " (self-declared, not verified)" : "None declared"]].map(([k, v]) => `<tr><td class="faint" style="width:40%">${k}</td><td>${esc(v)}</td></tr>`).join("")}
    </tbody></table></div>
    ${l.note ? `<p class="small muted" style="margin-top:10px">${esc(l.note)}</p>` : ""}
    ${l.photos && l.photos.length > 1 ? `<div class="photo-row" style="margin-top:10px">${l.photos.map((p) => `<div class="photo" style="background-image:url('${p}')"></div>`).join("")}</div>` : ""}
    ${a.source === "own" ? "" : `<h3 style="margin:18px 0 6px">Against ${esc(c.name)}'s preferences</h3>
    ${a.accepted ? `<div class="note ok"><b>${a.source === "wishlist" ? "Accepted through your wishlist." : `Fits "${esc(a.profile.name)}".`}</b> Estimated value to you: ${won(a.W)}.</div>` : `<div class="note">This lot does not meet any of your profiles yet.</div>`}
    ${list.map((r) => `<div style="margin-top:10px"><div class="small" style="font-weight:600">${esc(r.profile.name)}</div>${r.checks.map((x) => `<div class="check"><span class="tick ${x.pass ? "y" : "n"}">${x.pass ? "✓" : "×"}</span><span><b style="font-weight:550">${esc(x.label)}</b> <span class="muted">${esc(x.detail)}</span></span></div>`).join("")}</div>`).join("")}`}`;
}

/* ---- Matching rules (shared) ---- */
function rulesPanel() {
  const s = state.settings;
  const nf = (key, label, val, step, hint) => `<div class="field"><label for="r-${key}">${label}</label><input id="r-${key}" type="number" step="${step}" data-rule="${key}" value="${val}">${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
  return `<section class="card flat">
    <div class="between"><div class="row"><span class="small muted">Largest exchange</span><div class="seg" role="group" aria-label="Largest exchange">${[2, 3, 4].map((n) => `<button data-act="set-L" data-v="${n}" aria-pressed="${s.L === n}">${n}-way</button>`).join("")}</div>
      <span class="small muted" style="margin-left:6px">Rule</span><div class="seg" role="group" aria-label="Exchange rule">${Object.entries(Engine.REGIMES).map(([k, r]) => `<button data-act="set-regime" data-v="${k}" aria-pressed="${s.regime === k}">${esc(r.label)}</button>`).join("")}</div></div>
      <button class="btn ghost sm" data-act="toggle-rules">${ui.rulesOpen ? "Hide assumptions" : "Edit assumptions"}</button></div>
    ${s.regime !== "ntu" ? `<div class="note warn" style="margin-top:10px"><b>Not a payment or settlement system.</b> ${esc(Engine.REGIMES[s.regime].note)} No money or credit is created or moved here.</div>` : ""}
    ${ui.rulesOpen ? `<div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px">
      ${nf("c_fixed", "Fixed cost per shipment (KRW)", s.c_fixed, 5000, "Packing and handling")}
      ${nf("c_km", "KRW per km per 50 kg", s.c_km, 10, "")}
      ${nf("cost_scale", "Logistics multiplier", s.cost_scale, 0.5, "")}
      ${nf("p_fail", "Dropout risk per company", s.p_fail, 0.01, "An exchange of k companies succeeds with (1-risk)^k")}
      ${nf("fail_cost_share", "Sunk share if it fails", s.fail_cost_share, 0.05, "")}
      ${s.regime === "credit_list" ? nf("credit_discount", "Simulated credit rate", s.credit_discount, 0.05, "") : ""}
    </div><p class="small faint" style="margin-top:8px">Assumed defaults carried over from the research model. None are market data.</p>` : ""}
  </section>`;
}

/* ---- 5. Exchange Matches ---- */
function pageMatches() {
  const c = me(), s = state.settings, v = Engine.companyView(state, M, c.id);
  const packs = M.packs;
  const totalLots = M.lots.length;
  const mineIn = (L) => packs[L].selected.filter((x) => x.companies.includes(c.id)).length;
  const scope = ui.matchScope;
  const base = scope === "mine" ? v.eligible : M.pool.filter((i) => i.k <= s.L);
  const k = ui.matchK;
  const list = base.filter((i) => k === "all" || i.k === +k).slice().sort((a, b) => (b.recommended - a.recommended) || (scope === "mine" ? Engine.gainOf(b, c.id) - Engine.gainOf(a, c.id) : b.w - a.w));
  const blocked = (scope === "mine" ? v.blocked : M.items.filter((i) => !i.eligible && !i.declined && i.k <= s.L));
  const declined = M.items.filter((i) => i.declined && (scope !== "mine" || i.companies.includes(c.id)));
  const counts = { 2: 0, 3: 0, 4: 0 };
  base.forEach((i) => counts[i.k]++);
  const guided = list.find((i) => i.sig === "L01>L03>L05") ? "L01>L03>L05" : null;
  return `
  <div class="page-head"><div><h1>Exchange Matches</h1><p>Calculated live from every company's lots and preferences. The recommended round is the set of non-overlapping exchanges with the highest total expected gain.</p></div></div>
  <div class="stack">
    <div class="grid2" data-tour="compare">
      <section class="card"><h3>What multi-way adds</h3><p class="small muted">Lots that can move across all companies, under the current rule.</p>
        <div class="bars" style="margin-top:12px">${[2, 3, 4].map((L) => {
          const moved = packs[L].selected.reduce((sum, x) => sum + x.k, 0);
          return `<div class="bar-row"><span>${L === 2 ? "Direct swaps only" : `Up to ${L}-way`}</span><div class="bar-track"><div class="bar-fill" style="width:${totalLots ? (moved / totalLots) * 100 : 0}%"></div></div><b class="num" style="text-align:right">${moved} of ${totalLots}</b></div>`;
        }).join("")}</div></section>
      <section class="card"><h3>For ${esc(c.name)}</h3>
        <div class="row" style="gap:22px;margin-top:8px">
          <div><div class="stat-v" style="font:500 26px var(--serif)">${v.eligible.length}</div><div class="small muted">Routes found</div></div>
          <div><div class="stat-v" style="font:500 26px var(--serif)">${mineIn(s.L)}</div><div class="small muted">In recommended round</div></div>
          <div><div class="stat-v" style="font:500 26px var(--serif)">${v.onlyMultiWay.length}</div><div class="small muted">Lots only multi-way can move</div></div>
        </div>
        ${v.onlyMultiWay.length ? `<p class="small muted" style="margin-top:10px">${esc(v.onlyMultiWay[0].name)}${v.onlyMultiWay.length > 1 ? ` and ${v.onlyMultiWay.length - 1} more have` : " has"} no workable direct swap, but ${v.onlyMultiWay.length > 1 ? "can" : "can"} move through a cycle.</p>` : ""}
      </section>
    </div>
    ${rulesPanel()}
    <div class="between">
      <div class="row">
        <div class="seg" role="group" aria-label="Scope"><button data-act="match-scope" data-v="mine" aria-pressed="${scope === "mine"}">${esc(c.name)}</button><button data-act="match-scope" data-v="all" aria-pressed="${scope === "all"}">All companies</button></div>
        <div class="seg" role="group" aria-label="Exchange size"><button data-act="match-k" data-v="all" aria-pressed="${k === "all"}">All</button>${[2, 3, 4].filter((n) => n <= s.L).map((n) => `<button data-act="match-k" data-v="${n}" aria-pressed="${k === String(n)}">${n}-way (${counts[n]})</button>`).join("")}</div>
      </div>
      ${M.audit.pass ? `<span class="pill ok">✓ ${plural(M.audit.checked, "recommended exchange")} passed the constraint check</span>` : `<span class="pill bad">Constraint check failed</span>`}
    </div>
    ${list.length ? list.map((i) => exchangeCard(i, c.id, { tour: i.sig === guided ? "guided-card" : null })).join("") : `<div class="empty"><h3>No routes at this setting</h3><p class="small">Try a larger exchange size, widen your preferences, or add a lot from My Inventory.</p></div>`}
    ${blocked.length ? `<details class="card flat" ${ui.showBlocked ? "open" : ""}><summary>Compatible, but not economically feasible (${blocked.length})</summary><p class="small muted">Specifications match for every hop, but at least one participant would lose under the current rule. These are not offered.</p><div class="stack" style="gap:10px;margin-top:10px">${blocked.map((i) => exchangeCard(i, c.id)).join("")}</div></details>` : ""}
    ${declined.length ? `<details class="card flat"><summary>Declined (${declined.length})</summary><div class="stack" style="gap:8px;margin-top:8px">${declined.map((i) => `<div class="between small"><span>${esc(i.members.map((m) => m.lotName).join(" → "))}</span><button class="btn ghost sm" data-act="reopen" data-sig="${esc(i.sig)}">Allow again</button></div>`).join("")}</div></details>` : ""}
  </div>`;
}

/* ---- 6. Exchange Details ---- */
function pageExchange() {
  const sig = ui.sig, it = itemFor(sig), c = me();
  if (!it) return `<div class="empty"><h3>This exchange is no longer available</h3><p class="small">Inventory or preferences changed, so it no longer exists.</p><button class="btn" data-go="matches" style="margin-top:8px">Back to matches</button></div>`;
  const ex = Engine.findExchange(state, sig) || (it.exchange || null);
  const live = ex && Engine.findExchange(state, sig);
  const mine = it.members.find((m) => m.company === c.id);
  const regime = it.regime;
  const direct = Engine.directSwapAnalysis(state, it);
  const stages = ["proposed", "confirmed", "swatch", "pickup", "delivered", "completed"];
  const at = ex ? stages.indexOf(ex.status) : -1;
  const steps = it.members.map((m) => {
    const l = lotOf(m.lotId);
    return `<div class="flow-step"><div class="sw" style="${l ? swatchStyle(l) : "background:#d9d5ca"}"></div>
      <div style="min-width:0"><div style="font-weight:600">${esc(m.lotName)}</div>
      <div class="small muted">${esc(m.companyName)} sends to <b style="font-weight:600;color:var(--ink)">${esc(m.toName)}</b></div>
      <div class="small faint">${esc(m.fromCity)} → ${esc(m.toCity)}, ${Math.round(m.km)} km, about ${Math.round(m.kg)} kg</div></div>
      <div class="end small num" style="text-align:right"><b>${won(m.C)}</b><div class="faint">logistics</div></div></div>`;
  }).join("");
  const creditCols = regime === "credit_list";
  const table = `<div class="tw"><table><thead><tr><th>Company</th><th>Receives</th><th class="r">Value to them</th><th class="r">Gives up</th><th class="r">Logistics</th><th class="r">Net gain</th>${creditCols ? `<th class="r">Simulated credit</th><th class="r">After credit</th>` : ""}${regime === "credit_surplus" ? `<th class="r">Equal share (idealized)</th>` : ""}</tr></thead><tbody>
    ${it.members.map((m) => `<tr ${m.company === c.id ? 'style="background:var(--clay-soft)"' : ""}><td style="font-weight:550">${esc(m.companyName)}</td><td>${esc(m.recvName)}<div class="small faint">${m.source === "wishlist" ? "Wishlist" : esc(m.profileName || "")}, factor ${m.factor}${m.soft !== 1 ? `, color ×${m.soft}` : ""}</div></td>
      <td class="r">${won(m.W)}</td><td class="r">${won(m.S)}</td><td class="r">${won(m.C)}</td><td class="r ${m.net < 0 ? "neg" : "pos"}">${signed(m.net)}</td>
      ${creditCols ? `<td class="r">${m.credit > 0 ? "pays " + won(m.credit) : "gets " + won(state.settings.credit_discount * -m.credit)}</td><td class="r ${m.net2 < 0 ? "neg" : "pos"}">${signed(m.net2)}</td>` : ""}
      ${regime === "credit_surplus" ? `<td class="r">${signed(m.gain)}</td>` : ""}</tr>`).join("")}
  </tbody></table></div>`;
  const allGain = regime === "credit_surplus" ? it.surplus >= 0 : it.members.every((m) => m.gain >= 0);
  const feas = [
    ["Every recipient asked for what it receives", true, "Each lot meets a preference profile or wishlist entry."],
    ["No company appears twice and no lot is used twice", new Set(it.lots).size === it.k && new Set(it.companies).size === it.k, "Checked on every calculation."],
    [regime === "credit_surplus" ? "The group gains overall" : "Every company gains", allGain, regime === "ntu" ? "After logistics and what each gives up." : "After simulated credits or idealized sharing."],
    ["Expected gain stays positive after failure risk", it.w > 0, `Expected ${won(it.w)} at ${Math.round(it.succ * 100)}% success, with ${won(it.failCost)} sunk if it fails.`],
  ];
  const approvals = it.companies.map((id) => {
    const co = coOf(id), st = ex ? ex.approvals[id] : null;
    return `<div class="between" style="padding:7px 0;border-top:1px solid var(--line)"><span class="who">${monogram(co, true)}<span class="small" style="font-weight:${id === c.id ? 650 : 500}">${esc(co.name)}</span></span><span class="pill ${st === "approved" ? "ok" : st === "declined" ? "bad" : ""}">${st === "approved" ? "✓ Approved" : st === "declined" ? "× Declined" : "Pending"}</span></div>`;
  }).join("");
  const canAct = it.eligible !== false && mine && !it.declined;
  const myState = ex ? ex.approvals[c.id] : null;
  const isProposed = !ex || (live && ex.status === "proposed");
  return `
  <button class="btn ghost" data-go="matches" style="margin:-6px 0 8px -8px">← Exchange Matches</button>
  <div class="page-head"><div><div class="row"><h1>${it.k}-way exchange</h1>${ex ? statusPill(ex.status) : it.eligible ? `<span class="pill ${it.recommended ? "ok" : ""}">${it.recommended ? "In recommended round" : "Alternative route"}</span>` : `<span class="pill bad">Not feasible</span>`}${SIM}</div>
    <p>${it.k === 2 ? "Two companies swap directly." : `${it.k} companies each give one lot and receive one they asked for. Nobody needs a direct partner.`}</p></div></div>
  ${it.eligible === false ? `<div class="note warn" style="margin-bottom:16px"><b>Not offered.</b> ${esc(it.reason)}</div>` : ""}
  ${regime !== "ntu" ? `<div class="note warn" style="margin-bottom:16px"><b>Not a payment or settlement system.</b> ${esc(Engine.REGIMES[regime].note)}</div>` : ""}
  <div class="grid-main">
    <div class="stack" style="min-width:0">
      <section class="card" data-tour="graph"><h2>Who sends what to whom</h2><div class="graph" data-graph="${esc(sig)}" style="margin:8px 0"></div><div>${steps}</div></section>
      ${it.k > 2 ? `<section class="card" data-tour="why"><h2>Why this cannot be a direct swap</h2><p class="small muted" style="margin:3px 0 8px">A direct swap needs both sides to want each other's lot. For each pair in this loop, that test is shown below.</p>
        ${direct.map((d) => `<div class="check"><span class="tick ${d.accepted ? "y" : "n"}">${d.accepted ? "✓" : "×"}</span><span><b style="font-weight:600">${esc(d.to)}</b> wants ${esc(d.lotName)}, but <b style="font-weight:600">${esc(d.from)}</b> ${d.accepted ? `would also accept ${esc(d.backName)}` : `does not want ${esc(d.backName)}`}${d.why ? `<div class="small faint">${esc(d.why)}</div>` : ""}</span></div>`).join("")}</section>` : ""}
      <section class="card" data-tour="econ"><h2>Economic feasibility</h2><p class="small muted" style="margin:3px 0 10px">Net gain = value to them − what they give up − logistics they pay. All figures are estimates from stated assumptions.</p>
        ${table}
        <div style="margin-top:12px">${feas.map(([label, pass, d]) => `<div class="check"><span class="tick ${pass ? "y" : "n"}">${pass ? "✓" : "×"}</span><span><b style="font-weight:550">${esc(label)}</b> <span class="muted">${esc(d)}</span></span></div>`).join("")}</div>
      </section>
    </div>
    <aside class="stack" style="min-width:0">
      <section class="card" data-tour="approval"><div class="between"><h3>Participant approval</h3>${SIM}</div>
        <div style="margin-top:8px">${approvals}</div>
        ${ex && at >= 0 ? `<div class="timeline" style="margin-top:12px">${stages.slice(1).map((s, i) => `<span class="tl ${at >= i + 1 ? "done" : ""}"><i></i>${esc(Engine.STAGE_LABEL[s])}</span>`).join("")}</div>` : ""}
        ${isProposed && canAct && !myState ? `<div class="row" style="margin-top:12px"><button class="btn primary" data-act="approve" data-sig="${esc(sig)}" data-tour="approve-btn">Approve as ${esc(c.name)}</button><button class="btn danger" data-act="decline" data-sig="${esc(sig)}">Decline</button></div>` : ""}
        ${it.declined && !live ? `<p class="small muted" style="margin-top:10px">This exchange was declined and is out of the matching pool.</p><button class="btn sm" style="margin-top:6px" data-act="reopen" data-sig="${esc(sig)}">Allow it again</button>` : ""}
        ${isProposed && it.eligible !== false && !mine ? `<p class="small muted" style="margin-top:10px">${esc(c.name)} is not part of this exchange. Switch company to respond.</p>` : ""}
        ${live && ex.status === "proposed" ? `<button class="btn" style="margin-top:8px;width:100%" data-act="simulate-others" data-sig="${esc(sig)}" data-tour="sim-btn">Simulate other participants</button><p class="small faint" style="margin-top:6px">Rule: a simulated company approves if its gain clears its stated minimum (My Preferences). It is not a prediction of real behaviour.</p>` : ""}
        ${live && ex.status !== "proposed" ? `<div class="row" style="margin-top:12px"><button class="btn primary" data-act="advance" data-sig="${esc(sig)}">Advance simulated stage</button><button class="btn danger" data-act="dropout" data-sig="${esc(sig)}">Simulate dropout</button></div>` : ""}
        ${ex && !live ? `<p class="small muted" style="margin-top:10px">${ex.status === "completed" ? "This simulated exchange is finished. No goods moved." : "This proposal is closed."}${ex.closedReason ? " It closed because " + esc(ex.closedReason) + "." : ""}</p>` : ""}
      </section>
      ${mine ? `<section class="card"><h3>For ${esc(c.name)}</h3>
        <div class="give-get" style="margin-top:8px">
          <div><span class="sw" style="${lotOf(mine.lotId) ? swatchStyle(lotOf(mine.lotId)) : ""}"></span><div style="min-width:0"><div class="faint small">You send</div><div class="small" style="font-weight:600">${esc(mine.lotName)}</div></div></div>
          <div><span class="sw" style="${lotOf(mine.recvId) ? swatchStyle(lotOf(mine.recvId)) : ""}"></span><div style="min-width:0"><div class="faint small">You receive</div><div class="small" style="font-weight:600">${esc(mine.recvName)}</div></div></div>
        </div>
        <div class="between" style="margin-top:12px"><span class="muted small">Estimated gain if completed</span><span class="gain ${mine.gain < 0 ? "neg" : ""}">${signed(mine.gain)}</span></div></section>` : ""}
      <section class="card flat"><h3>Group summary</h3><div class="small" style="margin-top:6px">
        ${[["Gain if completed", won(it.surplus)], ["Total logistics", won(it.logistics)], ["Chance all participants follow through", Math.round(it.succ * 100) + "%"], ["Expected gain after risk", won(it.w)]].map(([a, b]) => `<div class="between" style="padding:4px 0"><span class="muted">${a}</span><b class="num">${b}</b></div>`).join("")}</div></section>
      <div class="note small">Nothing here moves goods or money, and companies are fictional and unverified. A real exchange would need contracts, physical swatch checks and carriers.</div>
    </aside>
  </div>`;
}

/* ---- 7. Activity ---- */
function pageActivity() {
  const c = me(), scope = ui.actScope;
  const rel = (e) => scope === "all" || e.companies.includes(c.id);
  const liveEx = state.exchanges.filter((e) => Engine.findExchange(state, e.sig) === e && rel(e));
  const past = state.exchanges.filter((e) => Engine.findExchange(state, e.sig) !== e && rel(e));
  const hist = (state.history || []).filter((h) => scope === "all" || h.parties.includes(c.name));
  const logs = state.activity.filter((a) => scope === "all" || a.companies.includes(c.id)).slice(0, 30);
  const row = (e) => {
    const names = e.snapshot.members.map((m) => m.lotName).join(" → ");
    return `<button class="ex" data-act="open-ex" data-sig="${esc(e.sig)}" style="grid-template-columns:minmax(0,1fr) auto;align-items:center"><div style="min-width:0"><div class="row"><b>${e.k}-way exchange</b>${statusPill(e.status)}</div><div class="small muted" style="margin-top:4px">${esc(names)}</div><div class="small faint">${esc(e.snapshot.members.map((m) => m.companyName).join(", "))}</div></div><span class="btn ghost sm">Open →</span></button>`;
  };
  return `
  <div class="page-head"><div><h1>Activity</h1><p>Status and history of exchanges in this demo. Everything is simulated: no goods, money or commitments are involved.</p></div>
    <div class="seg" role="group" aria-label="Scope"><button data-act="act-scope" data-v="mine" aria-pressed="${scope === "mine"}">${esc(c.name)}</button><button data-act="act-scope" data-v="all" aria-pressed="${scope === "all"}">All companies</button></div></div>
  <div class="grid-main">
    <div class="stack" style="min-width:0">
      <h2>In progress</h2>
      ${liveEx.length ? liveEx.map(row).join("") : `<div class="empty"><h3>No open exchanges</h3><p class="small">Open an exchange from Exchange Matches and approve it to begin.</p><button class="btn sm" data-go="matches" style="margin-top:6px">Go to matches</button></div>`}
      ${past.length ? `<h2>Closed in this session</h2>${past.map(row).join("")}` : ""}
      <h2>Sample history</h2>
      <div class="note small">Fictional entries included so the page is not empty on first open. They did not come from your actions.</div>
      ${hist.map((h) => `<div class="card flat"><div class="row"><b>${esc(h.title)}</b>${statusPill(h.status)}<span class="pill sim">Sample</span></div><div class="small muted" style="margin-top:4px">${esc(h.parties.join(", "))} · ${h.daysAgo} days ago</div>${h.note ? `<div class="small faint">${esc(h.note)}</div>` : ""}</div>`).join("") || `<p class="small faint">No sample entries for this company.</p>`}
    </div>
    <aside class="card" style="min-width:0"><h3>Event log</h3><div style="margin-top:6px">${logs.map((a) => `<div class="small" style="padding:7px 0;border-top:1px solid var(--line)"><div>${esc(a.text)}</div><div class="faint">${ago(a.at)} · simulated</div></div>`).join("") || `<p class="small faint">No events yet.</p>`}</div></aside>
  </div>`;
}

/* ---- 8. How it works ---- */
function pageHow() {
  const t = (cols, rows) => `<div class="tw"><table><thead><tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((x) => `<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const results = ui.checks;
  return `
  <div class="page-head"><div><h1>How matching works</h1><p>What this prototype calculates, what it assumes, and how it differs from the research model behind it.</p></div>
    <a class="btn" href="research-lab.html">Open the research lab</a></div>
  <div class="stack">
    <section class="card"><h2>From inventory to exchanges</h2>
      <ol class="small" style="margin:10px 0 0;padding-left:18px;max-width:78ch"><li style="margin-bottom:5px"><b>Compatibility.</b> Each company's preferences are compared with each lot's specifications. This builds a directed graph: an edge means "this company would accept this lot".</li>
      <li style="margin-bottom:5px"><b>Cycle search.</b> All 2-, 3- and 4-way cycles are listed. A cycle cannot include the same company twice.</li>
      <li style="margin-bottom:5px"><b>Economic test.</b> Each company's gain is <code>value received − fallback value given up − logistics paid</code>. Under the default rule, everyone must gain. Expected gain after dropout risk must be positive.</li>
      <li style="margin-bottom:5px"><b>Optimization.</b> An exact solver picks the non-overlapping set with the highest total expected gain. A lot can join only one exchange.</li>
      <li><b>Independent check.</b> Selected exchanges are re-derived from the raw lots before being shown.</li></ol>
      <p class="small muted" style="margin-top:10px">The solver maximizes total gain across all companies. It is not designed to favor any single company, so a route that looks best for you can lose to a better overall round.</p></section>
    <section class="card"><h2>Prototype assumptions</h2><p class="small muted" style="margin:3px 0 10px">Written for this demo. None has been validated with real companies or trades.</p>
      ${t(["Item", "Rule used here", "Status"], [
        ["Compatibility", "A lot qualifies if it meets every stated requirement in at least one profile (category, fiber share, excluded fibers, GSM, width, quantity, color, certification, distance). Or if it is on the wishlist.", "Prototype assumption. Real fit also depends on hand, drape, shade and quality, which are not modelled"],
        ["Value to a recipient (W)", "Listed value × profile value factor. Missing a preferred color lowers it by 10%.", "Prototype assumption. Factors are stated by the company and uncalibrated"],
        ["Listed value", "Owner's estimate.", "Self-reported. No price discovery or verification"],
        ["Fallback value (S)", "Owner-stated share of listed value. Demo lots use 45-60%.", "Assumed. The research used a 30-70% range"],
        ["Weight", "Quantity × width × GSM.", "Physical formula. Ignores core and packaging"],
        ["Logistics", "₩30,000 per shipment + ₩150 per km per 50 kg, straight-line distance, 8 km floor.", "Assumed. Carried over from the research, not carrier rates"],
        ["Dropout risk", "5% per company; an exchange succeeds with (1−risk)^k; half of logistics is sunk on failure.", "Assumed. Carried over from the research"],
        ["Simulated approval", "A company approves if its gain clears its stated minimum.", "Illustrative only. Not a model of behaviour"],
      ])}</section>
    <section class="card"><h2>Research model and this prototype</h2>
      ${t(["Topic", "Research model", "This prototype", "Why"], [
        ["Graph node", "One firm with one lot", "One inventory lot", "Companies hold many lots. With one lot per company the two are identical"],
        ["Packing limit", "Each firm in at most one cycle", "Each lot in at most one cycle; a company may join several cycles with different lots", "Multiple lots per company"],
        ["Inside a cycle", "Firms are distinct by construction", "Explicit rule: no company twice", "A company must not trade with itself"],
        ["Acceptance", "Random draw", "Derived from specifications and preferences", "Requested change. Results are therefore not comparable with the research percentages"],
        ["Own fabric type", "Never accepted", "Allowed if preferences say so", "Now an explicit choice"],
        ["Subjective value", "Random lognormal draw", "Listed value × stated factor", "Companies can state it. Removes noise, adds an unverified assumption"],
        ["Lot weight", "Derived from value", "Derived from specifications", "Real specifications are now available"],
        ["Unchanged", "Enumeration walk, net gain, regimes, expected profit, exact solver", "Same", "Reused from research code"],
      ])}
      <div class="note ok" style="margin-top:10px"><b>Consistency check.</b> With one lot per company and research data fed in, this engine chose the same cycles as the research engine in all 900 comparisons run during development. That shows the logic carries over. It does not validate the textile assumptions above.</div></section>
    <section class="card"><h2>Credits are not payments</h2><p class="small" style="margin-top:6px;max-width:78ch">Mutual gain is the default and uses no credits. <b>Balancing credits</b> and <b>Surplus split</b> are research mechanisms kept for comparison. Balancing credits are not budget-balanced: the payer's amount and the receiver's amount differ, so this could not operate as a ledger as written. Surplus split assumes gains can be shared perfectly. Neither is a wallet, invoice, payment or settlement feature, and nothing is held or transferred.</p></section>
    <section class="card"><h2>What is not here</h2><ul class="small" style="margin:8px 0 0;padding-left:18px;max-width:78ch"><li>Real companies, verification, contracts, carriers, payments, tax or customs handling</li><li>Splitting a lot, or partial quantities</li><li>Physical quality checks: swatch stages are simulated labels only</li><li>Protection against misreported lots or values, and any evidence that companies would adopt this</li><li>Chains that do not close into a cycle, and arrivals over time</li></ul></section>
    <section class="card"><div class="between"><div><h2>Built-in checks</h2><p class="small muted">Small markets with hand-worked answers, plus workflow safeguards.</p></div><button class="btn primary" data-act="run-checks">${results ? "Run again" : "Run checks"}</button></div>
      ${results ? `<div class="note ${results.every((r) => r.ok) ? "ok" : "warn"}" style="margin-top:10px"><b>${results.filter((r) => r.ok).length} of ${results.length} checks passed</b></div>
      <div style="margin-top:8px">${results.map((r) => `<details style="padding:5px 0;border-top:1px solid var(--line)"><summary><span class="tick ${r.ok ? "y" : "n"}" style="margin-right:6px">${r.ok ? "✓" : "×"}</span>${esc(r.title)}</summary>${t(["Check", "Expected", "Engine"], r.rows.map((x) => [esc(x.label), esc(x.expected), esc(x.actual)]))}</details>`).join("")}</div>` : ""}</section>
  </div>`;
}
</script>
<script>
/* ===========================================================================
 * App shell: routing, commits, interactions, drawer, guided demo.
 * ======================================================================== */
const PAGES = {
  dashboard: ["Dashboard", pageDashboard], inventory: ["My Inventory", pageInventory], preferences: ["My Preferences", pagePreferences],
  marketplace: ["Marketplace", pageMarketplace], matches: ["Exchange Matches", pageMatches], activity: ["Activity", pageActivity], how: ["How it works", pageHow],
};
const mySigs = () => new Set(M ? Engine.companyView(state, M, state.current).eligible.map((i) => i.sig) : []);

/** Any change to inventory, preferences, decisions or rules comes through here. */
function commit(message, opts = {}) {
  const before = mySigs();
  const closed = Engine.revalidate(state);
  M = Engine.computeMarket(state);
  saveState();
  const after = mySigs();
  const added = [...after].filter((s) => !before.has(s)).length, removed = [...before].filter((s) => !after.has(s)).length;
  const bits = [];
  if (message) bits.push(message);
  if (!opts.quiet && (added || removed)) bits.push(`Matches updated for ${me().name}: ${added ? `+${added} new` : ""}${added && removed ? ", " : ""}${removed ? `${removed} no longer available` : ""}`);
  if (closed) bits.push(`${closed} open proposal${closed === 1 ? "" : "s"} closed`);
  if (!storageOk) bits.push("Could not save in this browser, so changes last only until you close the page");
  if (bits.length) toast(bits.join(". ") + ".");
  render();
}
let toastTimer;
function toast(msg) {
  ui.toast = msg;
  const el = $("#toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; ui.toast = null; }, 4200);
}

/* ---- Routing and render ---- */
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("exchange/")) { ui.page = "exchange"; ui.sig = h.slice(9); return; }
  ui.page = PAGES[h] ? h : "dashboard"; ui.sig = null;
}
function setHash(h) { try { history.replaceState(null, "", "#" + h); } catch (e) { /* non-navigable origin */ } }
function go(page, sig) {
  ui.page = page; ui.sig = sig || null;
  setHash(page === "exchange" ? "exchange/" + encodeURIComponent(sig) : page);
  render();
  window.scrollTo(0, 0);
  const main = $("#main");
  if (main) main.focus({ preventScroll: true });
}
function render() {
  const active = document.activeElement, focusId = active && active.id ? active.id : null;
  const caret = focusId && active.selectionStart != null ? active.selectionStart : null;
  renderShell();
  $("#page").innerHTML = ui.page === "exchange" ? pageExchange() : PAGES[ui.page][1]();
  renderOverlay();
  renderTour();
  hydrateGraphs();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el.tagName !== "BUTTON") {
      el.focus({ preventScroll: true });
      if (caret != null && el.setSelectionRange && el.type !== "number") { try { el.setSelectionRange(caret, caret); } catch (e) { /* unsupported input */ } }
    }
  }
}
function renderShell() {
  const c = me(), v = Engine.companyView(state, M, c.id);
  const waiting = state.exchanges.filter((e) => e.status === "proposed" && e.companies.includes(c.id) && !e.approvals[c.id]).length;
  const item = (key, label, count) => `<button data-go="${key}" ${ui.page === key || (ui.page === "exchange" && key === "matches") ? 'aria-current="page"' : ""}><span>${label}</span>${count ? `<span class="count">${count}</span>` : ""}</button>`;
  $("#side").innerHTML = `
    <div class="side-top">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="#1f4d3a" stroke-width="3.5"/><path d="M16 5a11 11 0 0 1 9.5 16.5" fill="none" stroke="#b0603a" stroke-width="3.5" stroke-linecap="round"/></svg><b>Reweft</b></div>
      <div class="switcher"><label for="co-switch">Viewing as</label><select id="co-switch" data-tour="switcher">${state.companies.map((x) => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
    </div>
    <nav class="nav" aria-label="Main">
      ${item("dashboard", "Dashboard")}${item("inventory", "My Inventory", state.lots.filter((l) => l.owner === c.id && l.status === "active").length)}${item("preferences", "My Preferences")}${item("marketplace", "Marketplace")}${item("matches", "Exchange Matches", v.eligible.length)}${item("activity", "Activity", waiting)}
      <div class="nav-sep"></div>${item("how", "How it works")}
    </nav>
    <div class="side-foot"><button class="btn sm" style="width:100%;text-decoration:none;margin-bottom:8px" data-act="tour-start">Guided demo</button>
      Fictional demo companies. Edits stay in this browser. <button data-act="reset">Reset demo</button></div>`;
}

/* ---- Drawer ---- */
function blankLot() {
  return { name: "", category: "Cotton woven", compositionText: "100% cotton", gsm: 150, width: 150, colorFamily: "Ecru", color: "", qty: 200, city: me().city, value: 2000000, outsidePct: 0.5, certs: [], note: "", photos: [] };
}
function openLotForm(lot, draftOverride) {
  ui.drawer = { type: "lot", id: lot ? lot.id : null, errors: {},
    draft: draftOverride || (lot ? Object.assign({}, lot, { compositionText: Engine.compositionText(lot.composition), photos: (lot.photos || []).slice(), certs: (lot.certs || []).slice() }) : blankLot()) };
  renderOverlay();
}
function renderOverlay() {
  const host = $("#overlay"), d = ui.drawer;
  if (!d) { host.innerHTML = ""; return; }
  if (d.rendered && d.type === "lot" && !d.force) return;
  d.rendered = true; d.force = false;
  if (d.type === "lot") {
    host.innerHTML = `<div class="scrim" data-act="close-drawer"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="${d.id ? "Edit lot" : "Add a lot"}">
      <header><h2>${d.id ? "Edit lot" : "Add a lot"}</h2><button class="btn ghost" data-act="close-drawer" aria-label="Close">×</button></header>
      <div class="body">${lotForm()}</div>
      <footer><button class="btn" data-act="close-drawer">Cancel</button><button class="btn primary" data-act="save-lot" data-tour="save-lot">${d.id ? "Save changes" : "Add to inventory"}</button></footer></div>`;
    const inp = $("#photo-in");
    if (inp) inp.onchange = async () => {
      captureDraft();
      try { for (const f of Array.from(inp.files).slice(0, 3 - d.draft.photos.length)) d.draft.photos.push(await readPhoto(f)); d.errors.photos = null; }
      catch (e) { d.errors.photos = e.message; }
      d.force = true; renderOverlay();
    };
  } else if (d.type === "view") {
    const l = lotOf(d.id);
    host.innerHTML = `<div class="scrim" data-act="close-drawer"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="Lot details"><header><h2>${esc(l.name)}</h2><button class="btn ghost" data-act="close-drawer" aria-label="Close">×</button></header><div class="body">${lotDetail(l)}</div></div>`;
  } else if (d.type === "confirm") {
    host.innerHTML = `<div class="scrim" data-act="close-drawer"></div><div class="drawer" role="alertdialog" aria-modal="true" aria-label="${esc(d.title)}" style="height:auto;bottom:auto;top:18vh;right:50%;transform:translateX(50%);width:min(440px,92vw);border-radius:14px"><div class="body"><h2>${esc(d.title)}</h2><p class="muted" style="margin-top:8px">${esc(d.text)}</p></div><footer><button class="btn" data-act="close-drawer">Cancel</button><button class="btn ${d.danger ? "danger" : "primary"}" data-act="confirm-yes">${esc(d.yes)}</button></footer></div>`;
  }
}
function captureDraft() {
  const form = $("#lot-form");
  if (!form || !ui.drawer) return;
  const fd = new FormData(form), dr = ui.drawer.draft;
  for (const k of ["name", "category", "city", "colorFamily", "color", "note"]) dr[k] = fd.get(k);
  dr.compositionText = fd.get("composition");
  for (const k of ["gsm", "width", "qty", "value"]) dr[k] = fd.get(k);
  dr.outsidePct = Number(fd.get("outsidePct")) / 100;
  dr.certs = fd.getAll("cert");
}
function saveLotFromForm() {
  captureDraft();
  const d = ui.drawer, dr = d.draft, e = {};
  if (!String(dr.name).trim()) e.name = "Give this lot a name.";
  const parsed = Engine.parseComposition(dr.compositionText);
  if (parsed.error) e.composition = parsed.error;
  for (const [k, label] of [["gsm", "GSM"], ["width", "Width"], ["qty", "Quantity"], ["value", "Estimated value"]]) if (!(Number(dr[k]) > 0)) e[k] = `${label} must be greater than zero.`;
  if (!(dr.outsidePct >= 0 && dr.outsidePct <= 1)) e.outsidePct = "Enter a percentage from 0 to 100.";
  if (Object.keys(e).length) {
    d.errors = e; d.force = true; renderOverlay();
    const first = document.querySelector("#lot-form .err");
    if (first) first.scrollIntoView({ block: "center" });
    return false;
  }
  const data = { name: String(dr.name).trim(), category: dr.category, city: dr.city, colorFamily: dr.colorFamily, color: String(dr.color).trim(), note: String(dr.note || "").trim(),
    composition: parsed.composition, gsm: Number(dr.gsm), width: Number(dr.width), qty: Number(dr.qty), value: Number(dr.value), outsidePct: dr.outsidePct, certs: dr.certs, photos: dr.photos || [] };
  let msg;
  if (d.id) { Object.assign(lotOf(d.id), data); msg = `${data.name} updated`; }
  else {
    const id = "U" + String(state.nextLot++).padStart(2, "0");
    state.lots.push(Object.assign({ id, owner: state.current, status: "active" }, data));
    msg = `${data.name} added`;
    ui.lastAdded = id;
  }
  ui.drawer = null; renderOverlay();
  commit(msg);
  return true;
}

/* ---- Actions ---- */
const updateProfile = (pid, fn) => { const p = me().profiles.find((x) => x.id === pid); if (p) { fn(p); commit(); } };
const ACT = {
  "new-lot": () => openLotForm(null),
  "edit-lot": (el) => openLotForm(lotOf(el.dataset.id)),
  "view-lot": (el) => { ui.drawer = { type: "view", id: el.dataset.id }; renderOverlay(); },
  "close-drawer": () => { ui.drawer = null; renderOverlay(); },
  "save-lot": () => saveLotFromForm(),
  "rm-photo": (el) => { captureDraft(); ui.drawer.draft.photos.splice(+el.dataset.i, 1); ui.drawer.force = true; renderOverlay(); },
  "remove-lot": (el) => {
    const l = lotOf(el.dataset.id);
    ui.drawer = { type: "confirm", title: `Remove ${l.name}?`, text: "It leaves the matching pool. Open proposals that use it will close. You can restore it only by resetting the demo.", yes: "Remove lot", danger: true,
      run: () => { state.lots = state.lots.filter((x) => x.id !== l.id); commit(`${l.name} removed`); } };
    renderOverlay();
  },
  "confirm-yes": () => { const run = ui.drawer.run; ui.drawer = null; renderOverlay(); run(); },
  "toggle-pause": (el) => { const l = lotOf(el.dataset.id); l.status = l.status === "paused" ? "active" : "paused"; commit(`${l.name} ${l.status === "paused" ? "paused" : "back in the pool"}`); },
  "inv-filter": (el) => { ui.invFilter = el.dataset.v; render(); },
  "pf-chip": (el) => updateProfile(el.dataset.pid, (p) => {
    const f = el.dataset.field, v = el.dataset.v; p[f] = p[f] || [];
    p[f] = p[f].includes(v) ? p[f].filter((x) => x !== v) : p[f].concat(v);
  }),
  "pf-add": () => { const c = me(); c.profiles = c.profiles || []; c.profiles.push({ id: "p" + Date.now().toString(36), name: "New profile", categories: [], valueFactor: 1 }); commit(); },
  "pf-remove": (el) => { const c = me(); c.profiles = c.profiles.filter((p) => p.id !== el.dataset.pid); commit("Profile removed"); },
  "set-override": (el) => {
    const c = me(); c.overrides = c.overrides || {};
    if (el.dataset.v) c.overrides[el.dataset.id] = el.dataset.v; else delete c.overrides[el.dataset.id];
    commit(el.dataset.v ? "Added to wishlist" : "Removed from wishlist");
  },
  "clear-override": (el) => { delete me().overrides[el.dataset.id]; commit(); },
  "mp-fit": (el) => { ui.mp.fit = el.dataset.v; render(); },
  "mp-clear": () => { ui.mp = { q: "", cat: "all", fiber: "all", city: "all", color: "all", gsmMin: "", gsmMax: "", qtyMin: "", fit: "all" }; render(); },
  "set-L": (el) => { state.settings.L = +el.dataset.v; if (ui.matchK !== "all" && +ui.matchK > state.settings.L) ui.matchK = "all"; commit(); },
  "set-regime": (el) => { state.settings.regime = el.dataset.v; commit(); },
  "toggle-rules": () => { ui.rulesOpen = !ui.rulesOpen; render(); },
  "match-k": (el) => { ui.matchK = el.dataset.v; render(); },
  "match-scope": (el) => { ui.matchScope = el.dataset.v; render(); },
  "act-scope": (el) => { ui.actScope = el.dataset.v; render(); },
  "open-ex": (el) => go("exchange", el.dataset.sig),
  approve: (el) => approveAs(el.dataset.sig, state.current),
  decline: (el) => {
    const it = itemFor(el.dataset.sig);
    if (!Engine.findExchange(state, el.dataset.sig)) Engine.propose(state, it);
    const err = Engine.respond(state, el.dataset.sig, state.current, "declined");
    if (err) return toast(err);
    commit(`${me().name} declined. Matches recalculated without this exchange`);
  },
  "simulate-others": (el) => {
    const out = Engine.simulateResponses(state, el.dataset.sig, state.current);
    const no = out.filter((x) => x.decision === "declined");
    commit(no.length ? `${coOf(no[0].cid).name} declined (simulated): ${no[0].reason}` : out.length ? "Other participants approved (simulated)" : "No other responses pending");
  },
  advance: (el) => { const e = Engine.advance(state, el.dataset.sig); if (e) return toast(e); commit("Simulated stage updated"); },
  dropout: (el) => {
    const ex = Engine.findExchange(state, el.dataset.sig);
    const other = ex.companies.find((c) => c !== state.current) || state.current;
    const e = Engine.dropout(state, el.dataset.sig, other);
    if (e) return toast(e);
    commit("Dropout simulated. Lots returned to the pool");
  },
  reopen: (el) => { delete state.declined[el.dataset.sig]; commit("This exchange can be offered again"); },
  "run-checks": () => { ui.checks = Checks.run(); render(); },
  reset: () => {
    ui.drawer = { type: "confirm", title: "Reset the demo?", text: "This restores the original fictional companies and lots, and removes your edits, photos and activity from this browser.", yes: "Reset demo", danger: true, run: resetDemo };
    renderOverlay();
  },
  "toggle-part": (el) => { me().participating = el.checked; commit(el.checked ? "Back in matching" : "Participation paused"); },
  "tour-start": () => {
    ui.drawer = { type: "confirm", title: "Start the guided demo?", text: "The demo starts from the original data, so your edits, photos and activity in this browser will be replaced.", yes: "Reset and start", run: () => { resetDemo(true); tourGo(0); } };
    renderOverlay();
  },
  "tour-next": () => tourNext(),
  "tour-back": () => tourGo(ui.tour - 1),
  "tour-end": () => { ui.tour = null; render(); },
};
function resetDemo(silent) {
  state = Seed.fresh();
  ui.matchK = "all"; ui.matchScope = "mine"; ui.invFilter = "active"; ui.lastAdded = null;
  M = Engine.computeMarket(state);
  saveState();
  if (!silent) toast("Demo reset to its original data.");
  go("dashboard");
}
function approveAs(sig, cid) {
  const it = itemFor(sig);
  if (!it) return toast("This exchange is no longer available.");
  if (!Engine.findExchange(state, sig)) Engine.propose(state, it);
  const err = Engine.respond(state, sig, cid, "approved");
  if (err) return toast(err);
  commit(`${coOf(cid).name} approved (simulated)`, { quiet: true });
}

/* ---- Global events ---- */
document.addEventListener("click", (e) => {
  const actEl = e.target.closest("[data-act]");
  if (actEl && !(actEl.type === "checkbox")) {
    const fn = ACT[actEl.dataset.act];
    if (fn) { if (actEl.tagName === "BUTTON" && actEl.closest("form")) e.preventDefault(); fn(actEl); return; }
  }
  const g = e.target.closest("[data-go]");
  if (g) go(g.dataset.go);
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "co-switch") { state.current = el.value; saveState(); toast(`Now viewing as ${me().name}.`); if (ui.page === "exchange") render(); else render(); return; }
  if (el.dataset.act === "toggle-part") return ACT["toggle-part"](el);
  if (el.dataset.mp) { ui.mp[el.dataset.mp] = el.value; return render(); }
  if (el.dataset.pf) {
    const f = el.dataset.pf, raw = el.value;
    return updateProfile(el.dataset.pid, (p) => {
      const n = raw === "" ? null : Number(raw);
      if (f === "name") p.name = raw || "Untitled profile";
      else if (f === "fiber") { if (raw) p.fiberMin = { fiber: raw, min: p.fiberMin ? p.fiberMin.min : 50 }; else delete p.fiberMin; }
      else if (f === "fibermin") { if (p.fiberMin) p.fiberMin.min = n ?? 0; }
      else if (f === "valueFactor") p.valueFactor = n > 0 ? n : 1;
      else p[f] = n;
    });
  }
  if (el.dataset.co) { const c = me(), n = Number(el.value); if (Number.isFinite(n) && n >= 0) { c[el.dataset.co] = n; commit(); } return; }
  if (el.dataset.rule) {
    const n = Number(el.value), k = el.dataset.rule;
    const lim = { p_fail: [0, 0.95], fail_cost_share: [0, 1], credit_discount: [0, 1], cost_scale: [0, 50], c_fixed: [0, 1e7], c_km: [0, 1e5] }[k];
    if (Number.isFinite(n)) { state.settings[k] = Math.max(lim[0], Math.min(lim[1], n)); commit(); }
  }
});
document.addEventListener("input", (e) => { if (e.target.dataset && e.target.dataset.mp === "q") { ui.mp.q = e.target.value; render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ui.drawer) { ui.drawer = null; renderOverlay(); } });
let lastW = innerWidth, rT;
addEventListener("resize", () => { if (innerWidth !== lastW) { lastW = innerWidth; clearTimeout(rT); rT = setTimeout(hydrateGraphs, 150); } });
addEventListener("hashchange", () => { parseHash(); render(); });

/* ---- Guided demo ---- */
const G = "L01>L03>L05";
const TOUR = [
  { title: "A denim lot with no direct partner", text: "You are Namsan Atelier. You hold 420 m of indigo denim and want fluid viscose. The company with the viscose doesn't want denim, so a normal two-way swap goes nowhere.", go: () => go("dashboard"), target: "hero" },
  { title: "The stuck lot in your inventory", text: "This lot shows a route marked “multi-way only”. No direct swap works for it, but a longer loop does.", go: () => go("inventory"), target: "L01" },
  { title: "What multi-way adds", text: "The same lots and preferences. Direct swaps alone move 2 lots here. Allowing 3- and 4-way cycles moves 9, because more loops can close.", go: () => go("matches"), target: "compare" },
  { title: "Your best route is a 3-way loop", text: "Calculated live from specifications, preferences and costs. Open it to see exactly who sends what.", go: () => go("matches"), target: "guided-card" },
  { title: "Who sends what to whom", text: "Namsan sends denim to Palgong. Palgong sends jersey to Mudeung. Mudeung sends viscose to Namsan. Each company gets something it asked for.", go: () => go("exchange", G), target: "graph" },
  { title: "Why two-way matching fails", text: "Each pair wants something in only one direction. The reasons come directly from each company's stated requirements.", go: () => go("exchange", G), target: "why" },
  { title: "Does everyone actually gain?", text: "Each company's gain is estimated after what it gives up and the logistics it pays. These are estimates built on assumptions, and How it works lists them.", go: () => go("exchange", G), target: "econ" },
  { title: "Approve as Namsan", text: "Press Next to approve on Namsan's behalf. This is a demo decision: nothing is committed.", go: () => go("exchange", G), target: "approval", next: () => approveAs(G, "namsan"), nextLabel: "Approve" },
  { title: "The other companies respond", text: "They are simulated. Each approves if its gain clears the minimum set in its preferences. Press Next to run them.", go: () => go("exchange", G), target: "approval", next: () => ACT["simulate-others"]({ dataset: { sig: G } }), nextLabel: "Simulate" },
  { title: "Lots are reserved and matches recalculate", text: "With all three approved, these lots leave the pool so they can't be promised twice. Any other route that used them disappears.", go: () => go("matches"), target: "compare" },
  { title: "Now add a material of your own", text: "A prefilled poplin lot is open. Change anything you like, then press Next or Add to inventory. Seomjin Linen House has asked for crisp cotton shirting.", go: () => { go("inventory"); openLotForm(null, Object.assign(Seed.tourLot(), { photos: [] })); }, target: "save-lot", next: () => { if ($("#lot-form")) return saveLotFromForm(); return true; }, nextLabel: "Add lot" },
  { title: "Your lot just created a match", text: "Namsan wants Seomjin's linen and Seomjin wants your poplin, so a direct swap appeared. Nothing was pre-scripted: try editing the GSM or quantity and watch it change.", go: () => { ui.matchK = "all"; go("matches"); }, target: null },
  { title: "That is the idea", text: "Everything you saw is a simulation with fictional companies. Switch company, change preferences or add lots to keep exploring. How it works lists every assumption.", go: () => {}, target: null, last: true },
];
function tourGo(i) {
  ui.tour = Math.max(0, Math.min(TOUR.length - 1, i));
  if (ui.drawer && ui.tour !== 10) { ui.drawer = null; renderOverlay(); }
  TOUR[ui.tour].go();
  renderTour();
}
function tourNext() {
  const s = TOUR[ui.tour];
  if (s.next) {
    const res = s.next();
    if (res === false) return; // form errors: stay on this step
    // Already completed by hand? The engine refuses, and the tour simply moves on.
  }
  if (s.last) { ui.tour = null; render(); return; }
  tourGo(ui.tour + 1);
}
function renderTour() {
  $$(".tour-target").forEach((x) => x.classList.remove("tour-target"));
  const host = $("#tour");
  if (ui.tour == null) { host.innerHTML = ""; return; }
  const s = TOUR[ui.tour];
  host.innerHTML = `<div class="tour" role="dialog" aria-label="Guided demo"><div class="bar"><i style="width:${((ui.tour + 1) / TOUR.length) * 100}%"></i></div>
    <div class="small" style="color:#a9c9b6">Step ${ui.tour + 1} of ${TOUR.length}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>
    <div class="between" style="margin-top:12px"><button class="btn ghost sm" data-act="tour-end">${s.last ? "" : "Exit"}</button><div class="row">${ui.tour > 0 && !s.next && !TOUR[ui.tour - 1].next ? `<button class="btn ghost sm" data-act="tour-back">Back</button>` : ""}<button class="btn sm" data-act="tour-next">${esc(s.nextLabel || (s.last ? "Finish" : "Next"))}</button></div></div></div>`;
  if (s.target) {
    const el = document.querySelector(`[data-tour="${CSS.escape(s.target)}"]`);
    if (el) { el.classList.add("tour-target"); el.scrollIntoView({ block: "center", behavior: "auto" }); }
  }
}

/* ---- Start ---- */
M = Engine.computeMarket(state);
Engine.revalidate(state);
parseHash();
render();
</script>
