/* ---- 5. Exchange Matches ---- */
function matchesSummary() {
  const c = me(), s = state.settings, v = Engine.companyView(state, M, c.id), packs = M.packs;
  const totalLots = M.lots.length;
  const mineIn = packs[s.L].selected.filter((x) => x.companies.includes(c.id)).length;
  const movedTheory = M.theory.selected.reduce((a, x) => a + x.k, 0);
  const gainGap = M.theory.value - M.recommended.value;
  const placed = v.committed.filter((x) => x.exchange);
  return `<section class="card" data-tour="compare"><div class="between"><h3>What multi-way adds</h3>${DEMO}</div><p class="small muted">Lots that could move across this demo's companies, counting only exchanges everyone would accept.</p>
        <div class="bars" style="margin-top:12px">${[2, 3, 4].map((L) => {
          const moved = packs[L].selected.reduce((sum, x) => sum + x.k, 0);
          return `<div class="bar-row"><span>${L === 2 ? "Direct swaps only" : `Up to ${L}-way`}</span><div class="bar-track"><div class="bar-fill" style="width:${totalLots ? (moved / totalLots) * 100 : 0}%"></div></div><b class="num" style="text-align:right">${moved} of ${totalLots}</b></div>`;
        }).join("")}</div>
        <p class="small faint" style="margin-top:10px">${M.theory !== M.recommended && gainGap > 0.5 ? `Ignoring everyone's minimum gain, the top set would move ${movedTheory} lots and gain ${won(gainGap)} more on paper, but at least one company wouldn't accept it. ` : ""}Fictional companies and made-up lots: an illustration of the mechanism, not evidence of how a real market would perform.</p></section>
      <section class="card"><h3>For ${esc(c.name)}</h3>
        <div class="row" style="gap:22px;margin-top:8px">
          <div><div style="font:500 26px var(--serif)">${v.ready.length}</div><div class="small muted">Options ready</div></div>
          <div><div style="font:500 26px var(--serif)">${mineIn}</div><div class="small muted">${M.status.proven ? "Recommended" : "Suggested"}</div></div>
          <div><div style="font:500 26px var(--serif)">${v.onlyMultiWay.length}</div><div class="small muted">Lots only multi-way can move</div></div>
        </div>
        <h4 style="margin-top:14px">Where your lots go</h4>
        <div style="margin-top:4px;max-height:210px;overflow-y:auto">${v.committed.map(({ lot, exchange }) => `<div class="between small" style="padding:5px 0;border-top:1px solid var(--line)"><span>${esc(lot.name)}</span>${exchange ? `<span class="pill ok">${exchange.k === 2 ? "Direct swap" : exchange.k + "-way exchange"}</span>` : `<span class="pill">Not placed</span>`}</div>`).join("") || `<p class="small faint">No lots available.</p>`}</div>
        <p class="small muted" style="margin-top:8px">${placed.length > 1 ? `Your company is in ${placed.length} exchanges at once, each with a different lot.` : "A company can join several exchanges at once. Each lot goes to only one."}</p>
      </section>`;
}

function pageMatches() {

function researchLabBlock() {

function pageHow() {
  const t = (cols, rows) => `<div class="tw"><table><thead><tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((x) => `<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const results = ui.checks;
  const st = M.status;
  return `
  <div class="page-head"><div><h1>How matching works</h1><p>What this prototype calculates, what it assumes, and how it differs from the research behind it.</p></div>
    <span id="lab-slot">${researchLabBlock()}</span></div>
  <div class="stack">
    <section class="card"><h2>Two kinds of numbers. Don't mix them.</h2><p class="small muted" style="margin:3px 0 10px">Neither is evidence from a real market.</p>
      ${t(["", "This prototype's demo results", "The original research findings"], [
        ["<b>Source</b>", `${state.companies.length} fictional companies and ${state.lots.length} made-up lots in this browser, written so the mechanism is easy to see`, "A separate simulation: 60 firms with randomly generated acceptance and values, 40 repetitions"],
        ["<b>Purpose</b>", "To show how the exchange works from a company's seat", "To compare mechanisms under stated assumptions"],
        ["<b>Example</b>", "Lots moved in this demo: see What multi-way adds on Exchange Matches", "Lots moved: 5.1% direct swaps, 8.7% up to 3-way, 10.3% up to 4-way, 44.2% frictionless price market"],
        ["<b>What it can't show</b>", "How often real fabrics match, or whether companies would join. The demo data was written to contain good examples", "Real market performance. Results hold only under its assumptions, and were not measured with real firms"],
      ])}
      <div class="note warn" style="margin-top:10px"><b>The two can't be compared.</b> The demo's share of lots moved depends on how its data was written. A high number here doesn't validate the research, and the research percentages don't predict this demo.</div></section>
    <section class="card"><h2>From inventory to exchanges</h2>
      <ol class="small" style="margin:10px 0 0;padding-left:18px;max-width:78ch"><li style="margin-bottom:5px"><b>Compatibility.</b> Each company's sourcing needs are compared with each lot's specifications. This builds a directed graph: an edge means "this company would accept this lot".</li>
      <li style="margin-bottom:5px"><b>Cycle search.</b> All 2-, 3- and 4-way cycles are listed. A cycle can't include the same company twice.</li>
      <li style="margin-bottom:5px"><b>Economic test (feasible).</b> Each company's net gain is <code>W − S − C</code>. Under the default rule, everyone's net gain must be ≥ 0, and expected profit after failure risk must be positive.</li>
      <li style="margin-bottom:5px"><b>Participation test (ready).</b> Each company's gain must also clear its stated minimum. Feasible cycles that fail this stay visible but aren't recommended.</li>
      <li style="margin-bottom:5px"><b>Optimization.</b> A solver picks the non-overlapping set of ready cycles with the highest total expected profit. A lot can join only one cycle; a company can join several with different lots.</li>
      <li><b>Independent check.</b> Selected cycles are re-derived from the raw lots, including lot uniqueness and each minimum.</li></ol>
      <p class="small muted" style="margin-top:10px">The solver maximizes the total across all companies. It doesn't favor any single company, so an option that looks best for you can lose to a better overall set.</p></section>
    <section class="card"><h2>How the search handles a large market</h2><p class="small muted" style="margin:3px 0 8px">The economic equations are unchanged. These steps only change how candidates are found. Last calculation: ${M.lots.length} lots, ${M.cycleCount.toLocaleString("en-US")} feasible cycles found in ${M.timing.search} ms, sets solved in ${M.timing.solve} ms${M.refining ? ", still refining in the background" : ""}.</p>
      <ul class="small" style="margin:6px 0 0;padding-left:18px;max-width:78ch">
        <li><b>Precomputed compatibility.</b> Acceptance and shipping are held in indexed tables, so the graph stays sparse.</li>
        <li><b>Safe pruning.</b> A member's gain depends only on its lot, the lot it receives and where it ships. If that is negative at the cheapest possible shipment, every cycle through that step would fail anyway, so it is skipped. A built-in check compares this with an exhaustive search.</li>
        <li><b>Reachability.</b> A path that can't return to its start within 4 steps is abandoned. Lots with no way in or out are removed.</li>
        <li><b>Budgets, shown openly.</b> The search has a cycle budget, a time limit and a per-lot quota so no lot is starved. If one is hit, the status says "Search cut short". The theoretical Shared gain rule can't be pruned this way and is more likely to reach them.</li>
        <li><b>Quick result, then refinement.</b> A first answer appears immediately, and an inline Web Worker keeps working on the proof. The label changes to "Recommended" only if it is proven.</li>
        <li><b>Blocked exchanges are a sample</b> in large markets. Ready and below-minimum exchanges are found exhaustively unless the status says otherwise.</li>
      </ul></section>
    <section class="card"><h2>Solver status</h2><p class="small muted" style="margin:3px 0 10px">Reported wherever a set is recommended. Current status: <b>${esc(st.label)}</b>.</p>
      ${t(["Status", "Meaning", "Wording used"], [
        ["Proven best set", "All cycles were listed, and branch and bound finished with the optimum proven.", "“Recommended”"],
        ["Best found in the time limit", "All cycles were listed, but the solver stopped at its time limit with a gap to its upper bound.", "“Suggested, not proven best”"],
        ["Search cut short", "Listing stopped at a budget, so some cycles were never considered. Any result is best only among those listed.", "“Suggested, not proven best”"],
      ])}
      <p class="small muted" style="margin-top:8px">The recheck is separate: it confirms the selected set obeys the rules, not that it is the best.</p></section>
    <section class="card"><h2>Glossary: screen wording and model terms</h2>
      ${t(["On screen", "Model term", "Definition"], [
        ["Worth to them", "Subjective value W", "Listed value × value factor × color multiplier"],
        ["What a fit is worth (%)", "Value factor", "Stated by the company. 105% is a factor of 1.05"],
        ["Clearance value", "Outside option S", "Owner-stated share of listed value"],
        ["Shipping", "Logistics cost C", "Domestic or cross-border estimate. See Shipping cost assumptions"],
        ["Net gain", "net", "W − S − C"],
        ["Chance everyone follows through", "succ", "(1 − p_fail)^k"],
        ["Risk-adjusted gain", "Expected profit w", "succ × surplus − (1 − succ) × fail_cost_share × ΣC"],
        ["Minimum acceptable gain", "Participation hurdle", "A cycle is ready if each member's gain ≥ its hurdle"],
        ["Works on paper", "Feasible", "Passes the regime's admissibility test and w > 0"],
        ["Ready", "Feasible and all hurdles met", "The only cycles eligible for recommendation"],
        ["Right fabric, wrong economics", "Compatible, not admissible", "Every edge exists, but the regime's test or w > 0 fails"],
        ["Everyone gains", "ntu regime", "No transfers. net ≥ 0 for all"],

<script>

const PAGES = {
  dashboard: ["Dashboard", pageDashboard], inventory: ["My Inventory", pageInventory], preferences: ["My Preferences", pagePreferences],
  marketplace: ["Marketplace", pageMarketplace], matches: ["Exchange Matches", pageMatches], activity: ["Activity", pageActivity], how: ["How it works", pageHow],
};
const mySigs = () => new Set(M ? Engine.companyView(state, M, state.current).ready.map((i) => i.sig) : []);

/**
 * Any change to inventory, preferences, decisions or rules comes through here.

function commit(message, opts = {}) {
  const before = mySigs();
  const closed = Engine.revalidate(state);
  M = computeNow();
  state.touched = true;
  saveState();
  const after = mySigs();
  const added = [...after].filter((s) => !before.has(s)).length, removed = [...before].filter((s) => !after.has(s)).length;
  const bits = [];
  if (message) bits.push(message);
  if (!opts.quiet && (added || removed)) bits.push(`Matches updated for ${me().name}: ${added ? `+${added} new` : ""}${added && removed ? ", " : ""}${removed ? `${removed} no longer available` : ""}`);
  if (closed) bits.push(`${closed} open proposal${closed === 1 ? "" : "s"} closed`);
  if (!storageOk) bits.push("Couldn't save in this browser, so changes last only until you close the page");
  if (bits.length) toast(bits.join(". ") + ".");
  if (opts.soft) { renderShell(); opts.soft(); } else render();
  refineInBackground();
}

/* ---- Keeping the page responsive: quick answer now, proof continues in a worker ---- */
const QUICK = { timeLimitMs: 150, enumMs: 800, blockedMs: 100 };
const computeNow = () => Engine.computeMarket(state, QUICK);
let refineWorker = null, refineUrl = null;
function refineInBackground() {
  if (refineWorker) { refineWorker.terminate(); refineWorker = null; }
  const market = M;
  const jobs = [];
  for (const L of [2, 3, 4]) if (!market.packs[L].optimal) jobs.push({ key: L, pack: market.packs[L] });
  if (market.theory !== market.packs[market.settings.L] && !market.theory.optimal) jobs.push({ key: "theory", pack: market.theory });
  market.refining = jobs.length > 0;
  if (!jobs.length) return;
  try {
    if (!refineUrl) {
      const src = `const KX = {}; (${globalThis.KX_MODULES[0].toString()})(KX);
        self.onmessage = (e) => { const out = []; for (const j of e.data.jobs) { const s = KX.solvePacking(e.data.n, j.cands, { timeLimitMs: e.data.ms }); out.push({ key: j.key, selected: s.selected, value: s.value, optimal: s.optimal, upperBound: s.upperBound }); self.postMessage({ partial: out[out.length - 1] }); } self.postMessage({ done: true }); };`;
      refineUrl = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    }
    const w = new Worker(refineUrl);
    refineWorker = w;
    w.onmessage = (e) => {
      if (market !== M) { w.terminate(); return; }
      if (e.data.partial) applyRefinement(market, jobs, e.data.partial);
      if (e.data.done) { market.refining = false; w.terminate(); if (refineWorker === w) refineWorker = null; refreshAfterRefine(); }
    };
    w.onerror = () => { market.refining = false; w.terminate(); refreshAfterRefine(); };
    w.postMessage({ n: market.G.n, ms: 12000, jobs: jobs.map((j) => ({ key: j.key, cands: j.pack.cands.map((c) => ({ nodes: Array.from(c.nodes), w: c.w })) })) });
  } catch (err) {
    market.refining = false; // No worker: the quick result stands, labelled as not proven.
  }
}
function applyRefinement(market, jobs, r) {
  const job = jobs.find((j) => j.key === r.key);
  if (!job) return;
  const p = job.pack;
  // Keep whichever set is worth more. Status comes from the run that produced it.
  if (r.value >= p.value - 1e-9) {
    p.selected = r.selected.map((i) => p.cands[i]);
    p.value = r.value; p.optimal = r.optimal; p.upperBound = r.upperBound;
    p.planned = p.selected.reduce((a, c) => a + c.k, 0);
  }
  if (r.key === market.settings.L) {
    Engine.applyRecommendation(market);
    market.audit = Engine.auditPacking(state, market);
  }
  refreshAfterRefine();
}
function refreshAfterRefine() {

}

function renderLabSlot() { const s = $("#lab-slot"); if (s) s.innerHTML = researchLabBlock(); }
function checkResearchLab() {
  const done = (ok) => { ui.lab = !!ok; renderLabSlot(); };
  const proto = location.protocol;
  if (proto === "http:" || proto === "https:") {
    fetch("research-lab.html", { cache: "no-store" })
      .then((r) => (r.ok ? r.text() : "")).then((t) => done(t.includes("Deadstock Exchange Lab"))).catch(() => done(false));
    return;
  }
  if (proto !== "file:") return done(false);
  // fetch() is blocked on file://. A script element loads the file without running it:
  // an HTML page can't parse as JavaScript, so it stops at a syntax error, and a missing
  // file fires onerror. The expected syntax error is silenced for this one file.
  const swallow = (ev) => { if (!ev.filename || ev.filename.includes("research-lab.html")) ev.preventDefault(); };
  window.addEventListener("error", swallow);
  const probe = document.createElement("script");
  probe.src = "research-lab.html";
  const finish = (ok) => { window.removeEventListener("error", swallow); probe.remove(); done(ok); };
  probe.onload = () => finish(true);
  probe.onerror = () => finish(false);
  document.head.appendChild(probe);
}

const currentTour = () => TOURS[ui.tourKey || "quick"];
function startTour(key) {
  const begin = () => { resetDemo(true); ui.tourKey = key; tourGo(0); };
  if (!state.touched) return begin();
  openDrawer({ type: "confirm", title: "Start the demonstration?", text: "It starts from the original data, so your edits, photos and activity in this browser will be replaced.", yes: "Reset and start", run: begin });
}
function tourGo(i) {
  const list = currentTour();
  ui.tour = Math.max(0, Math.min(list.length - 1, i));
  if (ui.drawer && !list[ui.tour].drawer) { ui.drawer = null; renderOverlay(); }
  list[ui.tour].go();
  renderTour();
  if (list[ui.tour].run) list[ui.tour].run();
  const n = $("#tour-next");
  if (n && !ui.drawer) n.focus({ preventScroll: true });
}
function tourNext() {
  const s = currentTour()[ui.tour];
  if (s.next) {
    const res = s.next();
    if (res === false) return; // form errors: stay on this step
  }
  if (s.last) { ui.tour = null; render(); return; }
  tourGo(ui.tour + 1);
}
function renderTour() {
  $$(".tour-target").forEach((x) => x.classList.remove("tour-target"));
  const host = $("#tour");
  if (ui.tour == null) { host.innerHTML = ""; return; }
  const list = currentTour(), s = list[ui.tour];
  host.innerHTML = `<div class="tour" role="dialog" aria-label="Guided demonstration"><div class="bar"><i style="width:${((ui.tour + 1) / list.length) * 100}%"></i></div>
    <div class="small" style="color:#a9c9b6">Step ${ui.tour + 1} of ${list.length}</div><h3>${esc(s.title)}</h3><p>${esc(typeof s.text === "function" ? s.text() : s.text)}</p>
    <div class="between" style="margin-top:12px"><button class="btn ghost sm" id="tour-exit" data-act="tour-end">${s.last ? "Close" : "Exit"}</button><div class="row">${ui.tour > 0 && !s.next && !list[ui.tour - 1].next ? `<button class="btn ghost sm" id="tour-back" data-act="tour-back">Back</button>` : ""}${s.alt ? `<button class="btn sm" id="tour-alt" data-act="tour-alt">${esc(s.alt.label)}</button>` : ""}<button class="btn sm" id="tour-next" data-act="tour-next">${esc(s.nextLabel || (s.last ? "Finish" : "Next"))}</button></div></div></div>`;
  if (s.target) {
    const el = document.querySelector(`[data-tour="${CSS.escape(s.target)}"]`);
    if (el) { el.classList.add("tour-target"); el.scrollIntoView({ block: "center", behavior: "auto" }); }
  }
}

/* ---- Start ---- */
Engine.revalidate(state);
M = computeNow();
parseHash();
render();
checkResearchLab();
refineInBackground();
if (!state.welcomed) { ui.drawer = { type: "welcome" }; renderOverlay(); }
